<!DOCTYPE html>
<html lang="en">
<!--
════════════════════════════════════════════════════════════════════════════
  DAILY PLAN & SOCIAL APP — component-driven, framework-ready UI kit
════════════════════════════════════════════════════════════════════════════
  FILE MAP
    <style>  1. Design tokens ....... colors, shadows, radii, motion vars
             2. Base ................ reset, utilities, global a11y
             3. App shell ........... fully-fluid adaptive layout (see below)
             4. Components .......... .ui-* building blocks (match JS below)
             5. Page glue ........... tiny composition-only rules
             6. Hover / press states  pointer-gated micro-interactions
    <script> 1. DATA ............... ALL app content (edit this to reskin)
             2. ICONS .............. named SVG art registry
             3. Helpers ............ h(), singleSelect()
             4. Components ......... pure functions: props -> HTMLElement
             5. Pages .............. composition: components + DATA
             6. App ................ router / bootstrap

  ADAPTIVE LAYOUT (one NavBar component, always full-bleed — there is
  NO device frame at ANY size; widths adapt via fluid tokens and
  auto-fit grids, sizes reorganize but never nest in a container)
    < 1024px ......................... full-screen app + floating bottom dock
    >= 1024px ........................ left sidebar + fluid content column
    >= 1440px ........................ content column widens (token-driven)

  NOTE: the Map page is a STATIC MOCKUP — a hand-drawn SVG city scene
  with hard-coded route/markers. No live tiles, geodata or routing.

  FRAMEWORK PORTING (React / Vue / Svelte)
    * Every component is a pure function (props) => element. Copy the
      function body 1:1 into JSX — props keep the same names, `on:{click}`
      becomes onClick, `attrs` become HTML attributes.
    * DATA is plain serializable JSON — lift it into props, state, or an
      API response unchanged.
    * ICONS are ready-made <svg> JSX strings.
    * CSS class names match component names (.ui-nav <-> NavBar).
════════════════════════════════════════════════════════════════════════════
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Daily plan and social app — schedule, explore and recipes.">
    <meta name="theme-color" content="#EBEAF5">
    <title>Daily Plan & Social App</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter variable font: optical sizing + full weight range (100-900) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">

    <style>
    /* ============================================================
       1. DESIGN TOKENS — every visual decision in one place
       ============================================================ */
    :root {
        /* palette */
        --bg-app: #FFFFFF;
        --text-main: #1C1C1E;
        --text-secondary: #6E6E73;
        --card-purple: #B8A9F5;
        --card-yellow: #FFC56E;
        --card-blue: #B4E0FF;
        --card-pink: #FFB4E7;
        --nav-black: #161617;
        --border-gray: #EFEFF0;
        --icon-bg: #F3F4F6;
        --bg-dark-page: #161617;
        --bg-dark-card: #2C2C2E;
        --bg-dark-hover: #3A3A3C;
        --bg-dark-post: #252528;
        --text-dark-secondary: #B0B0B0;
        --text-dark-muted: #AEAEB2;
        --focus-ring: #5B5FEF;

        /* shape & motion */
        --radius-lg: 24px;
        --radius-md: 20px;
        --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);

        /* layered "floating card" shadows — soft, subtle, stacked */
        --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
        --shadow-md: 0 2px 4px rgba(16, 24, 40, 0.04), 0 12px 24px -6px rgba(16, 24, 40, 0.10);
        --shadow-lg: 0 2px 6px rgba(16, 24, 40, 0.05), 0 24px 48px -12px rgba(16, 24, 40, 0.16);
        --shadow-dock: 0 6px 16px rgba(0, 0, 0, 0.18), 0 24px 48px -12px rgba(0, 0, 0, 0.32);
        --shadow-badge: 0 2px 6px rgba(0, 0, 0, 0.24);
        /* hairline top-light for dark surfaces */
        --inset-dark: inset 0 1px 0 rgba(255, 255, 255, 0.06);

        /* fluid layout controls (overridden at large breakpoints) */
        --content-max: 960px;
        --page-pad: clamp(20px, 4vw, 48px);
    }

    /* ============================================================
       2. BASE — reset, utilities, global a11y
       ============================================================ */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
        background: var(--card-purple);
        color: var(--text-main);
    }

    body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-optical-sizing: auto;
        background: var(--bg-app);
    }

    button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
    }

    :focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
    }

    .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }

    /* tone utilities — reusable by ANY card-like component */
    .tone-yellow { background: var(--card-yellow); }
    .tone-blue   { background: var(--card-blue); }
    .tone-pink   { background: var(--card-pink); }
    .tone-purple { background: var(--card-purple); }

    /* ============================================================
       3. APP SHELL — always native & full-bleed (NO device frame at
       any size). <1024px floating dock | >=1024px sidebar. Fluid in
       between via --content-max / --page-pad and auto-fit grids.
       ============================================================ */

    /* --- base: phones & tablets → full-screen app --- */
    .app-shell {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: var(--bg-app);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .app-content {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    .app-header {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 20px 20px 16px;
        background: var(--bg-app);
        z-index: 10;
    }

    .app-main {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: none;
    }
    .app-main::-webkit-scrollbar { display: none; }

    /* breathing room so the floating dock never covers content */
    .app-pages { padding: 0 20px calc(104px + env(safe-area-inset-bottom)); }

    .page { display: none; animation: fadeSlideIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .page.active { display: block; }

    @keyframes fadeSlideIn {
        from { opacity: 0.4; transform: translateY(10px); }
        to   { opacity: 1;   transform: translateY(0); }
    }

    /* --- >=1024px (and tall enough): left sidebar + fluid content column --- */
    @media (min-width: 1024px) and (min-height: 500px) {
        .app-shell { flex-direction: row; }

        .app-header {
            width: 100%;
            max-width: calc(var(--content-max) + 2 * var(--page-pad));
            margin: 0 auto;
            padding: 28px var(--page-pad) 16px;
        }

        .app-pages { padding: 0 var(--page-pad) 48px; }
        .app-pages .page {
            max-width: var(--content-max);
            margin: 0 auto;
        }

        /* plan cards flow to fill whatever width they get */
        .ui-grid--2.home-plan-grid {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
    }

    /* --- >=1440px: widen the content column via the token --- */
    @media (min-width: 1440px) and (min-height: 500px) {
        .app-shell { --content-max: 1100px; }
    }

    /* ============================================================
       4. GENERIC COMPONENTS (.ui-* — 1:1 with JS component names)
       NavBar Avatar AvatarStack IconBtn Button Chip Tag SectionTitle
       ScrollRow SearchBar PersonRow HeroCard InfoCard StoryItem
       FeedPost RecipeRow StatCard AchievementTile MenuRow ProfileHead
       AppHeader  + tone/grid utilities
       ============================================================ */

    /* ---------- NavBar (floating dock <-> left sidebar, CSS-only swap) ---------- */
    .ui-nav {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom));
        z-index: 50;
        display: flex;
        gap: 4px;
        /* frosted black pill — content glows softly through it */
        background: rgba(22, 22, 23, 0.88);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        backdrop-filter: blur(16px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 40px;
        padding: 10px 14px;
        box-shadow: var(--shadow-dock);
    }
    .ui-nav__brand { display: none; }
    .ui-nav__label { display: none; }
    .ui-nav__btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        transition: all 0.3s var(--spring);
        color: #FFFFFF;
    }
    .ui-nav__btn svg {
        width: 24px; height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.2s, fill 0.2s;
    }
    .ui-nav__btn.is-active { background: #FFFFFF; color: var(--nav-black); }
    .ui-nav__btn.is-active svg { fill: currentColor; }

    @media (min-width: 1024px) and (min-height: 500px) {
        .ui-nav {
            position: static;
            transform: none;
            order: -1;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            width: clamp(212px, 18vw, 240px);  /* sidebar width adapts too */
            height: 100%;
            flex-shrink: 0;
            background: var(--bg-app);
            border: none;
            border-right: 1px solid var(--border-gray);
            border-radius: 0;
            box-shadow: none;
            padding: 28px 16px;
        }
        .ui-nav__brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            margin-bottom: 24px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }
        .ui-nav__brand-dot {
            width: 28px; height: 28px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--card-purple), var(--card-pink));
            flex-shrink: 0;
        }
        .ui-nav__label { display: inline; font-size: 14px; font-weight: 500; }
        .ui-nav__btn {
            width: 100%;
            height: auto;
            flex-direction: row;
            justify-content: flex-start;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 16px;
            color: var(--text-secondary);
        }
        .ui-nav__btn svg { width: 22px; height: 22px; }
        .ui-nav__btn.is-active { background: var(--nav-black); color: #FFFFFF; }
    }

    /* ---------- Avatar (photo OR built-in SVG icon placeholder) ---------- */
    .ui-avatar {
        width: var(--size, 40px);
        height: var(--size, 40px);
        border-radius: 50%;
        object-fit: cover;
        background: #E0E0E0;
        flex-shrink: 0;
    }
    /* icon variant: no image request, renders anywhere, scales with --size */
    .ui-avatar--icon {
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--icon-bg);
    }
    .ui-avatar--icon svg {
        width: 58%;
        height: 58%;
    }

    /* ---------- AvatarStack (overlapping faces + "+N" badge) ---------- */
    .ui-avatar-stack { display: flex; align-items: center; }
    .ui-avatar-stack .ui-avatar {
        border: 2px solid rgba(255, 255, 255, 0.6);
        margin-left: -8px;
    }
    .ui-avatar-stack .ui-avatar:first-child { margin-left: 0; }
    .ui-avatar-stack__badge {
        background: #3B3663;
        color: #FFFFFF;
        width: var(--size, 24px);
        height: var(--size, 24px);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
        font-weight: 600;
        margin-left: -8px;
        border: 2px solid rgba(255, 255, 255, 0.6);
    }

    /* ---------- IconBtn ---------- */
    .ui-icon-btn {
        width: 48px; height: 48px;
        border-radius: 50%;
        background: var(--icon-bg);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s var(--spring);
        flex-shrink: 0;
    }
    .ui-icon-btn--ghost {
        width: 36px; height: 36px;
        background: rgba(255, 255, 255, 0.4);
        transition: transform 0.2s;
    }
    .ui-icon-row { display: flex; gap: 10px; margin-top: 16px; }

    /* ---------- Button (dark pill) ---------- */
    .ui-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--nav-black);
        color: #FFFFFF;
        padding: 10px 24px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    /* ---------- Chip (date pill, single-select) ---------- */
    .ui-chip {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 14px;
        background: #FFFFFF;
        border: 1px solid var(--border-gray);
        border-radius: 30px;
        min-width: 54px;
        box-shadow: var(--shadow-xs);
        transition: all 0.2s ease;
    }
    .ui-chip__label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
    .ui-chip__num   { font-size: 15px; font-weight: 600; color: var(--text-main); margin-top: 2px; }
    .ui-chip__dot   { display: block; width: 5px; height: 5px; border-radius: 50%; background: #D1D5DB; margin-top: 4px; }
    .ui-chip.is-active { background: var(--nav-black); border-color: var(--nav-black); }
    .ui-chip.is-active .ui-chip__label,
    .ui-chip.is-active .ui-chip__num { color: #FFFFFF; }
    .ui-chip.is-active .ui-chip__dot { background: #FFFFFF; }

    /* ---------- Tag (filter tag for dark surfaces) ---------- */
    .ui-tag {
        padding: 8px 16px;
        border-radius: 20px;
        background: var(--bg-dark-card);
        color: var(--text-dark-muted);
        white-space: nowrap;
        font-size: 13px;
        flex-shrink: 0;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .ui-tag.is-active { background: var(--card-pink); color: var(--text-main); }

    /* ---------- InfoCard (tinted card: tag + title + lines + footer) ---------- */
    .ui-card {
        border-radius: var(--radius-lg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 180px;
        position: relative;
        transition: transform 0.3s var(--spring), box-shadow 0.3s ease;
    }
    .ui-card__title { font-size: 17px; font-weight: 650; color: var(--text-main); margin-bottom: 4px; letter-spacing: -0.01em; }
    .ui-card__lines { font-size: 11px; color: var(--text-main); line-height: 1.5; font-weight: 500; }
    .ui-card__footer { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .ui-card__art {
        width: 48px; height: 48px;
        display: flex; justify-content: center; align-items: center;
        align-self: flex-end;
    }

    /* ---------- Pill (small translucent label) ---------- */
    .ui-pill {
        display: inline-block;
        background: rgba(255, 255, 255, 0.7);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-main);
        width: fit-content;
        margin-bottom: 6px;
    }

    /* ---------- PersonRow (avatar + two-line label) ---------- */
    .ui-person { display: flex; align-items: center; gap: 8px; }
    .ui-person__text { display: flex; flex-direction: column; }
    .ui-person__role { font-size: 10px; color: rgba(0, 0, 0, 0.6); font-weight: 500; }
    .ui-person__name { font-size: 13px; font-weight: 600; color: var(--text-main); }

    /* ---------- SectionTitle ---------- */
    .ui-h2 { font-size: 20px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    .ui-h2--light { color: #FFFFFF; font-size: 18px; font-weight: 600; }
    .ui-h2--light-sm { color: #FFFFFF; font-size: 16px; font-weight: 600; }

    /* ---------- Dark panel ---------- */
    .ui-panel--dark {
        background: var(--bg-dark-page);
        border-radius: var(--radius-lg);
        padding: 20px 16px;
        color: #FFFFFF;
        box-shadow: var(--inset-dark);
    }

    /* ---------- SearchBar ---------- */
    .ui-search { width: 100%; }
    .ui-search__input {
        background: var(--bg-dark-card);
        border: 1px solid transparent;
        border-radius: 30px;
        padding: 12px 16px;
        width: 100%;
        color: #FFFFFF;
        font-family: inherit;
        font-size: 14px;
        box-shadow: var(--inset-dark);
        transition: all 0.3s ease;
    }
    .ui-search__input::placeholder { color: #9E9EA5; }
    .ui-search__input:focus { outline: none; border-color: var(--card-yellow); background: var(--bg-dark-hover); }
    /* light variant — for light surfaces (map overlays, settings...) */
    .ui-search--light .ui-search__input {
        background: #FFFFFF;
        color: var(--text-main);
        border-color: var(--border-gray);
        box-shadow: var(--shadow-md);
    }
    .ui-search--light .ui-search__input::placeholder { color: var(--text-secondary); }
    .ui-search--light .ui-search__input:focus { border-color: var(--card-purple); background: #FFFFFF; }

    /* ---------- ScrollRow (scrollbar-less horizontal scroller) ---------- */
    .ui-scroll-x { display: flex; overflow-x: auto; scrollbar-width: none; }
    .ui-scroll-x::-webkit-scrollbar { display: none; }

    /* ---------- HeroCard (feature card w/ illustration right) ---------- */
    .ui-hero {
        border-radius: var(--radius-lg);
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        position: relative;
        overflow: hidden;
        transition: transform 0.3s var(--spring), box-shadow 0.3s ease;
    }
    .ui-hero__body { flex: 1; max-width: 60%; z-index: 2; }
    .ui-hero__title { font-size: 22px; font-weight: 700; color: var(--text-main); line-height: 1.2; margin-bottom: 4px; letter-spacing: -0.02em; }
    .ui-hero__sub   { font-size: 12px; color: var(--text-main); opacity: 0.8; margin-bottom: 12px; }
    .ui-hero__art   { width: 100px; height: 100px; margin-top: -10px; margin-right: -15px; z-index: 1; }
    .ui-hero__art svg { width: 100%; height: 100%; display: block; }

    /* ---------- StoryItem ---------- */
    .ui-story {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        transition: transform 0.2s;
    }
    .ui-story__avatar {
        width: 60px; height: 60px;
        border-radius: 50%;
        border: 3px solid var(--card-pink);
        object-fit: cover;
        background: var(--bg-dark-card);
    }
    .ui-story__avatar--add {
        border-color: #555555;
        border-style: dashed;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #FFFFFF;
        font-size: 24px;
    }
    .ui-story__name { font-size: 11px; color: var(--text-dark-secondary); }

    /* ---------- FeedPost ---------- */
    .ui-post { margin-top: 16px; background: var(--bg-dark-post); border-radius: var(--radius-lg); overflow: hidden; }
    .ui-post__media { position: relative; height: clamp(220px, 32vw, 340px); overflow: hidden; }
    .ui-post__img   { width: 100%; height: 100%; object-fit: cover; }
    .ui-post__overlay {
        position: absolute;
        bottom: 12px; left: 12px; right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .ui-post__stats {
        display: flex;
        gap: 12px;
        background: rgba(0, 0, 0, 0.4);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        padding: 6px 12px;
        border-radius: 30px;
        font-size: 12px;
        color: #FFFFFF;
    }
    .ui-post__stats > span { display: flex; align-items: center; gap: 4px; }
    .ui-post__faces { display: flex; }
    .ui-post__faces .ui-avatar { border: 2px solid var(--bg-dark-card); margin-left: -10px; }
    .ui-post__faces .ui-avatar:first-child { margin-left: 0; }
    .ui-post__caption { padding: 16px; background: #FFFFFF; color: var(--text-main); }
    .ui-post__author { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .ui-post__author-name { font-size: 13px; font-weight: 600; }
    .ui-post__text { font-size: 13px; line-height: 1.5; color: #333333; }
    .ui-post__hash { color: #4B5563; margin-top: 4px; font-size: 12px; }

    /* ---------- RecipeRow ---------- */
    .ui-recipe-row {
        background: #FFFFFF;
        border-radius: var(--radius-lg);
        padding: 16px 12px;
        display: flex;
        gap: 16px;
        align-items: center;
        transition: all 0.3s var(--spring);
    }
    .ui-recipe-row__icon {
        width: 80px; height: 80px;
        border-radius: var(--radius-md);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        position: relative;
    }
    .ui-recipe-row__info { flex: 1; display: flex; flex-direction: column; }
    .ui-recipe-row__title { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .ui-recipe-row__meta { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
    .ui-recipe-row__badge {
        background: var(--text-main);
        color: #FFFFFF;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 700;
        position: absolute;
        bottom: 8px; left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        letter-spacing: 0.04em;
        box-shadow: var(--shadow-badge);
    }
    .ui-empty { color: var(--text-dark-muted); font-size: 13px; text-align: center; padding: 16px 0; }

    /* ---------- StatCard ---------- */
    .ui-stat {
        background: #FFFFFF;
        border: 1px solid var(--border-gray);
        border-radius: var(--radius-md);
        padding: 14px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        box-shadow: var(--shadow-xs);
    }
    .ui-stat__icon {
        width: 36px; height: 36px;
        border-radius: 50%;
        background: var(--icon-bg);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .ui-stat__num   { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1; }
    .ui-stat__label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

    /* ---------- AchievementTile ---------- */
    .ui-ach {
        border-radius: var(--radius-md);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-main);
        min-height: 88px;
        transition: transform 0.3s var(--spring);
    }
    .ui-ach__emoji { font-size: 22px; line-height: 1; }

    /* ---------- MenuRow ---------- */
    .ui-menu-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: #FFFFFF;
        border: 1px solid var(--border-gray);
        border-radius: var(--radius-md);
        padding: 10px 14px 10px 10px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main);
        text-align: left;
        box-shadow: var(--shadow-xs);
        transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .ui-menu-row__icon {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--icon-bg);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }
    .ui-menu-row__chevron { margin-left: auto; color: var(--text-secondary); flex-shrink: 0; }

    /* ---------- ProfileHead ---------- */
    .ui-profile-head {
        background: #FFFFFF;
        border: 1px solid var(--border-gray);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
    }
    .ui-profile-head__avatar { border: 3px solid var(--card-purple); margin-bottom: 4px; }
    .ui-profile-head__name   { font-size: 20px; font-weight: 700; color: var(--text-main); line-height: 1.2; letter-spacing: -0.02em; }
    .ui-profile-head__handle { font-size: 13px; color: var(--text-secondary); }

    /* ---------- grid utilities (auto-fit = adapt to any width & item count) ---------- */
    .ui-grid { display: grid; gap: 14px; }
    .ui-grid--2 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .ui-grid--3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

    /* ============================================================
       5. PAGE GLUE — tiny composition-only rules (not components)
       ============================================================ */
    .home-plan-section { display: flex; flex-direction: column; gap: 16px; }
    .page-section { margin-top: 20px; }
    .page-section > .ui-h2 { margin-bottom: 12px; }
    .profile-head-block .ui-btn { margin-top: 10px; }
    .menu-stack { display: flex; flex-direction: column; gap: 10px; }
    .post-author-avatar { width: 24px; height: 24px; }

    /* --- MapPage canvas + overlays (Uber layout: map under, search
       floating on top, ride card docked at the bottom) --- */
    .map-wrap {
        position: relative;
        height: clamp(460px, 62vh, 640px);
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border-gray);
        box-shadow: var(--shadow-xs);
        background: #EDEEF2;
    }
    .map-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-top {
        position: absolute;
        top: 16px; left: 16px;
        width: min(420px, calc(100% - 32px));
        z-index: 3;
    }
    .map-card {
        position: absolute;
        left: 16px; bottom: 16px;
        width: min(430px, calc(100% - 32px));
        z-index: 3;
        background: #FFFFFF;
        border-radius: var(--radius-lg);
        padding: 16px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .map-card__row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .map-card__fare { text-align: right; display: flex; flex-direction: column; flex-shrink: 0; }
    .map-card__fare strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-main); }
    .map-card__fare span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .map-card .ui-btn { width: 100%; justify-content: center; padding: 13px 24px; font-size: 14px; }

    /* ============================================================
       6. HOVER & PRESS — pointer devices only + tactile feedback
       ============================================================ */
    @media (hover: hover) and (pointer: fine) {
        .ui-icon-btn:hover { background: #E5E7EB; transform: scale(1.05); }
        .ui-icon-btn--ghost:hover { background: rgba(255, 255, 255, 0.55); }
        .ui-btn:hover { transform: scale(1.03); background: var(--bg-dark-card); }
        /* hero gently SHRINKS on hover (stays in place) */
        .ui-hero:hover { transform: scale(0.98); box-shadow: var(--shadow-md); }
        .ui-chip:hover:not(.is-active) { border-color: #C0C0C0; transform: scale(1.05); }
        .ui-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: var(--shadow-lg); }
        .ui-story:hover { transform: scale(1.05); }
        .ui-tag:hover:not(.is-active) { background: var(--bg-dark-hover); color: #FFFFFF; transform: translateY(-2px); }
        .ui-recipe-row:hover { transform: scale(1.02) translateX(4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.30); }
        .ui-nav__btn:hover:not(.is-active) { background: rgba(255, 255, 255, 0.12); transform: scale(1.06); }
        .ui-menu-row:hover { transform: translateX(4px); border-color: #D9D9D9; }
        .ui-ach:hover { transform: translateY(-4px); }
    }
    @media (min-width: 1024px) and (min-height: 500px) and (hover: hover) and (pointer: fine) {

    .ui-btn:active,

/** Get a fresh icon element by name. */
function icon(name) {
    const tpl = document.createElement('template');
    tpl.innerHTML = (ICONS[name] || '').trim();

}

   3. HELPERS — tiny DOM utilities shared by all components
   ================================================================ */

/**
 * h(tag, options, ...children) -> HTMLElement
 * Hyperscript-style element builder (vanilla JSX equivalent).
 *   class  : className string
 *   text   : textContent
 *   attrs  : { name: value } (true → bare attribute, false/null skipped)
 *   style  : { cssProp: value }
 *   on     : { event: handler }
 */
function h(tag, opts = {}, ...children) {
    const node = document.createElement(tag);
    if (opts.class) node.className = opts.class;
    if (opts.text != null) node.textContent = opts.text;
    if (opts.attrs) {
        for (const [k, v] of Object.entries(opts.attrs)) {
            if (v === true)  node.setAttribute(k, '');
            else if (v !== false && v != null) node.setAttribute(k, v);
        }
    }
    if (opts.style) Object.assign(node.style, opts.style);
    if (opts.on) {
        for (const [evt, fn] of Object.entries(opts.on)) node.addEventListener(evt, fn);
    }
    for (const kid of children.flat()) {
        if (kid == null) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return node;
}

/**
 * singleSelect(buttons, onChange?) — radio-group behavior for buttons:
 * clicking one activates it (class + aria-pressed) and deactivates the rest.
 */
function singleSelect(buttons, onChange) {
    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => {
                b.classList.remove('is-active');
                b.setAttribute('aria-pressed', 'false');
            });
            btn.classList.add('is-active');
            btn.setAttribute('aria-pressed', 'true');
            if (onChange) onChange(btn);
        });
    });
    return buttons;
}

/**
 * Avatar — circular photo OR built-in SVG person icon.
 * { src?: string|null, alt?, size?, className?, eager?, label? }
 *   src = null            → icon placeholder (offline-ready, no request)
 *   label (icon variant)  → accessible name, default "Profile picture"
 */
function Avatar({ src = null, alt = '', size = 40, className = '', eager = false, label }) {
    if (!src) {
        return h('span', {
            class: `ui-avatar ui-avatar--icon ${className}`.trim(),
            style: { '--size': size + 'px' },
            attrs: { role: 'img', 'aria-label': label || alt || 'Profile picture' }
        }, icon('user'));
    }
    return h('img', {
        class: `ui-avatar ${className}`.trim(),
        style: { '--size': size + 'px' },
        attrs: {
            src, alt, width: size, height: size, decoding: 'async',
            ...(eager ? {} : { loading: 'lazy' })
        }
    });
}

/**
 * AvatarStack — overlapping faces with an optional "+N" badge.
 * { users: [{src, alt?}], extra?: number, size? }
 */
function AvatarStack({ users = [], extra = 0, size = 24 }) {
    return h('div', { class: 'ui-avatar-stack', style: { '--size': size + 'px' } },
        users.map(u => Avatar({ src: u.src, alt: u.alt || '', size })),
        extra > 0
            ? h('span', { class: 'ui-avatar-stack__badge', text: `+${extra}`,
                          attrs: { 'aria-label': `${extra} more participants` } })
            : null
    );
}

/**
 * IconBtn — round icon button. Variants: default gray, `ghost` translucent.
 * { iconName, label (aria), ghost?, onClick? }
 */
function IconBtn({ iconName, label, ghost = false, onClick }) {
    return h('button', {
        class: `ui-icon-btn${ghost ? ' ui-icon-btn--ghost' : ''}`,
        attrs: { type: 'button', 'aria-label': label },
        on: onClick ? { click: onClick } : {}
    }, icon(iconName));
}

function Button({ label, onClick }) {

}

/**
 * SearchBar — labelled search field in a real <form role="search">.
 * { id, placeholder, label, onInput(value), variant?: 'dark'|'light' }
 *   'dark' (default) for dark panels, 'light' for light overlays (map).
 * → { element, input }
 */
function SearchBar({ id, placeholder, label, onInput, variant = 'dark' }) {
    const input = h('input', {
        class: 'ui-search__input',
        attrs: { type: 'search', id, placeholder, autocomplete: 'off' },
        on: onInput ? { input: e => onInput(e.target.value) } : {}
    });
    const form = h('form', {
        class: `ui-search${variant === 'light' ? ' ui-search--light' : ''}`,
        attrs: { role: 'search' },
        on: { submit: e => e.preventDefault() }
    },
        h('label', { class: 'sr-only', text: label, attrs: { for: id } }),
        input
    );
    return { element: form, input };
}

/**
 * NavBar — adaptive primary nav. ONE component: CSS turns it into
 * a floating bottom dock (<1024px) or a left sidebar (>=1024px).
 * { brand:{name}, items:[{id,icon,label}], currentId, onNavigate(id) }
 * → { element, setActive(id) }
 */
function NavBar({ brand, items, currentId, onNavigate }) {
    const buttons = items.map(item => {
        return h('button', {
            class: `ui-nav__btn${item.id === currentId ? ' is-active' : ''}`,
            attrs: {
                type: 'button',
                'data-page': item.id,
                'aria-label': item.label,
                ...(item.id === currentId ? { 'aria-current': 'page' } : {})
            },
            on: { click: () => onNavigate(item.id) }
        },
            icon(item.icon),
            h('span', { class: 'ui-nav__label', text: item.label })
        );
    });

    const element = h('nav', { class: 'ui-nav', attrs: { 'aria-label': 'Primary' } },
        h('div', { class: 'ui-nav__brand', attrs: { 'aria-hidden': 'true' } },
            h('span', { class: 'ui-nav__brand-dot' }),
            h('span', { text: brand.name })
        ),
        buttons
    );

    function setActive(id) {
        buttons.forEach(btn => {
            const isTarget = btn.getAttribute('data-page') === id;
            btn.classList.toggle('is-active', isTarget);
            if (isTarget) btn.setAttribute('aria-current', 'page');
            else btn.removeAttribute('aria-current');
        });
    }

    return { element, setActive };
}

function HomePage(data) {
    /* challenge hero (custom stopwatch illustration, set to 10:00) */
    const hero = HeroCard({
        tone: data.challenge.tone,
        titleLines: data.challenge.titleLines,
        subtitle: data.challenge.subtitle,
        art: icon(data.challenge.art)
    }, AvatarStack({
        users: data.challenge.participants,
        extra: data.challenge.extraCount,
        size: 24
    }));

    /* date strip */
    const chips = singleSelect(
        data.dates.map(d => Chip({ label: d.label, num: d.num, active: d.active, ariaLabel: d.ariaLabel }))
    );
    const dateStrip = ScrollRow({ gap: 12, ariaLabel: 'Select a day', className: 'dates-row', items: chips });
    dateStrip.style.padding = '16px 0';

    /* plan cards — footer type maps content → component composition */
    const footers = {
        person:  f => PersonRow({ avatar: f.person.avatar, role: f.person.role, name: f.person.name }),
        art:     f => h('div', { class: 'ui-card__art' }, icon(f.icon)),
        actions: f => h('div', { class: 'ui-icon-row' },
                        f.actions.map(a => IconBtn({ iconName: a.icon, label: a.label, ghost: true })))
    };
    const planCards = data.plans.map(plan => InfoCard({
        tone: plan.tone, tag: plan.tag, title: plan.title, lines: plan.lines,
        footer: footers[plan.footer.type](plan.footer)
    }));

    return h('div', { class: 'page', attrs: { id: 'page-home' } },
        hero,
        dateStrip,
        h('section', { class: 'home-plan-section', attrs: { 'aria-labelledby': 'plan-title' } },
            h('h2', { class: 'ui-h2', text: data.planTitle, attrs: { id: 'plan-title' } }),
            h('div', { class: 'ui-grid ui-grid--2 home-plan-grid' }, planCards)
        )
    );
}

                avatarSize: 44
            }),
            h('div', { class: 'map-card__fare' },
                h('strong', { text: data.price }),
                h('span', { text: data.eta })
            )
        ),
        Button({ label: data.confirmLabel })
    );

    const page = h('div', { class: 'page', attrs: { id: 'page-map' } },
        h('div', { class: 'map-wrap', attrs: { role: 'region', 'aria-label': 'Ride map (static mockup)' } },
            icon('mapScene'),
            h('div', { class: 'map-top' }, search.element),
            rideCard
        )
    );

    /* visible marker in the rendered HTML, as requested */
    page.prepend(document.createComment(
        ' MAP PAGE = STATIC MOCKUP: hand-drawn SVG, hard-coded route & markers, no live map data '
    ));
    return page;
}

function RecipesPage(data) {
    /* list rows + empty state */
    const rows = data.items.map(item => RecipeRow({
        title: item.title, time: item.time, kcal: item.kcal,
        iconName: item.icon, iconBg: item.iconBg, badge: item.badge
    }));
    const empty = h('p', { class: 'ui-empty', text: data.emptyText, attrs: { hidden: true } });

    /* live search filter */
    const search = SearchBar({
        id: 'recipe-search',
        placeholder: data.searchPlaceholder,
        label: data.searchLabel,
        onInput(value) {
            const q = value.trim().toLowerCase();
            let visible = 0;
            rows.forEach(row => {
                const match = !q || row.getAttribute('data-title').includes(q);
                row.hidden = !match;
                if (match) visible++;
            });
            empty.hidden = visible !== 0;
        }
    });

    /* filter tags */
    const tagRow = ScrollRow({
        gap: 10, items: singleSelect(data.tags.map(t => Tag({ label: t.label, active: t.active })))
    });
    tagRow.style.padding = '16px 0';
    tagRow.setAttribute('role', 'group');
    tagRow.setAttribute('aria-label', 'Filter by category');

    const element = h('div', { class: 'page', attrs: { id: 'page-recipes' } },
        h('div', { class: 'ui-panel--dark' },
            search.element,
            tagRow,
            SectionTitle({ text: data.listTitle, tone: 'light-sm' }),
            h('div', { class: 'recipe-list', style: { display: 'flex', flexDirection: 'column', gap: '16px', marginTop: '16px' } },
                rows, empty)
        )
    );

    /* expose input so the header search button can focus it */
    return { element, api: { focusSearch: () => search.input.focus() } };
}

function ProfilePage(data) {
    return h('div', { class: 'page', attrs: { id: 'page-profile' } },
        ProfileHead({
            avatar: data.avatar, name: data.name, handle: data.handle,
            actionLabel: data.editLabel
        }),
        h('div', { class: 'ui-grid ui-grid--3', style: { marginTop: '16px' },
                   attrs: { role: 'group', 'aria-label': 'Weekly statistics' } },
            data.stats.map(s => StatCard({ iconName: s.icon, value: s.value, label: s.label }))
        ),
        h('div', { class: 'page-section' },
            SectionTitle({ text: data.achievementsTitle }),
            h('div', { class: 'ui-grid ui-grid--3' },
                data.achievements.map(a => AchievementTile(a)))
        ),
        h('div', { class: 'page-section' },
            SectionTitle({ text: data.menuTitle }),
            h('div', { class: 'menu-stack' },
                data.menu.map(m => MenuRow({ iconName: m.icon, label: m.label })))
        )
    );
}


/* ================================================================
   6. APP — bootstrap & routing (nav ids in DATA.nav → APP_PAGES)
   ================================================================ */
const APP_PAGES = {
    'page-home':     () => HomePage(DATA.home),
    'page-map':      () => MapPage(DATA.map),           // static mockup
    'page-recipes':  () => RecipesPage(DATA.recipes),   // returns {element, api}
    'page-profile':  () => ProfilePage(DATA.profile)
};

function initApp() {
    const mount = document.getElementById('app');

    const shell    = h('div', { class: 'app-shell' });
    const content  = h('div', { class: 'app-content' });
    const main     = h('main', { class: 'app-main' });
    const pagesBox = h('div', { class: 'app-pages' });

    /* build pages */
    const pages = {}; // id -> {element, api}
    for (const [id, build] of Object.entries(APP_PAGES)) {
        const built = build();
        const element = built.element || built;
        pages[id] = { element, api: built.api || {} };
        pagesBox.append(element);
    }

    /* routing */
    let currentId = DATA.nav[0].id;

    function navigate(id) {
        if (!pages[id]) return;
        currentId = id;
        for (const [pid, p] of Object.entries(pages)) {
            p.element.classList.toggle('active', pid === id);
        }
        nav.setActive(id);
        main.scrollTop = 0; // always land at the top of a page
    }

    /* header — search button jumps to recipes + focuses its input */
    const header = AppHeader({
        user: DATA.user,
        searchLabel: DATA.recipes.searchLabel,
        onSearch() {
            navigate('page-recipes');
            setTimeout(() => pages['page-recipes'].api.focusSearch(), 300);
        }
    });

    /* nav */
    const nav = NavBar({
        brand: DATA.brand,
        items: DATA.nav,
        currentId,
        onNavigate: navigate
    });

    /* assemble */
    main.append(pagesBox);
    content.append(header, main);
    shell.append(nav.element, content);
    mount.append(shell);

    navigate(currentId);
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
