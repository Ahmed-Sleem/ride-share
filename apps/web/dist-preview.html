<style>
/* ══════════════════════════════════════════════════════════════════════════
   RIDE SHARE — DESIGN SYSTEM
   Every visual decision is defined exactly once, here. To change a value
   everywhere in the product, edit one line in this block. (GUI rules §3)

   BREAKPOINTS — Material 3 window size classes (m3.material.io/foundations/
   layout/breakpoints). Chosen because they are the researched industry
   standard, not invented for this project:
     compact    <  600px   phone portrait          nav = bottom bar
     medium     >= 600px   phone landscape/tablet  nav = collapsed rail
     expanded   >= 840px   tablet landscape        nav = expanded rail
     large      >= 1200px  desktop                 nav = expanded rail + panes
     x-large    >= 1600px  ultrawide               content capped, centred
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── PRIMITIVES ─────────────────────────────────────────────────────────
     Raw values. Never referenced by a component; only by semantic tokens.
     Two-layer model per WCAG 2.2 palette guidance.
     Violet is the product's primary colour (the act of travelling).
     Coral is the secondary role (value & continuity). The pops below are the
     youth palette — used for chips, cards and friendly accents, never for
     status or semantics.                                              */
  --violet-50:#F1EEFF; --violet-100:#E3DDFF; --violet-200:#C9BEFF;
  --violet-300:#A795FF; --violet-400:#8571FF; --violet-500:#6C63FF;
  --violet-600:#5A4FD9; --violet-700:#463DB0; --violet-900:#241F5E;
  --coral-50:#FFF1EC; --coral-100:#FFDCCF; --coral-300:#FFAD93;
  --coral-400:#FF8A6E; --coral-500:#FF6A4D; --coral-600:#E84F30; --coral-900:#5E1F12;
  --mint-50:#E7F9F0; --mint-100:#C9F1DE; --mint-300:#7FE0BC;
  --mint-400:#3ECF9A; --mint-500:#1FB87F; --mint-600:#179A6A; --mint-900:#0B3A28;
  --lime-50:#F7FBE3; --lime-100:#EFF7C2; --lime-300:#E4F083;
  --lime-400:#D6E75C; --lime-500:#C9DE3D; --lime-600:#A8BD1F; --lime-900:#39400A;
  --sky-50:#E9F4FF; --sky-100:#CFE7FF; --sky-300:#9ACDFF;
  --sky-400:#6CB4FF; --sky-500:#3D9AF7; --sky-600:#2A7FD6; --sky-900:#0E2B4F;
  --pink-50:#FDEFF6; --pink-100:#FBD9E9; --pink-300:#F6A9D0;
  --pink-400:#F184BB; --pink-500:#E85F9F; --pink-600:#C73F7F; --pink-900:#4E1532;
  /* 700 steps — the bold-card steps of each pop hue. Each holds white text at
     WCAG AA (≥ 4.5:1); the 300 steps are their light accents for line-work. */
  --coral-700:#C43E22; --mint-700:#0F7A4E; --sky-700:#1E63A8;
  --ink-0:#FFFFFF; --ink-25:#FAFBFC; --ink-50:#F5F7F9; --ink-100:#EEF0F4;
  --ink-150:#E4E8ED; --ink-200:#DFE4EA; --ink-300:#C4CCD6; --ink-400:#98A2B0;
  --ink-500:#6B7684; --ink-600:#5B6472; --ink-700:#3D4550; --ink-800:#232A33;
  --ink-850:#1A1D24; --ink-900:#15181F; --ink-950:#111318; --ink-1000:#0B0C0F;
  --green-500:#1E8E3E; --green-400:#3ECF6B; --green-50:#E8F5EC; --green-950:#12291B;
  --amber-500:#B26A00; --amber-400:#FFB020; --amber-50:#FDF3E2; --amber-950:#2E2410;
  --red-500:#C62828;   --red-400:#FF6B6B;   --red-50:#FCEBEA;   --red-950:#2E1717;
  --blue-500:#1B62D6;  --blue-400:#5D95F5;  --blue-50:#E9F0FC;  --blue-950:#141F33;

  /* ── SEMANTIC: SURFACES ─────────────────────────────────────────────── */
  --bg-base:var(--ink-0); --bg-raised:var(--ink-50); --bg-sunken:var(--ink-100);
  --bg-inset:var(--ink-150); --bg-page:var(--ink-100);

  /* ── SEMANTIC: TEXT ─────────────────────────────────────────────────── */
  --text-primary:var(--ink-900); --text-secondary:var(--ink-600);
  --text-muted:var(--ink-500); --text-inverse:var(--ink-0);

  /* ── SEMANTIC: BRAND + ACCENT ───────────────────────────────────────────
     PRIMARY  violet — the act of travelling: book, claim, confirm, go.
     ACCENT   coral  — value and continuity: subscriptions, promotions,
                       recommendations, the walking leg of a journey.
     Two roles, never interchangeable. A coral button never means "go";
     a violet surface never means "saving". This is what keeps an accent
     colour meaningful rather than decorative.                            */
  --brand:var(--violet-500); --brand-hover:var(--violet-600);
  --brand-2:var(--violet-600);           /* second stop of the brand gradient */
  --brand-soft:var(--violet-50); --brand-border:var(--violet-100);
  --on-brand:var(--ink-0);
  --accent:var(--coral-500); --accent-hover:var(--coral-600);
  --accent-soft:var(--coral-50); --accent-border:var(--coral-100);
  --on-accent:var(--ink-0); --accent-text:var(--coral-600);

  /* ── POPS — the youth palette. Decorative fills for chips, cards and
     friendly accents. Each has a soft bg and a readable text twin.       */
  --pop-mint:var(--mint-500);  --pop-mint-bg:var(--mint-50);  --pop-mint-text:var(--mint-600);
  --pop-lime:var(--lime-500);  --pop-lime-bg:var(--lime-50);  --pop-lime-text:var(--lime-600);
  --pop-sky:var(--sky-500);    --pop-sky-bg:var(--sky-50);    --pop-sky-text:var(--sky-600);
  --pop-pink:var(--pink-500);  --pop-pink-bg:var(--pink-50);  --pop-pink-text:var(--pink-600);
  --pop-coral:var(--coral-400);--pop-coral-bg:var(--coral-50);--pop-coral-text:var(--coral-600);

  /* route line stays blue: it is a map convention, not brand expression */
  --route:var(--blue-500); --walk:var(--violet-400);
  --accent-route:var(--route); --accent-walk:var(--walk);

  /* ── SEMANTIC: STATUS ───────────────────────────────────────────────── */
  --ok:var(--green-500); --ok-bg:var(--green-50);
  --warn:var(--amber-500); --warn-bg:var(--amber-50);
  --danger:var(--red-500); --danger-bg:var(--red-50);
  --info:var(--blue-500); --info-bg:var(--blue-50);
  --offline:var(--ink-600);

  /* ── SEMANTIC: LINES + FOCUS ────────────────────────────────────────── */
  --line:var(--ink-200); --line-strong:var(--ink-300);
  --focus:var(--accent); --focus-width:2px; --focus-offset:2px;
  --scrim:rgba(12,18,26,.5);

  /* ── MAP ────────────────────────────────────────────────────────────── */
  --map-land:var(--ink-100); --map-water:#C6DCEB; --map-park:#D9E9D2;
  --map-road:var(--ink-0); --map-road-minor:var(--ink-50); --map-building:var(--ink-150);

  /* ── FIXED (never themed — reason recorded) ─────────────────────────────
     A boarding code must scan in dark mode; a knob needs contrast on both
     track colours; white on a saturated fill is white in both themes.    */
  --qr-paper:#FFFFFF; --qr-ink:#151A21; --knob:#FFFFFF; --on-solid:#FFFFFF;

  /* ── RADII ──────────────────────────────────────────────────────────── */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* ── SPACING (4px base) ─────────────────────────────────────────────── */
  /* the wordmark font comes from the single brand source (packages/brand) */
  --brand-font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", sans-serif; --brand-font-weight:750;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px; --s9:48px; --s10:64px;

  /* ── TYPE SCALE ─────────────────────────────────────────────────────────
     --f-input is 16px and must never go below it: iOS Safari force-zooms
     the viewport on focus of any field under 16px. That zoom cannot be
     undone by the user and breaks the layout.                            */
  --f-display:32px; --f-title:22px; --f-head:18px; --f-lg:16px;
  --f-body:15px; --f-cap:13px; --f-micro:11px; --f-input:16px;
  --lh-tight:1.2; --lh-snug:1.35; --lh-body:1.5;
  --fw-normal:400; --fw-med:550; --fw-semi:650; --fw-bold:750;

  /* ── CONTROL SIZES ──────────────────────────────────────────────────────
     44px is the WCAG 2.2 / platform minimum touch target.
     56px is the driver minimum: gloved hands, moving vehicle, sunlight.   */
  --tap:44px; --tap-sm:36px; --tap-driver:56px;
  --icon-sm:16px; --icon-md:20px; --icon-lg:24px;

  /* ── LAYOUT ─────────────────────────────────────────────────────────── */
  --rail-collapsed:80px; --rail-expanded:248px;
  --content-max:840px;      /* reading measure for single-pane content */
  --landing-max:1120px;     /* marketing-page cap — generous, still readable */
  --shell-max:1600px;       /* beyond x-large the shell stops growing  */
  --topbar-h:60px; --dock-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* ── ELEVATION ──────────────────────────────────────────────────────── */
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 2px 4px rgba(16,24,40,.04),0 10px 20px -6px rgba(16,24,40,.09);
  --sh-3:0 4px 10px rgba(16,24,40,.06),0 24px 44px -14px rgba(16,24,40,.18);

  /* ── LAYERS (named, so no arbitrary z-index appears in a component) ─── */
  --z-base:0; --z-sticky:10; --z-nav:30; --z-scrim:55; --z-sheet:60; --z-toast:80;

  /* ── MOTION ─────────────────────────────────────────────────────────── */
  --ease:cubic-bezier(.2,.7,.3,1); --fast:140ms; --med:240ms;
  --slow:420ms; --bounce:cubic-bezier(.34,1.56,.64,1);
}

[data-theme="dark"]{
  --bg-base:var(--ink-950); --bg-raised:var(--ink-850); --bg-sunken:var(--ink-1000);
  --bg-inset:var(--ink-800); --bg-page:var(--ink-1000);
  --text-primary:#F2F5F8; --text-secondary:#9AA5B2; --text-muted:#7C8794;
  --text-inverse:var(--ink-950);
  --brand:var(--violet-400); --brand-hover:var(--violet-300); --brand-2:var(--violet-300);
  --brand-soft:#241B4E; --brand-border:#3A2E78; --on-brand:var(--violet-900);
  --accent:var(--coral-400); --accent-hover:var(--coral-300);
  --accent-soft:#3A1C12; --accent-border:#5C2D1D;
  --on-accent:var(--coral-900); --accent-text:var(--coral-300);
  --pop-mint:var(--mint-400); --pop-mint-bg:var(--mint-900); --pop-mint-text:var(--mint-300);
  --pop-lime:var(--lime-400); --pop-lime-bg:var(--lime-900); --pop-lime-text:var(--lime-300);
  --pop-sky:var(--sky-400);  --pop-sky-bg:var(--sky-900);  --pop-sky-text:var(--sky-300);
  --pop-pink:var(--pink-400);--pop-pink-bg:var(--pink-900);--pop-pink-text:var(--pink-300);
  --pop-coral:var(--coral-400);--pop-coral-bg:var(--coral-900);--pop-coral-text:var(--coral-300);
  --route:var(--blue-400); --walk:var(--violet-300);
  --accent-route:var(--route); --accent-walk:var(--walk);
  --ok:var(--green-400); --ok-bg:var(--green-950);
  --warn:var(--amber-400); --warn-bg:var(--amber-950);
  --danger:var(--red-400); --danger-bg:var(--red-950);
  --info:var(--blue-400); --info-bg:var(--blue-950);
  --offline:#9AA5B2;
  --line:#252B33; --line-strong:#333B45;
  --focus:var(--accent); --scrim:rgba(0,0,0,.66);
  --map-land:#15181F; --map-water:#16303F; --map-park:#1B2A1E;
  --map-road:#2A313A; --map-road-minor:#222831; --map-building:#232932;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 20px -6px rgba(0,0,0,.45);
  --sh-3:0 4px 10px rgba(0,0,0,.35),0 24px 44px -14px rgba(0,0,0,.6);
}

/* ══════════════════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--bg-page);color:var(--text-primary);
  font:var(--fw-normal) var(--f-body)/var(--lh-body) -apple-system,BlinkMacSystemFont,
       "Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;text-size-adjust:100%;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-width) solid var(--focus);
  outline-offset:var(--focus-offset);border-radius:var(--r-xs)}
:focus:not(:focus-visible){outline:none}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ══════════════════════════════════════════════════════════════════════════
   APP SHELL — always exactly one viewport tall, never more, never less.
   The shell is a flex row (rail | column). The column is topbar / search /
   scroller / dock. Only .main scrolls; everything else is flex:none and so
   is structurally incapable of scrolling away.
   ══════════════════════════════════════════════════════════════════════════ */
#root{height:100vh;height:100dvh;width:100%;display:flex}
.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:row;
  background:var(--bg-base);position:relative;overflow:hidden;
  max-width:var(--shell-max);margin-inline:auto;width:100%}
.appcol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;height:100%}

/* ── top bar ──────────────────────────────────────────────────────────── */
.topbar{flex:none;display:flex;align-items:center;gap:var(--s3);
  min-height:var(--topbar-h);
  padding-block:var(--s2);padding-block-start:calc(var(--s2) + var(--safe-t));
  padding-inline:var(--s4);
  border-bottom:1px solid var(--line);background:var(--bg-base);z-index:var(--z-sticky)}
.topbar--plain{border-bottom:0}
.topbar__title{font-size:var(--f-head);font-weight:var(--fw-bold);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:var(--lh-snug)}

/* ── search band: the first element of the page, scrolls with content ── */
.searchband{width:100%}
.searchband__inner{width:100%;max-width:var(--content-max);margin-inline:auto}
.searchband--wide .searchband__inner{max-width:none}

/* ── the one scrolling region ─────────────────────────────────────────── */
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:var(--s4);padding-inline-start:calc(var(--s4) + var(--safe-l));
  padding-inline-end:calc(var(--s4) + var(--safe-r));
  display:flex;flex-direction:column;gap:var(--s4);
  scrollbar-gutter:stable}
.main__inner{width:100%;max-width:var(--content-max);margin-inline:auto;
  display:flex;flex-direction:column;gap:var(--s4)}
.main--wide .main__inner{max-width:none}

/* ══════════════════════════════════════════════════════════════════════════
   NAVIGATION — one component, four presentations.
   compact  : bottom bar        (thumb reach)
   medium   : collapsed rail    (icon + tiny label)
   expanded+: expanded rail     (icon + label, profile pinned to the bottom)
   ══════════════════════════════════════════════════════════════════════════ */
.nav{flex:none;display:flex;background:var(--bg-base);z-index:var(--z-nav)}
.nav__brand{display:none}
.nav__items{display:flex;flex:1;min-width:0}
.nav__foot{display:none}
.navitem{flex:1;min-width:0;min-height:var(--tap);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:var(--r-md);color:var(--text-secondary);padding:var(--s1);
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.navitem:hover{color:var(--text-primary)}
.navitem[aria-current="page"]{color:var(--brand)}
.navitem__ico{display:grid;place-items:center;flex:none}
.navitem svg{width:var(--icon-lg);height:var(--icon-lg);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navitem[aria-current="page"] svg{stroke-width:2.4}
.navitem__label{font-size:var(--f-micro);font-weight:var(--fw-semi);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* rail collapse control — folds the desktop rail to icons and back */
.rail-toggle{display:none}

/* compact: bottom bar */
@media (max-width:599.98px){
  .app{flex-direction:column}
  .nav{order:2;border-top:1px solid var(--line);
    padding:var(--s2) var(--s2) calc(var(--s2) + var(--safe-b))}
  .appcol{order:1}
}

/* the footer copy of an item is hidden in the bar, and vice versa */
@media (min-width:600px){ .navitem.compact-only{display:none} }
@media (max-width:599.98px){ .nav__foot{display:none} }

/* medium and up: side rail */
@media (min-width:600px){
  .nav{flex-direction:column;border-inline-end:1px solid var(--line);
    background:var(--bg-raised);
    padding:var(--s4) var(--s3) calc(var(--s4) + var(--safe-b));
    padding-inline-start:calc(var(--s3) + var(--safe-l));
    width:var(--rail-collapsed);overflow-y:auto;overflow-x:hidden}
  .nav__items{flex-direction:column;flex:1;gap:var(--s1)}
  .navitem{flex:none;min-height:var(--tap-driver)}
  .nav__foot{display:flex;flex-direction:column;flex:none;gap:var(--s1);
    padding-top:var(--s3);border-top:1px solid var(--line);margin-top:var(--s3)}
  .rail-toggle{display:flex;align-items:center;justify-content:center;
    width:100%;min-height:var(--tap-driver);margin-top:var(--s3);
    border-radius:var(--r-md);color:var(--text-secondary);flex:none;
    transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
  .rail-toggle:hover{background:var(--bg-sunken);color:var(--text-primary)}
  .rail-toggle svg{width:var(--icon-md);height:var(--icon-md);fill:none;
    stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
}

/* expanded and up: rail shows labels beside icons */
@media (min-width:840px){
  .nav{width:var(--rail-expanded);padding-inline:var(--s3)}
  .nav__brand{display:flex;align-items:center;gap:var(--s2);flex:none;
    padding:var(--s2) var(--s3) var(--s5);font-size:var(--f-head);
    font-weight:var(--brand-font-weight);font-family:var(--brand-font);
    color:var(--brand);min-width:0}
  .nav__brand svg{width:var(--icon-lg);height:var(--icon-lg);flex:none;
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .nav__brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navitem{flex-direction:row;justify-content:flex-start;gap:var(--s3);
    padding-inline:var(--s3);min-height:var(--tap)}
  .navitem[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
  .navitem__label{font-size:var(--f-body);font-weight:var(--fw-semi)}
  /* user-collapsed rail: icons only, labels and brand name fold away */
  .app.rail-collapsed .nav{width:var(--rail-collapsed)}
  .app.rail-collapsed .nav__brand{justify-content:center;padding-inline:0}
  .app.rail-collapsed .nav__brand span{display:none}
  .app.rail-collapsed .navitem{flex-direction:column;justify-content:center;
    gap:2px;padding-inline:var(--s2)}
  .app.rail-collapsed .navitem__label{display:none}
}

/* large and up: roomier gutters */
@media (min-width:1200px){
  .main{padding:var(--s6)}
  .topbar{padding-inline:var(--s6)}
}

/* short viewports (landscape phone): reclaim vertical space */
@media (max-height:520px){
  :root{--topbar-h:48px}
  .navitem__label{display:none}
  .nav{padding-block:var(--s1)}
}

/* ══════════════════════════════════════════════════════════════════════════
   LAYOUT UTILITIES
   ══════════════════════════════════════════════════════════════════════════ */
.stack{display:flex;flex-direction:column;min-width:0}
.row{display:flex;align-items:center;min-width:0;flex-wrap:wrap}
.row--nowrap{flex-wrap:nowrap}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.gap1{gap:var(--s1)} .gap2{gap:var(--s2)} .gap3{gap:var(--s3)}
.gap4{gap:var(--s4)} .gap5{gap:var(--s5)} .gap6{gap:var(--s6)}
.mt2{margin-top:var(--s2)} .mt3{margin-top:var(--s3)} .mt4{margin-top:var(--s4)}
.center{align-items:center;text-align:center}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* responsive grid: columns follow available space, not a device list */
.grid{display:grid;gap:var(--s3);width:100%;min-width:0;
  grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.grid--tight{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}

/* ══════════════════════════════════════════════════════════════════════════
   TYPOGRAPHY
   ══════════════════════════════════════════════════════════════════════════ */
.t-display{font-size:var(--f-display);font-weight:var(--fw-bold);
  line-height:var(--lh-tight);letter-spacing:-.02em}
.t-title{font-size:var(--f-title);font-weight:var(--fw-bold);
  line-height:var(--lh-tight);letter-spacing:-.01em}
.t-head{font-size:var(--f-head);font-weight:var(--fw-bold);line-height:var(--lh-snug)}
.t-lg{font-size:var(--f-lg);font-weight:var(--fw-semi);line-height:var(--lh-snug)}
.t-cap{font-size:var(--f-cap);color:var(--text-secondary);line-height:var(--lh-snug)}
.t-micro{font-size:var(--f-micro);color:var(--text-secondary);font-weight:var(--fw-bold);
  letter-spacing:.07em;text-transform:uppercase;line-height:var(--lh-snug)}
.muted{color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}
.emoji{font-size:var(--f-lg);line-height:1}

/* ══════════════════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding-inline:var(--s5);border-radius:var(--r-md);
  font-size:var(--f-body);font-weight:var(--fw-semi);white-space:nowrap;flex:none;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             border-color var(--fast) var(--ease);border:1px solid transparent}
.btn svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn--primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:var(--on-brand);
  box-shadow:0 2px 10px -2px color-mix(in srgb,var(--brand) 55%,transparent)}
.btn--primary:hover:not([disabled]){
  background:linear-gradient(135deg,var(--brand-hover),var(--brand));
  transform:translateY(-1px)}
.btn--accent{background:var(--accent);color:var(--on-accent)}
.btn--accent:hover:not([disabled]){background:var(--accent-hover)}
.btn--secondary{background:var(--bg-sunken);color:var(--text-primary)}
.btn--secondary:hover:not([disabled]){background:var(--bg-inset)}
.btn--outline{border-color:var(--line-strong);color:var(--text-primary)}
.btn--outline:hover:not([disabled]){background:var(--bg-raised);border-color:var(--brand)}
.btn--ghost{color:var(--brand);padding-inline:var(--s3)}
.btn--ghost:hover:not([disabled]){background:var(--brand-soft)}
.btn--danger{background:var(--danger);color:var(--on-solid)}
.btn--block{width:100%;flex:1 1 auto}
.btn--driver{min-height:var(--tap-driver);font-size:var(--f-lg);border-radius:var(--r-lg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[aria-busy="true"]{pointer-events:none}

.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--text-primary);flex:none;
  transition:background var(--fast) var(--ease)}
.iconbtn:hover{background:var(--bg-sunken)}
.iconbtn svg{width:var(--icon-lg);height:var(--icon-lg);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .iconbtn--flip svg{transform:scaleX(-1)}

/* ══════════════════════════════════════════════════════════════════════════
   SURFACES
   ══════════════════════════════════════════════════════════════════════════ */
.card{background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.card--raised{background:var(--bg-raised)}
.card--brand{background:var(--brand-soft);border-color:var(--brand-border)}
.card--accent{background:var(--accent-soft);border-color:var(--accent-border)}
.card--tight{gap:var(--s2)}
.panel{background:var(--bg-raised);border-radius:var(--r-md);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.divider{height:1px;background:var(--line);flex:none}
.section{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.section__head{display:flex;align-items:center;gap:var(--s3);min-width:0}

/* ══════════════════════════════════════════════════════════════════════════
   LIST ROWS — one owner of row padding. No class stacking on the box.
   ══════════════════════════════════════════════════════════════════════════ */
.rowitem{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  min-height:var(--tap-driver);padding:var(--s3) var(--s4);border-radius:var(--r-md);
  text-align:start;background:var(--bg-base);border:1px solid transparent;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.rowitem--bordered{border-color:var(--line)}
.rowitem:hover:not([disabled]){background:var(--bg-raised)}
.rowitem--selected{background:var(--accent-soft);border-color:var(--accent)}
.rowitem[disabled]{opacity:.5;cursor:not-allowed}
.rowitem>svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  color:var(--text-secondary)}
[dir="rtl"] .rowitem .chev{transform:scaleX(-1)}
.rowgroup{display:flex;flex-direction:column;background:var(--bg-base);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0}
.rowgroup .rowitem{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.rowgroup .rowitem:last-child{border-bottom:0}

/* ══════════════════════════════════════════════════════════════════════════
   SEARCH — one component owning its own box.
   Font size is --f-input (16px) so iOS never force-zooms on focus.
   ══════════════════════════════════════════════════════════════════════════ */
.searchbar{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  min-height:var(--tap);padding-inline:var(--s4);border-radius:var(--r-full);
  background:var(--bg-sunken);border:1px solid transparent;
  color:var(--text-secondary);font-size:var(--f-input);text-align:start;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.searchbar:hover{background:var(--bg-inset)}
.searchbar:focus-within{background:var(--bg-base);border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar>svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:0;
  height:var(--tap);color:var(--text-primary);font-size:var(--f-input)}
.searchbar input::placeholder{color:var(--text-secondary);opacity:1}
.searchbar__text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════════
   CHIPS · BANNERS
   ══════════════════════════════════════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  border-radius:var(--r-full);background:var(--bg-sunken);font-size:var(--f-cap);
  font-weight:var(--fw-semi);min-height:30px;white-space:nowrap;flex:none;
  border:1px solid transparent}
.chip--brand{background:var(--brand);color:var(--on-brand)}
.chip--accent{background:var(--accent-soft);color:var(--accent-text);
  border-color:var(--accent-border)}
.chip--ok{background:var(--ok-bg);color:var(--ok)}
.chip--warn{background:var(--warn-bg);color:var(--warn)}
.chip--danger{background:var(--danger-bg);color:var(--danger)}
.chip--info{background:var(--info-bg);color:var(--info)}
.chip--mint{background:var(--pop-mint-bg);color:var(--pop-mint-text)}
.chip--lime{background:var(--pop-lime-bg);color:var(--pop-lime-text)}
.chip--sky{background:var(--pop-sky-bg);color:var(--pop-sky-text)}
.chip--pink{background:var(--pop-pink-bg);color:var(--pop-pink-text)}
.chip--coral{background:var(--pop-coral-bg);color:var(--pop-coral-text)}
.chip--outline{background:none;border-color:var(--line-strong)}
button.chip{cursor:pointer;transition:background var(--fast) var(--ease),
  color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
button.chip:hover:not([disabled]){border-color:var(--accent)}
button.chip[disabled]{opacity:.4;cursor:not-allowed}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);
  border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:var(--r-full);flex:none;background:currentColor}

.banner{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3);
  border-radius:var(--r-sm);font-size:var(--f-cap);font-weight:var(--fw-med);
  line-height:var(--lh-snug)}
.banner .dot{margin-top:5px}
.banner--offline{background:var(--bg-inset);color:var(--text-secondary)}
.banner--warn{background:var(--warn-bg);color:var(--warn)}
.banner--info{background:var(--info-bg);color:var(--info)}
.banner--danger{background:var(--danger-bg);color:var(--danger)}
.banner--ok{background:var(--ok-bg);color:var(--ok)}
.banner--accent{background:var(--accent-soft);color:var(--accent-text)}

/* ══════════════════════════════════════════════════════════════════════════
   FORMS — all fields use --f-input
   ══════════════════════════════════════════════════════════════════════════ */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:var(--f-cap);font-weight:var(--fw-semi);color:var(--text-secondary)}
/* password fields: input + show/hide eye, one box */
.inputwrap{position:relative;min-width:0}
.inputwrap .input{padding-inline-end:var(--s8)}
.field__eye{position:absolute;inset-inline-end:var(--s1);top:50%;translate:0 -50%;
  width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--text-muted);flex:none}
.field__eye:hover{color:var(--text-primary);background:var(--bg-sunken)}
.field__eye svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input{min-height:var(--tap);width:100%;border:1px solid var(--line-strong);
  border-radius:var(--r-md);padding-inline:var(--s4);background:var(--bg-base);
  outline:0;font-size:var(--f-input);transition:border-color var(--fast) var(--ease),
  box-shadow var(--fast) var(--ease)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{padding-block:var(--s3);min-height:96px;resize:vertical;
  line-height:var(--lh-body)}
select.input{cursor:pointer}
.otp{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap}
.otp input{width:46px;height:56px;text-align:center;font-size:var(--f-title);
  font-weight:var(--fw-bold);border:1px solid var(--line-strong);
  border-radius:var(--r-md);background:var(--bg-base);outline:0}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stepper{display:inline-flex;align-items:center;gap:var(--s2);background:var(--bg-sunken);
  border-radius:var(--r-full);padding:4px;flex:none}
.stepper button{width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-full);
  background:var(--bg-base);display:grid;place-items:center;
  font-weight:var(--fw-bold);box-shadow:var(--sh-1)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper span{min-width:24px;text-align:center;font-weight:var(--fw-bold)}
.switch{width:46px;height:28px;border-radius:var(--r-full);background:var(--line-strong);
  position:relative;flex:none;transition:background var(--fast) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;
  width:22px;height:22px;border-radius:var(--r-full);background:var(--knob);
  box-shadow:var(--sh-1);transition:transform var(--fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-18px)}
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-full);
  padding:3px;gap:2px;flex:none;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:var(--r-full);font-size:var(--f-cap);
  font-weight:var(--fw-semi);color:var(--text-secondary);min-height:var(--tap-sm);
  white-space:nowrap;transition:background var(--fast) var(--ease),
  color var(--fast) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--bg-base);color:var(--text-primary);
  box-shadow:var(--sh-1)}

/* ══════════════════════════════════════════════════════════════════════════
   STATES
   ══════════════════════════════════════════════════════════════════════════ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:var(--s3);padding:var(--s8) var(--s4);color:var(--text-secondary)}
.empty__ico{width:72px;height:72px;border-radius:var(--r-full);flex:none;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.empty__ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.empty>svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.5;
  opacity:.5;stroke-linecap:round;stroke-linejoin:round}
.skeleton{background:linear-gradient(90deg,var(--bg-sunken),var(--bg-inset),var(--bg-sunken));
  background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════════════════════════════════
   DOMAIN COMPONENTS
   ══════════════════════════════════════════════════════════════════════════ */
.routecard{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  padding:var(--s4);min-height:76px;border:1px solid var(--line);
  border-radius:var(--r-md);text-align:start;background:var(--bg-base);
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.routecard:hover{border-color:var(--brand);box-shadow:var(--sh-2);transform:translateY(-1px)}
.routecard:active{transform:translateY(0) scale(.99)}
.routeline{font-weight:var(--fw-semi);font-size:var(--f-lg);line-height:var(--lh-snug)}
.fare{font-weight:var(--fw-bold);font-size:var(--f-lg);white-space:nowrap;
  font-variant-numeric:tabular-nums}

/* search result card — the container is a DIV (a button cannot nest buttons),
   the head is the tappable row, the deps are the nested bookable journeys. */
.routecard--results{display:flex;flex-direction:column;align-items:stretch;
  gap:0;padding:0;overflow:hidden;cursor:default}
.routecard--results:hover{transform:none}
.routecard__head{display:flex;align-items:center;gap:var(--s3);width:100%;
  min-width:0;padding:var(--s4);min-height:76px;border:0;background:none;
  text-align:start;cursor:pointer;color:inherit}
.routecard__head:hover{background:var(--bg-sunken)}
.routecard__stop{display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s4);background:var(--accent-soft);color:var(--accent-text);
  border-top:1px solid var(--accent-border)}
.routecard__stop svg{width:var(--icon-md);height:var(--icon-md);flex:none;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.routecard__deps{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-top:1px solid var(--line);
  background:var(--bg-sunken)}
.routecard__nodeps{color:var(--text-muted)}
.depchip{min-height:32px;padding:4px 12px;border-radius:var(--r-full);
  background:var(--bg-base);border:1px solid var(--line);color:var(--text-primary);
  font-size:var(--f-cap);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;
  cursor:pointer;transition:border-color var(--fast) var(--ease),
  background var(--fast) var(--ease)}
.depchip:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* the clear (×) button inside the live search field — hidden until there
   is a value */
.searchbar__clear{display:none;width:var(--tap-sm);height:var(--tap-sm);
  border-radius:var(--r-full);place-items:center;flex:none;color:var(--text-muted)}
.searchbar__clear--on{display:grid}
.searchbar__clear:hover{color:var(--text-primary);background:var(--bg-sunken)}
.searchbar__clear svg{width:var(--icon-md);height:var(--icon-md);fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pricetag{font-size:var(--f-display);font-weight:var(--fw-bold);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:var(--lh-tight)}
.avatar{width:38px;height:38px;border-radius:var(--r-full);background:var(--bg-inset);
  display:grid;place-items:center;font-weight:var(--fw-bold);font-size:var(--f-cap);
  flex:none;overflow:hidden}
.avatar svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar--sm{width:32px;height:32px;font-size:var(--f-micro)}
.avatar--lg{width:64px;height:64px;font-size:var(--f-head)}
.avatar--lg svg{width:30px;height:30px}
.manifest{display:flex;align-items:center;gap:var(--s3);min-width:0;
  padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--bg-raised);
  min-height:var(--tap-driver)}
.metric{background:var(--bg-raised);border-radius:var(--r-md);padding:var(--s4);min-width:0}
.metric__v{font-size:var(--f-title);font-weight:var(--fw-bold);line-height:var(--lh-tight);
  font-variant-numeric:tabular-nums}
.metric__l{font-size:var(--f-cap);color:var(--text-secondary);margin-top:2px}
.alert{border:1px solid var(--line);border-inline-start:3px solid var(--warn);
  border-radius:var(--r-md);padding:var(--s4);background:var(--bg-base);
  display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.alert--info{border-inline-start-color:var(--info)}
.alert--ok{border-inline-start-color:var(--ok)}
.alert--accent{border-inline-start-color:var(--accent)}
.alert--danger{border-inline-start-color:var(--danger)}

/* stop timeline */
.stops{position:relative;padding-inline-start:var(--s6)}
.stops::before{content:"";position:absolute;inset-inline-start:8px;top:14px;bottom:14px;
  width:2px;background:var(--line-strong)}
.stop{position:relative;display:flex;align-items:center;gap:var(--s3);
  padding-block:var(--s2);min-height:40px;min-width:0}
.stop::before{content:"";position:absolute;inset-inline-start:-21px;width:10px;height:10px;
  border-radius:var(--r-full);background:var(--bg-base);border:2px solid var(--line-strong)}
.stop--now::before{background:var(--brand);border-color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.stop--done::before{background:var(--line-strong)}
.stop--done{opacity:.5}

/* map */
.mapbox{position:relative;border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--line);background:var(--map-land);flex:none}
.mapbox .mapsvg{display:block;width:100%;height:100%;overflow:hidden}
.mapctl{position:absolute;top:var(--s3);inset-inline-end:var(--s3);
  display:flex;flex-direction:column;gap:var(--s1)}
.mapctl button{width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-sm);
  background:var(--bg-base);box-shadow:var(--sh-2);display:grid;place-items:center;
  font-weight:var(--fw-bold)}
.attribution{position:absolute;bottom:0;inset-inline-end:0;background:var(--scrim);
  color:var(--on-solid);font-size:10px;padding:2px 6px;
  border-start-start-radius:var(--r-xs)}

/* QR */
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:var(--s3);
  padding:var(--s5);background:var(--qr-paper);border-radius:var(--r-lg);
  border:1px solid var(--line)}
.qr{width:min(176px,60vw);height:min(176px,60vw);image-rendering:pixelated}
.qrcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;
  font-weight:var(--fw-bold);letter-spacing:.16em;color:var(--qr-ink)}

/* tables — horizontal scroll is the deliberate small-space strategy */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--bg-base);-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;font-size:var(--f-body);min-width:560px}
.table th{text-align:start;font-size:var(--f-micro);color:var(--text-secondary);
  letter-spacing:.05em;text-transform:uppercase;font-weight:var(--fw-bold);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);
  vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--bg-raised)}

/* sheet + scrim */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:var(--z-scrim);
  animation:fade var(--med) var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:var(--z-sheet);
  background:var(--bg-base);border-top:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);
  padding:var(--s5);padding-bottom:calc(var(--s5) + var(--safe-b));
  max-height:min(86%,720px);overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:var(--s3);
  animation:up var(--med) var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet__grip{width:38px;height:4px;border-radius:var(--r-full);
  background:var(--line-strong);margin:0 auto var(--s3);flex:none}
@media (min-width:600px){
  .sheet{inset-inline:auto;inset-inline-start:50%;transform:translateX(-50%);
    bottom:auto;top:50%;translate:0 -50%;width:min(480px,92%);
    border-radius:var(--r-lg);border:1px solid var(--line);
    max-height:min(82%,720px);animation:pop var(--med) var(--ease)}
  .sheet__grip{display:none}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.97)}}
}

/* toast */
.toast{position:absolute;z-index:var(--z-toast);
  bottom:calc(var(--s5) + var(--safe-b));inset-inline:var(--s4);
  background:var(--text-primary);color:var(--bg-base);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);box-shadow:var(--sh-3);
  font-size:var(--f-cap);font-weight:var(--fw-semi);
  display:flex;align-items:center;gap:var(--s2);animation:up var(--med) var(--ease)}
.toast svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:600px){
  .toast{inset-inline:auto;inset-inline-start:50%;translate:-50% 0;
    min-width:300px;max-width:420px;justify-content:center}
}

/* auth */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:var(--s5);padding:var(--s6);
  overflow-y:auto;min-height:0}
.logomark{width:72px;height:72px;border-radius:var(--r-lg);flex:none;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--accent));color:var(--on-solid)}
.logomark svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.authfoot{flex:none;display:flex;flex-direction:column;gap:var(--s3);
  padding:var(--s5) var(--s6);padding-bottom:calc(var(--s6) + var(--safe-b));
  width:100%;max-width:480px;margin-inline:auto}
.authmain{flex:1;min-height:0;overflow-y:auto;padding:var(--s5) var(--s6);
  display:flex;flex-direction:column;gap:var(--s4);
  width:100%;max-width:480px;margin-inline:auto}
/* ══════════════════════════════════════════════════════════════════════
   BOOT SPLASH · LANDING · AUTH · MOTION
   ══════════════════════════════════════════════════════════════════════ */

/* boot splash — bouncy logo; the bounce collapses under reduced motion */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s4);background:var(--bg-page);z-index:var(--z-toast)}
.splash__logo{width:92px;height:92px;animation:splashbounce 1.1s var(--ease) infinite}
.splash__logo svg{width:100%;height:100%}
.splash__name{font-size:var(--f-title);font-weight:var(--brand-font-weight);font-family:var(--brand-font);color:var(--text-primary)}
@keyframes splashbounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-14px) scale(1.05)}}

/* landing — its own scroller; light/dark + RTL via tokens. width:100% is
   REQUIRED: #root is display:flex (row), so a child without width shrinks to
   its content instead of filling the viewport. */
.landing{width:100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;
  background:var(--bg-page);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scroll-timeline-name:--land;scroll-timeline-axis:block}
.landing__nav{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;
  justify-content:space-between;gap:var(--s3);
  padding-inline:clamp(var(--s4), calc((100% - var(--landing-max))/2 + var(--s4)), var(--s6));
  padding-block:var(--s3);
  background:color-mix(in srgb,var(--bg-page) 86%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.landing__brand{display:flex;align-items:center;gap:var(--s2);min-width:0;
  font-weight:var(--brand-font-weight);font-family:var(--brand-font);
  font-size:var(--f-head);color:var(--text-primary)}
.landing__brand svg{width:26px;height:26px;flex:none}
.landing__brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.landing__body{width:100%;max-width:var(--landing-max);margin-inline:auto;
  display:flex;flex-direction:column;gap:var(--s9);padding-bottom:var(--s9)}
/* hero is FULL-BLEED: the glow spans the whole viewport in both themes */
.landing__hero{--hy:0;position:relative;width:100%;min-width:0;padding:var(--s8) var(--s6) var(--s6);
  display:flex;justify-content:center;overflow:clip;
  background:
    radial-gradient(46% 50% at 16% 18%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 72%),
    radial-gradient(42% 46% at 86% 22%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),
    var(--bg-page);
  background-size:180% 180%,170% 170%,100% 100%;
  animation:herodrift 36s ease-in-out infinite alternate}
[data-theme="dark"] .landing__hero{background:
  radial-gradient(46% 50% at 16% 18%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 74%),
  radial-gradient(42% 46% at 86% 22%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 72%),
  var(--bg-page);
  background-size:180% 180%,170% 170%,100% 100%}
/* the soft glows drift very slowly behind the hero (killed under reduced motion) */
@keyframes herodrift{from{background-position:0% 0%,100% 0%}to{background-position:100% 22%,0% 34%}}
.landing__heroinner{width:100%;max-width:var(--landing-max);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s6);min-height:min(78dvh,680px)}
.landing__herotext{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s4);
  min-width:0}
.heroart{position:relative;width:min(380px,78vw);aspect-ratio:1;flex:none;
  transform:translate3d(0,calc(var(--hy)*48px),0)}
.heroart--one{display:grid;place-items:center}
.heroart__s--solo{width:92%;height:92%;color:var(--text-primary);
  animation:herobreathe 5.4s var(--ease) infinite}
@keyframes herobreathe{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.025)}
}
@media (min-width:840px){
  .landing__heroinner{flex-direction:row;align-items:center;gap:var(--s8)}
  .landing__herotext{flex:1 1 52%;align-items:flex-start;text-align:start}
  .heroart{flex:0 1 280px}
}
.landing__title{font-size:clamp(var(--f-title),5.2vw,48px);font-weight:var(--fw-bold);
  line-height:var(--lh-tight);letter-spacing:-.03em;max-width:18ch;margin:0}
.landing__sub{font-size:var(--f-lg);color:var(--text-secondary);max-width:56ch;margin:0;line-height:var(--lh-body)}
@keyframes stickerfloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-14px) rotate(3deg)}
}
.landing__section{padding:0 var(--s6)}
.landing__section--afterstory{padding-top:var(--s9)}
.landing__h2{font-size:var(--f-title);font-weight:var(--fw-bold);margin:0 0 var(--s5)}
.landing__h3{font-size:var(--f-head);font-weight:var(--fw-bold);margin:var(--s2) 0 0}
.landing__p{color:var(--text-secondary);margin:var(--s1) 0 0;line-height:var(--lh-body)}
.landing__grid{display:grid;gap:var(--s4);
  grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.landing__feature{position:relative;overflow:hidden;background:var(--bg-raised);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);
  display:flex;flex-direction:column;
  transition:transform var(--slow) var(--bounce),border-color var(--med) var(--ease),
             box-shadow var(--med) var(--ease)}
.landing__feature:hover{transform:translateY(-8px) scale(1.02);border-color:var(--accent);box-shadow:var(--sh-2)}
.landing__feature::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--ink-0) 22%,transparent) 50%,transparent 60%);
  transform:translateX(-130%);transition:transform var(--med) var(--ease);pointer-events:none}
.landing__feature:hover::after{transform:translateX(130%)}
[dir="rtl"] .landing__feature::after{transform:translateX(130%)}
[dir="rtl"] .landing__feature:hover::after{transform:translateX(-130%)}
.landing__featureico{width:44px;height:44px;border-radius:var(--r-md);display:grid;
  place-items:center;flex:none;transition:transform var(--slow) var(--bounce)}
.landing__feature:hover .landing__featureico{transform:scale(1.18) rotate(-6deg)}
.landing__featureico svg{width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.landing__featureico--mint{background:var(--pop-mint-bg);color:var(--pop-mint-text)}
.landing__featureico--sky{background:var(--pop-sky-bg);color:var(--pop-sky-text)}
.landing__featureico--pink{background:var(--pop-pink-bg);color:var(--pop-pink-text)}
.landing__featureico--lime{background:var(--pop-lime-bg);color:var(--pop-lime-text)}
.landing__featureico--coral{background:var(--pop-coral-bg);color:var(--pop-coral-text)}
.landing__steps{display:grid;gap:var(--s3);
  grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr))}
.landing__step{position:relative;background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s4);min-width:0;overflow:hidden;
  transition:transform var(--fast) var(--ease),
  border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.landing__step:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--sh-2)}
.landing__stepbody{display:flex;flex-direction:row;align-items:center;gap:var(--s4);min-width:0;
  padding-top:var(--s2)}
.landing__steptext{flex:1;min-width:0}
/* stickers: theme-aware ink + per-card accent (set on the parent) */
.sticker{display:grid;place-items:center;color:var(--text-primary);
  --sticker-ink:currentColor;--sticker-accent:var(--brand)}
.sticker svg{width:100%;height:100%;display:block;fill:currentColor}
/* bigger illustration in the how-it-works cards */
.landing__stepart{width:72px;height:72px;flex:none;color:var(--text-primary)}
.landing__step .landing__h3{font-size:var(--f-body);margin:0}
.landing__step .landing__stepart{--sticker-accent:var(--accent)}
/* dark mode: brighter 300-level accents so the doodles glow on dark surfaces
   (light mode keeps the coral accent — unchanged) */
[data-theme="dark"] .landing__step--violet .landing__stepart{--sticker-accent:var(--violet-300)}
[data-theme="dark"] .landing__step--sky .landing__stepart{--sticker-accent:var(--sky-300)}
[data-theme="dark"] .landing__step--mint .landing__stepart{--sticker-accent:var(--mint-300)}
/* number stays on the PHYSICAL right in both languages (owner request) */
.landing__stepnum{position:absolute;top:var(--s3);right:var(--s3);
  font-size:var(--f-title);font-weight:var(--fw-bold);color:var(--accent-text);opacity:.9}
[dir="rtl"] .landing__stepbody{padding-top:var(--s5)} /* clear the number in RTL */
/* cursor-following floating tooltip for the step detail */
.landing__stepdesc{display:none;margin:var(--s1) 0 0}
.step-tip{position:fixed;left:0;top:0;z-index:var(--z-toast);pointer-events:none;opacity:0;
  width:240px;box-sizing:border-box;
  transform:translate3d(-999px,-999px,0);
  transition:opacity var(--med) var(--ease);
  background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);box-shadow:var(--sh-3);color:var(--text-primary)}
.step-tip--on{opacity:1}
@media (hover:none), (max-width:839.98px){
  .step-tip{display:none}
  .landing__stepdesc{display:block}
}
.step-tip__num{display:inline-block;font-size:var(--f-cap);font-weight:var(--fw-bold);
  color:var(--on-accent);background:var(--accent);border-radius:var(--r-full);
  width:22px;height:22px;line-height:22px;text-align:center;margin-bottom:var(--s1)}
.step-tip strong{display:block;color:var(--accent-text);font-size:var(--f-cap);margin-bottom:2px}
.step-tip__body{display:block;color:var(--text-primary);font-size:var(--f-cap);line-height:var(--lh-snug)}
.landing__cta{display:flex;flex-direction:column;align-items:center;gap:var(--s4);
  text-align:center;padding:var(--s7) var(--s6)}
.landing__foot{padding:var(--s5) var(--s6) calc(var(--s5) + var(--safe-b));
  border-top:1px solid var(--line);text-align:center;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
/* the vector credit: smaller than the tagline, on its own line, a real link */
.landing__credits{font-size:var(--f-micro);color:var(--text-muted);text-decoration:none;
  transition:color var(--fast) var(--ease)}
/* policies row in the footer — same quiet link style, separated by dots */
.landing__policies{display:flex;align-items:center;gap:var(--s3)}
.landing__policylink{font-size:var(--f-micro);color:var(--text-muted);text-decoration:none;
  transition:color var(--fast) var(--ease);cursor:pointer}
.landing__policylink:hover{color:var(--accent-text);text-decoration:underline}
.landing__policylink + .landing__policylink::before{content:"·";margin-inline-end:var(--s3);color:var(--text-muted)}
/* the policy document page — narrow reading measure, comfortable top space */
.landing__doc{max-width:720px;margin-inline:auto;padding-block:var(--s8);display:flex;flex-direction:column;gap:var(--s4);align-items:flex-start}
.landing__docsec{display:flex;flex-direction:column;gap:var(--s1);width:100%}
.landing__docsec .landing__h3{margin:0}
.landing__doc .btn--ghost{margin-inline-start:calc(-1 * var(--s3))}
.landing__credits:hover{color:var(--accent-text);text-decoration:underline}
.landing__credits:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:2px}

/* ── landing v2: page nav, sticky panels, drive/about/help ──────────────── */
/* the brand is now a real <button> — reset the native chrome, keep the wordmark */
.landing__brand{border:0;background:none;padding:0;cursor:pointer;text-align:start}
.landing__links{display:none;align-items:center;gap:var(--s1);flex:1;justify-content:center;min-width:0}
.landing__link{border:0;background:none;padding:8px 14px;border-radius:var(--r-full);
  font-size:var(--f-cap);font-weight:var(--fw-semi);color:var(--text-secondary);
  cursor:pointer;transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.landing__link:hover{color:var(--text-primary);background:var(--bg-sunken)}
.landing__link--on{color:var(--brand);background:var(--brand-soft)}
.landing__actions{display:flex;align-items:center;gap:var(--s2);flex:none}
.landing__login{border:0;background:none;padding:8px 12px;border-radius:var(--r-full);
  font-size:var(--f-cap);font-weight:var(--fw-semi);color:var(--text-secondary);
  cursor:pointer;transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.landing__login:hover{color:var(--text-primary);background:var(--bg-sunken)}
.landing__menu{display:grid;place-items:center;width:var(--tap-sm);height:var(--tap-sm);
  border-radius:var(--r-full);border:0;background:none;color:var(--text-primary);
  cursor:pointer;flex:none}
.landing__menu:hover{background:var(--bg-sunken)}
.landing__menu svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.landing__menu-panel{position:absolute;top:calc(100% + var(--s2));inset-inline:var(--s3);
  display:flex;flex-direction:column;gap:var(--s1);background:var(--bg-base);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-3);
  padding:var(--s3);z-index:var(--z-sticky)}
.landing__menulink{border:0;background:none;text-align:start;padding:10px 12px;
  border-radius:var(--r-sm);font-size:var(--f-body);font-weight:var(--fw-semi);
  color:var(--text-primary);cursor:pointer}
.landing__menulink:hover{background:var(--bg-sunken)}
/* eyebrow kicker above a page title */
.landing__kick{font-size:var(--f-cap);font-weight:var(--fw-bold);letter-spacing:.04em;
  text-transform:uppercase;color:var(--accent-text)}
.landing__body--page{padding-top:var(--s8)}
.landing__pagetop{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s4)}
.landing__pagetop .landing__title{max-width:24ch}
.landing__cta-sub{max-width:44ch;margin:var(--s1) auto 0}
/* FAQ — native <details>, one interaction pattern, keyboard + a11y free */
.landing__faq{display:flex;flex-direction:column;gap:var(--s3);max-width:720px}
.landing__faqitem{background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.landing__faqitem summary{cursor:pointer;font-weight:var(--fw-semi);font-size:var(--f-body);
  color:var(--text-primary);list-style:none;display:flex;align-items:center;
  justify-content:space-between;gap:var(--s3)}
.landing__faqitem summary::-webkit-details-marker{display:none}
.landing__faqitem summary::after{content:"+";font-weight:var(--fw-bold);color:var(--accent-text);
  font-size:var(--f-lg);line-height:1}
.landing__faqitem[open] summary::after{content:"−"}
.landing__faqitem summary:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:2px;border-radius:var(--r-xs)}
/* drive hero perk card */
.driverhero{display:flex;flex-direction:column;align-items:center;gap:var(--s5);
  background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:var(--s6);box-shadow:var(--sh-2);min-width:0}
.driverhero__art{width:150px;height:150px;--sticker-ink:var(--text-primary)}
.driverhero__list{display:flex;flex-direction:column;gap:var(--s3);width:100%}
.driverhero__row{display:flex;align-items:center;gap:var(--s3);font-weight:var(--fw-semi);
  color:var(--text-primary);font-size:var(--f-body)}
.driverhero__row svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ── full-bleed sticky stacking panels (native CSS: the next card slides
      over the last; reduced-motion collapses to a plain stack) ─────────── */
.stackpanels{position:relative;display:flex;flex-direction:column;width:100%}
.stackpanels__kick{padding:0 var(--s6);margin:var(--s8) 0 var(--s6)}
.stackpanels__dust{display:none}
@media (min-width:840px){
  .stackpanels__dust{display:block;position:sticky;top:0;height:100dvh;margin-bottom:-100dvh;
    z-index:3;pointer-events:none;overflow:hidden}
  .stackpanel{z-index:1}
  .stackpanels__dustin{position:absolute;left:0;top:-40vh;width:2px;height:2px;
    border-radius:var(--r-full);background:var(--on-solid);will-change:transform}
  .stackpanels__dustin--far{opacity:.2}
  .stackpanels__dustin--mid{opacity:.32}
  .stackpanels__dustin--near{opacity:.48}
}
@media (min-width:840px) and (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:scroll()){
    .stackpanels__dustin--far{animation:dust-far linear both;animation-timeline:--land}
    .stackpanels__dustin--mid{animation:dust-mid linear both;animation-timeline:--land}
    .stackpanels__dustin--near{animation:dust-near linear both;animation-timeline:--land}
  }
}
@keyframes dust-far{from{transform:translate3d(0,20vh,0)}to{transform:translate3d(0,-180vh,0)}}
@keyframes dust-mid{from{transform:translate3d(0,40vh,0)}to{transform:translate3d(0,-280vh,0)}}
@keyframes dust-near{from{transform:translate3d(0,70vh,0)}to{transform:translate3d(0,-420vh,0)}}
@media (prefers-reduced-motion:reduce){.stackpanels__dust{display:none}}
.stackpanel{position:sticky;top:0;min-height:100dvh;display:block;padding:0;color:var(--on-solid);
  overflow:hidden}
@media (min-width:840px){
  .stackpanel{min-height:200dvh}
  .stackpanel:last-child{min-height:100dvh}
}
.stackpanel--violet{background:var(--violet-700)}
.stackpanel--mint{background:var(--mint-700)}
.stackpanel--sky{background:var(--sky-700)}
.stackpanel--coral{background:var(--coral-700)}
.stackpanel__blob{position:absolute;border-radius:var(--r-full);pointer-events:none;
  opacity:.28;animation:blobdrift 14s ease-in-out infinite alternate}
.stackpanel__blob--a{width:min(46vw,280px);height:min(46vw,280px);inset-block-start:-8%;inset-inline-start:-6%;
  background:color-mix(in srgb,var(--ink-0) 55%,transparent)}
.stackpanel__blob--b{width:min(38vw,220px);height:min(38vw,220px);inset-block-end:-10%;inset-inline-end:-4%;
  background:color-mix(in srgb,var(--ink-0) 40%,transparent);animation-delay:-4s}
@keyframes blobdrift{from{transform:translate(0,0) scale(1)}to{transform:translate(18px,-22px) scale(1.08)}}
.stackpanel__stage{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stackpanel__mesh{position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(circle at center,var(--on-solid) 1.2px,transparent 1.4px);
  background-size:28px 28px}
.stackpanel__orb{position:absolute;border-radius:var(--r-full);
  background:color-mix(in srgb,var(--on-solid) 20%,transparent)}
.stackpanel__orb--a{width:min(52vw,340px);height:min(52vw,340px);inset-block-start:-12%;inset-inline-end:-8%}
.stackpanel__orb--b{width:min(34vw,200px);height:min(34vw,200px);inset-block-end:18%;inset-inline-start:-6%}
.stackpanel__orb--c{width:min(18vw,110px);height:min(18vw,110px);inset-block-start:28%;inset-inline-start:18%}
.stackpanel__ring{position:absolute;inset-inline-end:8%;inset-block-start:14%;
  width:min(42vw,280px);height:min(42vw,280px);border-radius:var(--r-full);
  border:2px solid color-mix(in srgb,var(--on-solid) 32%,transparent);animation:ringspin 22s linear infinite}
@keyframes ringspin{to{transform:rotate(360deg)}}
.stackpanel__ghost{position:absolute;inset-inline-end:4%;inset-block-end:6%;
  font-size:clamp(96px,28vw,220px);font-weight:var(--fw-bold);line-height:.8;
  color:color-mix(in srgb,var(--on-solid) 12%,transparent);letter-spacing:-.06em}
.stackpanel__inner{position:relative;z-index:1;max-width:var(--landing-max);width:100%;margin-inline:auto;
  min-height:100dvh;box-sizing:border-box;padding:var(--s8) var(--s6);

@media (min-width:840px){
  .stackpanel__inner{position:sticky;top:0;height:100dvh;min-height:100dvh;
    flex-direction:row;align-items:center;justify-content:center;text-align:start;gap:var(--s8)}
}
.stackpanel__copy{display:flex;flex-direction:column;align-items:center;gap:var(--s3);min-width:0}
@media (min-width:840px){.stackpanel__copy{align-items:flex-start;flex:1}}
.stackpanel__kick{color:var(--on-solid);opacity:.88}
.stackpanel{--sy:0}
.stackpanel__art{width:min(260px,56vw);height:min(200px,42vw);flex:none;color:var(--on-solid)}
.stackpanel__orb--a{transform:translate3d(calc(var(--sy)*24px),calc(var(--sy)*-140px),0)}
.stackpanel__orb--b{transform:translate3d(calc(var(--sy)*-30px),calc(var(--sy)*90px),0)}
.stackpanel__orb--c{transform:translate3d(0,calc(var(--sy)*-60px),0)}

.stackpanel--violet .stackpanel__art{--sticker-accent:var(--violet-300)}
.stackpanel--mint .stackpanel__art{--sticker-accent:var(--mint-300)}
.stackpanel--sky .stackpanel__art{--sticker-accent:var(--sky-300)}
.stackpanel--coral .stackpanel__art{--sticker-accent:var(--coral-300)}

@media (prefers-reduced-motion: no-preference){

/* Safe storage — localStorage throws on opaque origins (file://, jsdom),
   which must never crash the app. */
const storeGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const storeSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };

/* resolvedTheme: S.theme is a preference ("auto"|"light"|"dark"); the resolved
   value is what the DOM actually renders. Auto = the device's prefers-color-
   scheme when the OS signals it, otherwise the local time of day (06:00–18:00
   light, night dark). An explicit choice always wins. */
const resolvedTheme = (now = new Date()) => {
  if (S.theme === "auto") {
    try {
      if (window.matchMedia) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
        if (window.matchMedia("(prefers-color-scheme: light)").matches) return "light";
      }
    } catch (e) { /* no matchMedia — fall through to time */ }
    const h = now.getHours();
    return (h >= 6 && h < 18) ? "light" : "dark";
  }
  return S.theme;
};

const detectLang = () => {
  try { return (navigator && navigator.language && String(navigator.language).toLowerCase().startsWith("ar"))
    ? "ar" : "en"; } catch(e){ return "en"; }

   back to the generic message instead of leaking the raw key */
const errText = key => {
  const copy = t(key);
  return copy && copy !== key ? copy : t("error.internal");
};

/* Cooldown & lockout deadlines — persisted so a page refresh keeps the
   countdown honest (the server re-derives them on every request anyway). */
const setResendUntil = ms => { S.resendUntil = Date.now() + ms; storeSet("rs.resendUntil", String(S.resendUntil)); };
const setLockedUntil = date => {
  if (date) { S.lockedUntil = new Date(date); storeSet("rs.lockedUntil", String(S.lockedUntil.getTime())); }
  else { S.lockedUntil = null; try{localStorage.removeItem("rs.lockedUntil");}catch(e){} }
};

  return S.lang==="ar" ? `${sign}${v} ج.م` : `${sign}${v} EGP`;
};

const $ = (tag, opts={}, ...kids) => {
  const n = document.createElement(tag);
  if (opts.class) n.className = opts.class;
  if (opts.id != null) n.id = opts.id;   // convenience: id is a plain property
  if (opts.text != null) n.textContent = opts.text;
  if (opts.attrs) for (const [k,v] of Object.entries(opts.attrs)){
    if (v === true) n.setAttribute(k,"");
    else if (v != null && v !== false) n.setAttribute(k,v);
  }
  if (opts.style) Object.assign(n.style, opts.style);
  if (opts.on) for (const [e,f] of Object.entries(opts.on)) n.addEventListener(e,f);
  for (const k of kids.flat()){ if (k==null || k===false) continue;
    n.append(k.nodeType ? k : document.createTextNode(k)); }
  return n;
};

/* navigation — a real stack, so Back always has somewhere to go */
const go = (p) => { if (S.page!==p) S.stack.push(S.page); S.page=p; S.sheet=null; render(); };
const back = () => { S.page = S.stack.pop() || DEFAULT_PAGE[S.role]; S.sheet=null; render(); };
const openSheet = (s) => { S.sheet=s; render(); };
const closeSheet = () => { S.sheet=null; render(); };
const toast = (msg) => { S.toast=msg; render();
  clearTimeout(toast._h); toast._h=setTimeout(()=>{S.toast=null;render();}, 2600); };

   resets it. The value is restored after a re-render so a navigation never
   silently drops the query. */
const SearchBar = ({placeholder, on, live, value, onInput}) => {
  if (!live)
    return $("button",{class:"searchbar", attrs:{type:"button"}, on:{click:on||(()=>{})}},
      icon("lookup"), $("span",{class:"grow",text:placeholder}), icon("fwd","chev"));

  const input = $("input",{class:"searchbar__input",
    attrs:{type:"search", placeholder, "aria-label":placeholder}});
  if (value) input.value = value;
  const clear = $("button",{class:"searchbar__clear", attrs:{type:"button","aria-label":t("cancel")},
    on:{click:()=>{ input.value=""; clear.classList.remove("searchbar__clear--on"); input.focus(); onInput && onInput(""); }}},
    icon("close"));
  if (value) clear.classList.add("searchbar__clear--on");
  input.addEventListener("input", (e)=>{
    const v = e.currentTarget.value;
    clear.classList.toggle("searchbar__clear--on", !!v);
    if (onInput) onInput(v);
  });
  input.addEventListener("keydown", (e)=>{ if (e.key==="Enter" && on) on(); });
  return $("label",{class:"searchbar searchbar--field"}, icon("lookup"), input, clear);
};

/* Six-box one-time-code input — the industry-standard shape. Digits only,
   auto-advance, backspace/arrow navigation, paste and mobile one-time-code
   autofill distribute across the boxes. `onComplete` fires when all six are
   filled. Read the value with otpValue(). */
const otpValue = () =>
  [...document.querySelectorAll(".otp__box")].map((b) => b.value || "").join("").replace(/\D/g, "");
function OtpInput({ onComplete }) {
  const wrap = $("div", { class: "otp", attrs: { role: "group", "aria-label": t("codeLabel") } });
  const boxes = [];
  const allFilled = () => boxes.every((b) => b.value);
  for (let i = 0; i < 6; i++) {
    const inp = $("input", {
      class: "otp__box ltr",
      attrs: {
        type: "text", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6",
        "aria-label": `${t("codeLabel")} ${i + 1}`,
      },
    });
    inp.addEventListener("input", () => {
      const v = inp.value.replace(/\D/g, "");
      if (v.length > 1) { // paste or one-time-code autofill
        inp.value = "";
        v.slice(0, 6).split("").forEach((d, k) => { boxes[k].value = d; });
        boxes[Math.min(v.length, 6) - 1].focus();
      } else {
        inp.value = v;
        if (v && i < 5) boxes[i + 1].focus();
      }
      if (allFilled() && onComplete) onComplete(otpValue());
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !inp.value && i > 0) {
        boxes[i - 1].value = ""; boxes[i - 1].focus(); e.preventDefault();
      } else if (e.key === "ArrowLeft" && i > 0) { boxes[i - 1].focus(); }
      else if (e.key === "ArrowRight" && i < 5) { boxes[i + 1].focus(); }
    });
    boxes.push(inp);
  }
  wrap.append(...boxes);
  return wrap;
}

/* Real map — Google when GOOGLE_MAPS_API_KEY is set, otherwise OpenStreetMap
   via Leaflet (DEC-198, free + no key). Honest fallback: with no SDK loaded
   the illustration renders and is labelled as such. `onPick` (lat,lng) turns
   the map into a coordinate picker for the desk mapping tool. */
const ALEX_CENTER = { lat: 31.2241, lng: 29.9549 }; // Alexandria
function realMapView({h, route, locate, onPick}) {
  const id = "gmap-" + Math.random().toString(36).slice(2, 9);
  const box = $("div",{class:"mapbox mapbox--real",style:{height:h+"px"}});
  box.append($("div",{class:"mapbox__canvas",attrs:{id, "aria-label":t("mapLive")}}));
  if (locate) box.append($("button",{class:"mapbox__locate", attrs:{type:"button","aria-label":t("locateMe")},
    on:{click:()=>locateMe()}}, icon("stops"), $("span",{class:"t-cap",text:t("locateMe")})));
  box.append($("div",{class:"attribution",text: window.L ? "OpenStreetMap" : "Google"}));
  // init after the element is in the DOM
  setTimeout(()=>{
    const el = document.getElementById(id);
    if (!el) return;

    if (window.L) {                       // OpenStreetMap via Leaflet
      const map = L.map(el, { zoomControl: false, attributionControl: true });
      map.setView([ALEX_CENTER.lat, ALEX_CENTER.lng], 13);
      L.tileLayer("https://tiles.openfreemap.org/styles/liberty/{z}/{x}/{y}.webp", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      window.__rsMapInstance = map;
      if (onPick) map.on("click", (e) => onPick(e.latlng.lat, e.latlng.lng));
      return;
    }

    if (!window.google?.maps) return;
    const map = new google.maps.Map(el, {
      center: ALEX_CENTER, zoom: 13,
      disableDefaultUI: true, clickableIcons: false,
      styles: [], fullscreenControl: false, streetViewControl: false,
    });
    window.__rsMapInstance = map;
    if (onPick) map.addListener("click", (e) => onPick(e.latLng.lat(), e.latLng.lng()));
    if (route) {
      // token, not a literal — the design system owns every colour (§0.3)
      const brand = getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "violet";
      new google.maps.Polyline({
        path: [{lat:31.2456,lng:29.9839},{lat:31.2241,lng:29.9549},{lat:31.2037,lng:29.9196}],
        map, geodesic:true,
        strokeColor: brand, strokeOpacity:0.9, strokeWeight:5,
      });
    }
    new google.maps.Marker({ position: ALEX_CENTER, map, title: t("brand") });
  }, 0);
  return box;
}

function locateMe() {
  const map = window.__rsMapInstance;
  if (!map) { toast("locateDenied"); return; }
  const go = (lat, lng) => {
    if (map.setView) map.setView([lat, lng], map.getZoom && map.getZoom() > 3 ? map.getZoom() : 13);
    else map.setCenter({ lat, lng });
  };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => go(pos.coords.latitude, pos.coords.longitude),
      () => go(ALEX_CENTER.lat, ALEX_CENTER.lng),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  } else {
    go(ALEX_CENTER.lat, ALEX_CENTER.lng);
  }
}

/* QR — deterministic blocks + the numeric code that is the real fallback */
function QRPanel({code}){
  const ns="http://www.w3.org/2000/svg", n=21, cell=8;
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${n*cell} ${n*cell}`);
  svg.setAttribute("class","qr");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label", t("boardingCode")+" "+code.split("").join(" "));
  let r=`<rect width="${n*cell}" height="${n*cell}" fill="var(--qr-paper)"/>`;
  const finder=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="var(--qr-ink)"/>
    <rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="var(--qr-paper)"/>
    <rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="var(--qr-ink)"/>`;
  r+=finder(0,0)+finder(n-7,0)+finder(0,n-7);
  let s=parseInt(code,10)||7;
  const rnd=()=> (s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(!inF && rnd()>0.52) r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="var(--qr-ink)"/>`;
  }
  svg.innerHTML=r;
  return $("div",{class:"qrwrap"}, svg,
    $("div",{class:"stack center gap1"},
      $("div",{class:"t-micro",text:t("boardingCode")}),
      $("div",{class:"qrcode ltr",text:code})),
    $("div",{class:"t-cap",text:t("scanAtDoor")}));
}
