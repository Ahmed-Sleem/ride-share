/* ══════════════════════════════════════════════════════════════════════
   Search — the ONE place text search happens (§0.3). Fuse.js (Apache-2.0,
   vendored into the build by build.js) does the fuzzy ranking; this module
   owns the index and the Arabic/English NORMALIZATION so both languages
   match consistently: diacritics stripped, alef/hamza/teh-marbuta/ya
   unified, Latin lowercased. A rider typing "smouha" or "سموحه" hits the
   same stop. Riders search ROUTES (with their boarding stops) and see the
   BOOKABLE JOURNEYS nested under each route — a route with no claimed
   departure is still listed, honestly, with an empty "no departures" state.
   ══════════════════════════════════════════════════════════════════════ */

/* Arabic harakat + superscript alef + tatweel — the marks that break a
   naive substring match. */
const AR_DIACRITICS = /[\u064B-\u0652\u0670\u0640]/g;

const normalizeText = (s) => String(s == null ? "" : s)
  .toLowerCase()
  .replace(AR_DIACRITICS, "")
  .replace(/[\u0623\u0625\u0622\u0671]/g, "\u0627")   // alef variants → ا
  .replace(/\u0624/g, "\u0648")                      // waw + hamza → و
  .replace(/\u0626/g, "\u064A")                      // ya + hamza → ي
  .replace(/\u0649/g, "\u064A")                      // alef maqsura → ي
  .replace(/\u0629/g, "\u0647")                      // teh marbuta → ه
  .replace(/\s+/g, " ")
  .trim();

/* One searchable route entry. `stops` are the route's boarding stops
   (route_stops joined with stop names, from GET /routes/published). */
function routeSearchEntry(route, stops) {
  const names = [
    route.name_en || "", route.name_ar || "", route.code || "",
    ...(stops || []).map((s) =>
      (s.stop_name_en || "") + " " + (s.stop_name_ar || "") + " " + (s.stop_code || "")),
  ].join(" ");
  return {
    id: route.id,
    route,
    stops: stops || [],
    nName: normalizeText((route.name_en || "") + " " + (route.name_ar || "")),
    nCode: normalizeText(route.code || ""),
    nText: normalizeText(names),
  };
}

function buildRiderIndex(routesWithStops) {
  return (routesWithStops || []).map((rw) => routeSearchEntry(rw.route, rw.stops));
}

/* Ranked route ids for a query. Empty query → every route, in order.
   Exact/substring hits on the route name or code rank FIRST; Fuse ranks the
   rest on the full normalized text (name + boarding stops). */
function searchRoutes(query, index) {
  const q = normalizeText(query);
  if (!q) return (index || []).map((e) => e.id);
  const nameHit = (index || []).filter((e) => e.nName.includes(q) || e.nCode.includes(q));
  const seen = new Set(nameHit.map((e) => e.id));
  let fuzzy = [];
  try {
    const fuse = new Fuse(index, {
      keys: [{ name: "nText", weight: 1 }],
      threshold: 0.45,
      ignoreLocation: true,
      minMatchCharLength: 2,
    });
    fuzzy = fuse.search(q).map((r) => r.item);
  } catch (e) { /* Fuse unavailable → substring fallback below still applies */ }
  const rest = fuzzy.filter((e) => !seen.has(e.id));
  return nameHit.concat(rest).map((e) => e.id);
}

/* A plain field filter (used by the ops stops list): true when the query is
   empty or every query token appears in the normalized text. */
function matchesQuery(query, text) {
  const q = normalizeText(query);
  if (!q) return true;
  const t = normalizeText(text);
  if (t.includes(q)) return true;
  return q.split(" ").filter(Boolean).every((tok) => t.includes(tok));
}


/* ══════════════════════════════════════════════════════════════════════
   API client — the ONE place the interface talks to the backend (§0.3).
   The browser only ever calls the same origin (the web server proxies
   /v1/* to the API over the private network), so there is no CORS and no
   key in the client. Session = access + refresh tokens in localStorage;
   refresh happens exactly once here, on 401.

   No mocks: a request that cannot reach a backend is a real error state,
   never a fabricated success.                                       */
const API = {
  base: "/v1",
  access: () => storeGet("rs.access"),
  refreshToken: () => storeGet("rs.refresh"),
  user: () => { try { return JSON.parse(storeGet("rs.user") || "null"); } catch { return null; } },

  saveSession({ user, accessToken, refreshToken }) {
    storeSet("rs.access", accessToken);
    storeSet("rs.refresh", refreshToken);
    storeSet("rs.user", JSON.stringify(user));
  },

  clearSession() {
    try { localStorage.removeItem("rs.access"); } catch {}
    try { localStorage.removeItem("rs.refresh"); } catch {}
    try { localStorage.removeItem("rs.user"); } catch {}
  },

  async request(method, path, body) {
    if (typeof fetch !== "function") throw new ApiError("NETWORK", "error.network", null);
    const headers = { "content-type": "application/json" };
    const token = this.access();
    if (token) headers["authorization"] = "Bearer " + token;
    let res;
    try {
      res = await fetch(this.base + path, {
        method,
        headers,
        body: body != null ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new ApiError("NETWORK", "error.network", null);
    }
    let payload = null;
    try { payload = await res.json(); } catch { /* non-JSON */ }
    if (!res.ok) {
      // 502/503/504 from the proxy means the API is unreachable — a clearer,
      // retryable message beats "something went wrong" for the user.
      const fallback = res.status >= 500 ? "error.unavailable" : "error.internal";
      const err = new ApiError(
        (payload && payload.code) || String(res.status),
        (payload && payload.message_key) || fallback,
        payload
      );
      // one refresh attempt on expired access, then retry exactly once
      if (res.status === 401 && token && path !== "/auth/refresh" && path !== "/auth/login") {
        const refreshed = await this._refresh();
        if (refreshed) return this.request(method, path, body);
      }
      throw err;
    }
    return payload;
  },

  async _refresh() {
    const refreshToken = this.refreshToken();
    if (!refreshToken) return false;
    try {
      const r = await fetch(this.base + "/auth/refresh", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ refreshToken }),
      });
      if (!r.ok) { this.clearSession(); return false; }
      const p = await r.json();
      this.saveSession(p);
      return true;
    } catch { return false; }
  },

  /* ── auth ─────────────────────────────────────────────────────────── */
  identify: (identifier) => API.request("POST", "/auth/login/identify", { identifier }),
  login: (identifier, password) => API.request("POST", "/auth/login", { identifier, password }),
  requestOtp: (email) => API.request("POST", "/auth/otp/request", { email }),
  verifyOtp: (email, code) => API.request("POST", "/auth/otp/verify", { email, code }),
  signupVerify: (email, code, name, password) => API.request("POST", "/auth/signup/verify", { email, code, name, password }),
  me: () => API.request("GET", "/me"),
  changePassword: (current, next) => API.request("POST", "/me/password", { current, next }),
  getConfig: () => API.request("GET", "/config"),

  /* ── verification & recovery (DEC-189) ────────────────────────────── */
  requestEmailVerification: (email) => API.request("POST", "/me/email/request", { email }),
  verifyEmail: (code) => API.request("POST", "/me/email/verify", { code }),
  requestPasswordReset: (identifier) => API.request("POST", "/auth/reset/request", { identifier }),
  confirmPasswordReset: (identifier, code, newPassword) =>
    API.request("POST", "/auth/reset/confirm", { identifier, code, newPassword }),

  /* ── staff administration (super_admin) ───────────────────────────── */
  listStaff: () => API.request("GET", "/admin/staff"),
  createStaff: (payload) => API.request("POST", "/admin/staff", payload),
  updateStaff: (id, payload) => API.request("PATCH", `/admin/staff/${id}`, payload),
  deleteStaff: (id) => API.request("DELETE", `/admin/staff/${id}`),
  listAudit: () => API.request("GET", "/admin/audit"),

  /* ── drivers & vehicles ───────────────────────────────────────────── */
  driverApply: () => API.request("POST", "/driver/apply"),
  driverMe: () => API.request("GET", "/driver/me"),
  addVehicle: (plate, model, colour) => API.request("POST", "/driver/vehicles", { plate, model, colour }),
  listDriverApplications: () => API.request("GET", "/ops/driver-applications"),
  reviewDriverApplication: (id, decision, reason) =>
    API.request("POST", `/ops/driver-applications/${id}/review`, { decision, reason }),
  listVehicles: () => API.request("GET", "/ops/vehicles"),
  reviewVehicle: (id, decision) => API.request("POST", `/ops/vehicles/${id}/review`, { decision }),

  /* ── geography (M2) ────────────────────────────────────────────────── */
  createStop: (payload) => API.request("POST", "/stops", payload),
  importStops: (csv) => API.request("POST", "/stops/import", { csv }),
  listStops: (status) => API.request("GET", status ? `/stops?status=${status}` : "/stops"),
  captureStop: (payload) => API.request("POST", "/stops/capture", payload),
  submitStop: (id) => API.request("POST", `/stops/${id}/submit`),
  reviewStop: (id, decision, reason) => API.request("POST", `/stops/${id}/review`, { decision, reason }),
  retireStop: (id) => API.request("POST", `/stops/${id}/retire`),

  /* ── routes & journeys (M3) ─────────────────────────────────────────── */
  listRoutes: () => API.request("GET", "/routes"),
  createRoute: (payload) => API.request("POST", "/routes", payload),
  getRoute: (id) => API.request("GET", `/routes/${id}`),
  publishRoute: (id) => API.request("POST", `/routes/${id}/publish`),
  addStopToRoute: (id, stopId) => API.request("POST", `/routes/${id}/stops`, { stopId }),
  reorderRoute: (id, orderedStopIds) => API.request("POST", `/routes/${id}/reorder`, { orderedStopIds }),
  generateSlots: (id, fromDate, toDate) => API.request("POST", `/routes/${id}/slots`, { fromDate, toDate }),
  listRouteSlots: (id, from, to) => API.request("GET", `/routes/${id}/slots?from=${from}&to=${to}`),
  driverVehicles: () => API.request("GET", "/driver/vehicles"),
  claimJourney: (slotId, vehicleId, committed) => API.request("POST", "/journeys/claim", { slotId, vehicleId, committed }),
  releaseJourney: (id) => API.request("POST", `/journeys/${id}/release`),
  openJourney: (id) => API.request("POST", `/journeys/${id}/open`),
  myJourneys: () => API.request("GET", "/journeys/mine"),
  availableJourneys: (from, to) => API.request("GET", `/journeys/available?from=${from}&to=${to}`),

  /* ── rider booking (P3.4–P3.6) ───────────────────────────────────────── */
  publishedRoutes: () => API.request("GET", "/routes/published"),
  // routeId may be null → omit the param (server returns journeys on ANY
  // route in the window; a literal "route=null" would be an invalid uuid).
  upcomingJourneys: (routeId, from, to) => API.request("GET",
    `/journeys/upcoming?${routeId ? `route=${routeId}&` : ""}from=${from}&to=${to}`),
  book: (journeyId, boardingStopId, seats) => API.request("POST", "/bookings", { journeyId, boardingStopId, seats }),
  myBookings: () => API.request("GET", "/bookings/mine"),
  cancelBooking: (id) => API.request("POST", `/bookings/${id}/cancel`),

  /* Fetch a stop photo as a data URL (auth header can't ride an <img> tag). */
  stopPhoto: async (id) => {
    if (typeof fetch !== "function") return null;
    const token = API.access();
    const res = await fetch(`${API.base}/stops/${id}/photo`, {
      headers: token ? { authorization: "Bearer " + token } : {},
    });
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => resolve(null);
      r.readAsDataURL(blob);
    });
  },

  /* ===== payments client (Path A — docs/planning/PATH_A_MONEY.md §5) ===== */
  paymentsConfig: () => API.request("GET", "/payments/config"),
  wallet: () => API.request("GET", "/payments/wallet"),
  topup: (amountMinor) => API.request("POST", "/payments/topup", { amountMinor }),
  cashCollected: (bookingId) => API.request("POST", "/payments/cash-collected", { bookingId }),
  driverEarnings: () => API.request("GET", "/payments/driver/earnings"),
};

class ApiError extends Error {
  constructor(code, messageKey, payload) {
    super(messageKey);
    this.code = code;
    this.messageKey = messageKey;
    this.payload = payload;
  }
}

/* Resolve the session on boot: a stored session is validated against /me
   (refresh on 401). Returns the user or null. Never throws. */
async function resolveSession() {
  const user = API.user();
  if (!user || !API.access()) return null;
  try {
    const me = await API.me();           // { actor: { id, role } }
    const fresh = { ...user };
    if (me && me.actor) {
      fresh.id = me.actor.id;
      fresh.role = me.actor.role;
    }
    storeSet("rs.user", JSON.stringify(fresh));
    return fresh;
  } catch {
    API.clearSession();
    return null;
  }
}


/* ══════════════════════════════════════════════════════════════════════
   Landing page — the front door. Uber/Careem-style: a sticky top bar with
   Ride (default) · Drive · About · Help · language · theme · Log in · Sign up,
   a separate marketing PAGE for riders and for drivers, an About and a Help
   page, and filled policy documents. The hero is full-bleed with the feature
   slideshow; below it, scroll-driven reveals + full-bleed sticky "stacking
   panels" (native CSS position:sticky — the next panel slides over the last,
   no scroll library). Everything is light/dark + RTL via the shared tokens,
   and reduced-motion collapses every effect to the static page.
   ══════════════════════════════════════════════════════════════════════ */
function landing() {
  document.querySelectorAll("body > .step-tip").forEach((el) => el.remove());
  if (S.landingDoc) return landingDoc();
  const page = ({ rider: riderLanding, drive: driveLanding, about: aboutLanding, help: helpLanding })[S.landingPage] || riderLanding;
  return page();
}

   Log in · Sign up. Compact: brand · theme · Sign up · menu (the links + Log in

  }, logoSVG(), $("span", { text: t("brand") })));

  const linksEl = $("nav", { class: "landing__links", attrs: { "aria-label": t("menu") } });
  links.forEach(([k, lbl]) => linksEl.append(landingLink(k, lbl)));
  nav.append(linksEl);

  const actions = $("div", { class: "landing__actions" });
  actions.append($("span", { class: "landing__tgl" }, langToggle()),
                 $("span", { class: "landing__tgl landing__tgl--theme" }, themeToggle()));
  actions.append($("button", {
    class: "landing__login", attrs: { type: "button" }, text: t("login"),

    class: "landing__menu", attrs: { type: "button", "aria-label": t("menu"), "aria-expanded": String(!!S.landingMenu) },
    on: { click: () => { S.landingMenu = !S.landingMenu; render(); } },

function bindStoryScroll(scroller) {
  if (!scroller) return;
  if (typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let ticking = false;
  const tick = () => {
    ticking = false;
    const vh = scroller.clientHeight || 1;
    const hero = scroller.querySelector(".landing__hero");
    if (hero) {
      const t = Math.max(0, Math.min(1, -hero.getBoundingClientRect().top / Math.max(hero.offsetHeight, 1)));
      hero.style.setProperty("--hy", t.toFixed(3));
    }
    scroller.querySelectorAll(".stackpanel").forEach((p) => {
      const t = Math.max(-1, Math.min(1, -p.getBoundingClientRect().top / vh));
      p.style.setProperty("--sy", t.toFixed(3));
    });
  };
  scroller.addEventListener("scroll", () => {
    if (!ticking) { ticking = true; requestAnimationFrame(tick); }
  }, { passive: true });
  requestAnimationFrame(tick);
}

/* ── how-it-works steps: number stays on the SAME side in RTL (physical
      right), and a floating tooltip follows the cursor on hover ─────────── */
function stepCard(n, ic, title, body, tone) {
  const tip = $("div", { class: "step-tip", attrs: { role: "tooltip" } },
    $("span", { class: "step-tip__num ltr", text: n }),
    $("strong", { text: title }),
    $("span", { class: "step-tip__body", text: body }));
  const card = $("div", { class: "landing__step reveal" + (tone ? " landing__step--" + tone : "") },
    $("div", { class: "landing__stepnum ltr", text: n }),
    $("div", { class: "landing__stepbody" },
      stickerEl(ic, "landing__stepart"),
      $("div", { class: "landing__steptext" },
        $("h3", { class: "landing__h3", text: title }),
        $("p", { class: "landing__stepdesc landing__p", text: body }))));
  document.body.appendChild(tip);

  const isCompact = () => typeof window.matchMedia === "function" &&
    window.matchMedia("(hover: none), (max-width: 839.98px)").matches;
  let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;
  const place = () => {
    raf = 0;
    tx += (cx - tx) * 0.22;
    ty += (cy - ty) * 0.22;
    const w = 240, h = tip.offsetHeight || 88, pad = 12;
    const x = Math.min(window.innerWidth - w - pad, Math.max(pad, tx + 16));
    const y = Math.min(window.innerHeight - h - pad, Math.max(pad, ty - h - 12));
    tip.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    if (tip.classList.contains("step-tip--on") && (Math.abs(cx - tx) > 0.4 || Math.abs(cy - ty) > 0.4))
      raf = requestAnimationFrame(place);
  };
  card.addEventListener("pointerenter", (e) => {
    if (isCompact()) return;
    cx = e.clientX; cy = e.clientY; tx = cx; ty = cy;
    tip.classList.add("step-tip--on");
    if (!raf) raf = requestAnimationFrame(place);
  });
  card.addEventListener("pointermove", (e) => {
    if (isCompact() || !tip.classList.contains("step-tip--on")) return;
    cx = e.clientX; cy = e.clientY;
    if (!raf) raf = requestAnimationFrame(place);
  });
  card.addEventListener("pointerleave", () => {
    tip.classList.remove("step-tip--on");
  });
  return card;
}

/* ══════════════════════════════════════════════════════════════════════
   Auth screens — the REAL flows, wired to the API. No fabricated success.

   Sign-up: the user chooses Rider or Driver (the only two self-service
   roles). Both self-register by EMAIL code; the domain must be one the
   server accepts (allowlist — temporary mailboxes are refused with a
   friendly message). Choosing Driver also submits the driver application
   after the account exists. Staff never self-register (DEC-032/033).

   Sign-in: ONE field. The system auto-detects the account: a password
   account (staff) is asked for its password; an OTP account (rider/driver)
   gets a login code emailed automatically. No visible role toggle.

   Resend respects the backend 60s cooldown (live countdown); a 1-hour lockout
   after 3 failures is shown honestly; both survive a page refresh (the
   server re-derives them from PostgreSQL on every request — the client only
   mirrors the countdown). Forgot-password and email verification share the
   same style and error-key handling.
   ══════════════════════════════════════════════════════════════════════ */
function auth() {
  if (S.forgot) return forgotPassword();
  return S.authMode === "signup" ? signupAuth() : signinAuth();
}

/* ── sign-up: rider or driver ──────────────────────────────────────────── */
function signupAuth() {
  let body;
  if (S.authStep === "choose") {
    body = $("div",{class:"stack gap3"},
      $("div",{class:"t-head center",text:t("signupChoose")}),
      roleChoice("rider", t("roleLabel.rider"), t("signupRiderSub"), "wallet"),
      roleChoice("driver", t("roleLabel.driver"), t("signupDriverSub"), "bus"));
  } else if (S.authStep === "email") {
    body = $("div",{class:"stack gap3"},
      field("auth-email", t("emailLabel"), "email", "email"),
      $("p",{class:"t-cap",text:t("emailHelp")}),
      cooldownButton(Btn({label:S.authBusy? "…" : t("sendCode"), block:true, dis:S.authBusy, on:()=>riderSendCode()}),
                     S.authBusy? "…" : t("sendCode")));
  } else if (S.authStep === "otp") {
    body = otpStep(
      `${t("codeSent")} `,
      () => signupVerifyCode(),
      () => riderSendCode(),
      () => { S.authStep="email"; S.authError=null; render(); },
      { nameField:true, btnLabel:t("createAccount") });
  } else if (S.authStep === "name") {
    // OTP bypass: the code step is skipped — name + password are collected.
    body = $("div",{class:"stack gap3"},
      field("auth-name", t("yourName"), "text", "name"),
      field("auth-password", t("passwordLabel"), "password", "new-password"),
      $("p",{class:"t-cap",text:t("passwordHint")}),
      Btn({label:S.authBusy? "…" : t("createAccount"), block:true, dis:S.authBusy, on:()=>signupVerifyCode()}));
  }
  return card(t("createAccount"), body, S.authMode==="signup");
}

/* ── sign-in: smart auto-detect ────────────────────────────────────────── */
function signinAuth() {
  let body;
  if (S.loginMethod === "password") {
    body = $("div",{class:"stack gap3"},
      $("p",{class:"t-cap"}, t("enterPassword")),
      field("auth-password", t("passwordLabel"), "password", "current-password"),
      Btn({label:S.authBusy? "…" : t("signInAction"), block:true, dis:S.authBusy, on:()=>staffLogin()}),
      backBtn(()=>{ S.loginMethod=null; render(); }));
  } else if (S.loginMethod === "otp") {
    body = otpStep(
      `${t("codeSentTo")} `,
      () => signinVerifyCode(),
      () => identify(),
      () => { S.loginMethod=null; render(); });
  } else {
    body = $("div",{class:"stack gap3"},
      field("auth-identifier", t("identifierLabel"), "email", "email"),
      cooldownButton(Btn({label:S.authBusy? "…" : t("signinContinue"), block:true, dis:S.authBusy, on:()=>identify()}),
                     S.authBusy? "…" : t("signinContinue")),
      $("button",{class:"btn btn--ghost", attrs:{type:"button"}, text:t("forgotPassword"),
        on:{click:()=>{ S.forgot="identify"; S.authError=null; render(); }}}));
  }
  return card(t("signIn"), body, true);
}

/* Shared OTP step: the sent-to line, the six boxes, the attempts hint, the
   verify button, the resend countdown, and a way back to the email field.
   Sign-up also collects the rider's name on this step. */
function otpStep(sentPrefix, onVerify, onResend, onBack, opts) {
  opts = opts || {};
  return $("div",{class:"stack gap3"},
    $("p",{class:"t-cap center"}, sentPrefix,
      $("span",{class:"ltr",text:S.authEmail})),
    OtpInput({ onComplete: onVerify }),
    opts.nameField ? field("auth-name", t("yourName"), "text", "name") : null,
    opts.nameField ? field("auth-password", t("passwordLabel"), "password", "new-password") : null,
    opts.nameField ? $("p",{class:"t-cap",text:t("passwordHint")}) : null,
    S.attemptsLeft != null
      ? $("p",{class:"t-cap center",text:`${t("attemptsLeft")}: ${S.attemptsLeft}`}) : null,
    Btn({label:S.authBusy? "…" : (opts.btnLabel || t("verifyCode")), block:true, dis:S.authBusy, on:onVerify}),
    resendButton(onResend),
    backBtn(onBack));

/* Live countdown that updates the button IN PLACE — never re-render(), because
   a full render wipes the OTP boxes the user is typing into (and, on the email
   step, the email they just typed). The cooldown deadline is S.resendUntil
   (persisted, so it survives a refresh). */
function cooldownButton(btn, idleLabel) {
  const tick = () => {
    const remaining = Math.max(0, Math.round(((S.resendUntil||0) - Date.now()) / 1000));
    if (remaining > 0) {
      btn.textContent = `${t("resendIn")} ${remaining}${t("seconds")}`;
      btn.disabled = true;
      setTimeout(tick, 1000);
    } else {
      btn.textContent = idleLabel;
      btn.disabled = false;
    }
  };
  tick();
  return btn;
}

function lockoutBanner() {
  if (!S.lockedUntil) return null;
  if (new Date(S.lockedUntil).getTime() <= Date.now()) return null;
  return Banner("danger", t("auth.code_locked"));

/* ── helpers + actions ────────────────────────────────────────────────── */
function field(id, label, type, autocomplete, value) {
  const input = $("input",{class:"input ltr", attrs:{id, type, autocomplete: autocomplete || "off", "aria-label":label, value: value ?? null}});
  // password fields get a show/hide eye (a standard, expected control)
  if (type === "password") {
    const eye = $("button",{class:"field__eye", attrs:{type:"button", "aria-label":t("showPassword"), "aria-pressed":"false"},
      on:{click:()=>{
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        eye.setAttribute("aria-label", show ? t("hidePassword") : t("showPassword"));
        eye.setAttribute("aria-pressed", show ? "true" : "false");
        eye.replaceChildren(icon(show ? "eyeoff" : "eye"));
      }}}, icon("eye"));
    return $("div",{class:"field"},
      $("label",{attrs:{for:id}, text:label}),
      $("div",{class:"inputwrap"}, input, eye));
  }
  return $("div",{class:"field"},
    $("label",{attrs:{for:id}, text:label}),
    input);
}
const val = (id) => (document.getElementById(id)||{}).value || "";
const resetLockout = (e) => {
  const d = e.payload && e.payload.details;
  if (d && d.retryAfterMs) setResendUntil(d.retryAfterMs);
  if (d && d.lockedUntil) setLockedUntil(d.lockedUntil);
};
const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((s||"").trim());

async function identify() {
  const id = val("auth-identifier");
  if(!id){ S.authError=t("validation.email"); render(); return; }
  S.authBusy=true; S.authError=null; S.otpBypass=false; render();
  try {
    const res = await API.identify(id);
    S.authIdentifier = id;
    if (res.method === "password") { S.loginMethod="password"; S.authBusy=false; render(); return; }
    S.authEmail = id;
    S.loginMethod="otp";
    if (res.bypass) {
      // OTP bypass: no code step — sign straight in.
      S.otpBypass = true;
      S.authBusy = false;
      await signinVerifyCode();
      return;
    }
    setResendUntil(res.resendInMs || 60000);
    S.authBusy=false; render();
  } catch(e) { resetLockout(e); S.authError=errText(e.messageKey); S.authBusy=false; render(); }
}

async function staffLogin() {
  // read BEFORE render(): render() wipes and rebuilds the DOM, so reading the
  // field afterwards always yields "" (the live "Please check your entries" bug)
  const identifier = S.authIdentifier || val("auth-identifier");
  const password = val("auth-password");
  S.authBusy=true; S.authError=null; render();
  try {
    const res = await API.login(identifier, password);
    API.saveSession(res);
    enterApp(res.user);
  } catch(e) { S.authError = errText(e.messageKey); S.authBusy=false; render(); }
}

async function riderSendCode() {
  // fall back to S.authEmail so "Resend" works from the OTP step (no email field there)
  const email = (val("auth-email") || S.authEmail).trim().toLowerCase();
  if(!isEmail(email)){ S.authError=t("validation.email"); render(); return; }
  S.authBusy=true; S.authError=null; S.attemptsLeft=null; S.lockedUntil=null;
  setLockedUntil(null); render();
  try {
    const res = await API.requestOtp(email);
    S.authEmail=email; S.authBusy=false;
    if (res.bypass) {
      // OTP bypass: skip the code step, go straight to the name step.
      S.otpBypass = true;
      S.authStep = "name";
      render();
      return;
    }
    S.authStep="otp";
    setResendUntil(res.resendInMs || 60000);
    render();
  } catch(e) { resetLockout(e); S.authError=errText(e.messageKey); S.authBusy=false; render(); }
}

async function signupVerifyCode() {
  // undefined (not "") in bypass mode: JSON.stringify drops the key, so the
  // DTO's @IsOptional code passes — an empty string would fail the 6-digit
  // regex and return "Please check your entries".
  const code = S.otpBypass ? undefined : otpValue();
  if(!S.otpBypass && code.length !== 6){ S.authError=t("validation.code"); render(); return; }
  const name = val("auth-name") || undefined;   // read BEFORE render()
  const password = val("auth-password");        // read BEFORE render()
  if (password.length < 8) { S.authError = t("validation.password"); render(); return; }
  S.authBusy=true; S.authError=null; render();
  try {
    // one email = one account: a taken email (any role) is refused server-side
    const res = await API.signupVerify(S.authEmail, code, name, password);
    API.saveSession(res);
    if (S.signupRole==="driver") {
      try { await API.driverApply(); } catch { /* application state shows honestly in the app */ }
      toast(t("driverAppliedToast"));
    }
    enterApp(res.user);
  } catch(e) {
    resetLockout(e);
    const d = e.payload && e.payload.details;
    if (d && d.remainingAttempts != null) S.attemptsLeft = d.remainingAttempts;
    S.authError=errText(e.messageKey); S.authBusy=false; render();
  }
}

async function signinVerifyCode() {
  const code = S.otpBypass ? undefined : otpValue();
  if(!S.otpBypass && code.length !== 6){ S.authError=t("validation.code"); render(); return; }
  S.authBusy=true; S.authError=null; render();
  try {
    const res = await API.verifyOtp(S.authEmail, code);
    API.saveSession(res);
    enterApp(res.user);
  } catch(e) {
    resetLockout(e);
    const d = e.payload && e.payload.details;
    if (d && d.remainingAttempts != null) S.attemptsLeft = d.remainingAttempts;
    S.authError=errText(e.messageKey); S.authBusy=false; render();
  }
}

async function resetRequest() {
  const identifier = val("reset-identifier");   // read BEFORE render()
  S.authBusy=true; S.authError=null; render();
  try {
    await API.requestPasswordReset(identifier);
    S.forgot="code"; S.authBusy=false; render();
  } catch(e) { resetLockout(e); S.authError=errText(e.messageKey); S.authBusy=false; render(); }
}

async function resetConfirm() {
  const identifier = val("reset-identifier");   // read BEFORE render()
  const code = val("reset-code");
  const password = val("reset-password");
  S.authBusy=true; S.authError=null; render();
  try {
    await API.confirmPasswordReset(identifier, code, password);
    S.forgot="done"; S.authBusy=false; render();
  } catch(e) { resetLockout(e); S.authError=errText(e.messageKey); S.authBusy=false; render(); }
}

/* Search changed: filter the on-screen list in place — no full render(), so
   the input keeps its value and focus and the page never jumps. */
function riderSearchChanged(v){
  S.riderQuery = v;
  renderRiderRoutes(document.getElementById("rider-routes") || document.getElementById("rider-home-routes"));
}

async function loadRiderRoutesInto(el) {
  if (!el) return;
  try {
    // Build the Fuse index once; every keystroke only reads it.
    if (!S.riderIndex) {
      const routes = await API.publishedRoutes();
      S.riderRoutes = routes;
      S.riderIndex = buildRiderIndex(routes);
    }
    // Bookable journeys (all routes, one call) — nested under each route.
    if (!S.riderJourneys) {
      const today = new Date().toISOString().slice(0, 10);
      const week  = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
      const journeys = await API.upcomingJourneys(null, today, week).catch(()=>[]);
      const byRoute = {};
      (journeys || []).forEach((j)=>{ (byRoute[j.route_id] = byRoute[j.route_id] || []).push(j); });
      S.riderJourneys = byRoute;
    }
    renderRiderRoutes(el);
  } catch(e) { el.innerHTML=""; el.append(Banner("danger", errText(e.messageKey))); }
}

function renderRiderRoutes(el){
  if(!el) return;
  el.innerHTML="";
  const index = S.riderIndex || [];
  if(!index.length){ el.append(Empty("routes", t("nav.routes"), t("noRoutesPublished"))); return; }
  const ids = searchRoutes(S.riderQuery, index);
  if(!ids.length){ el.append(Empty("routes", t("searchRoute"), t("noSearchResults"))); return; }
  const byId = Object.fromEntries(index.map((e)=>[e.id, e]));
  ids.forEach((id)=>{ const entry = byId[id]; if(entry) el.append(routeResultCard(entry)); });
}

/* A route card with its bookable journeys nested under it (§ search surface:
   routes first, journeys inside). The card head goes to boarding; each
   departure chip is a fast path straight to review (first stop, best-first). */
function routeResultCard(entry){
  const { route, stops } = entry;
  const deps = (S.riderJourneys && S.riderJourneys[route.id]) || [];
  const card = $("div",{class:"routecard routecard--results"});
  card.append($("button",{class:"routecard__head", attrs:{type:"button"},
    on:{click:()=>{ S.chosenRoute = { route, stops }; S.chosenBoard = null; S.chosenDep = null; go("boarding"); }}},
    $("div",{class:"stack grow gap1"},
      $("div",{class:"routeline",text:route.name_en || route.name_ar || route.code}),
      $("div",{class:"t-cap",text:`${stops.length} ${t("stopsList")} · ${route.window_start}–${route.window_end}`})),
    $("div",{class:"stack",style:{alignItems:"flex-end"}},
      $("div",{class:"fare",text:money(route.fare_minor / 100)}),
      $("div",{class:"t-micro",text:t("fixedPrice")}))));

  // When the query matched a boarding stop, name it so the hit is visible.
  if(S.riderQuery){
    const q = normalizeText(S.riderQuery);
    const hit = stops.find((s)=> normalizeText((s.stop_name_en||"")+" "+(s.stop_name_ar||"")+" "+(s.stop_code||"")).includes(q));
    if(hit) card.append($("div",{class:"routecard__stop"},
      icon("stops"), $("span",{class:"t-cap",text:(hit.stop_name_en || hit.stop_name_ar || hit.stop_code)})));
  }

  const deprow = $("div",{class:"routecard__deps"});
  deprow.append($("span",{class:"t-micro",text:t("nextDepartures")}));
  if(!deps.length){
    deprow.append($("span",{class:"t-micro routecard__nodeps",text:t("noDeparturesShort")}));
  } else {
    deps.slice(0, 4).forEach((j)=>{
      deprow.append($("button",{class:"depchip ltr", attrs:{type:"button",
        "aria-label":t("pickDeparture")+" "+new Date(j.departs).toISOString().slice(11,16)},
        on:{click:()=>{
          S.chosenRoute = { route, stops };
          S.chosenBoard = stops[0] ? stops[0].stop_id : null;   // best-first: recommended stop
          S.chosenDep = j;
          go("review");
        }}},

async function loadDeparturesInto(el, routeId) {

  try {
    const journeys = await API.upcomingJourneys(routeId, today, week);
    if (!journeys.length) { el.append(Empty("clock", t("pickDeparture"), t("noDepartures"))); return; }
    journeys.forEach((j) => {
      const d = new Date(j.departs);
      const time = d.toISOString().slice(11, 16);
      const day = j.service_date === today ? t("today") : j.service_date;
      el.append(Row({
        icon: "bus",
        title: $("span",{class:"ltr",text:time}),
        sub: `${day} · ${j.seats_total} ${t("seats")}`,
        right: $("div",{class:"fare",text:money((S.chosenRoute.route.fare_minor || 0) / 100)}),
        bordered:true, chev:true,

/* Tab switch must be SEAMLESS (§15 GUI rules: no layout shift, no lost state).
   A full render() here rebuilds the .main scroller (snapping it to the top —
   the reported "page moves" bug), refetches /bookings/mine, and drops focus.
   So the tab click only syncs aria-pressed and re-renders the list from the
   cache; the list is fetched exactly once. */
function tripsSyncTabs(){
  const seg=document.getElementById("trips-seg");
  if(!seg) return;
  [["upcoming"],["past"]].forEach(([k],i)=>{
    const b=seg.children[i];
    if(b) b.setAttribute("aria-pressed", String(k===S.tripTab));
  });
}

function tripsRenderList(el){
  el = el || document.getElementById("rider-trips");
  if(!el) return;
  el.innerHTML="";
  const bookings=S.tripsCache || [];
  const upcoming=bookings.filter((b)=> b.status!=="COMPLETED" && b.status!=="CANCELLED" && b.status!=="NO_SHOW");
  const past=bookings.filter((b)=> !upcoming.includes(b));
  const shown=S.tripTab==="upcoming" ? upcoming : past;
  if(!shown.length){ el.append(Empty("trips", t("noTrips"), t("noTripsBody"))); return; }
  shown.forEach((b)=> el.append(Row({
    icon:"bus",
    title: b.route_name_en || b.route_name_ar || "—",
    sub: `${b.service_date} · ${b.departs_at} · ${b.seats} ${t("seats")} · ${b.code}`,
    right: $("div",{class:"stack",style:{alignItems:"flex-end"}},
      $("div",{class:"fare",text:money(b.fare_minor / 100)}),
      (S.tripTab==="upcoming")
        ? Btn({label:t("cancelBooking"), kind:"ghost", on:()=>cancelRiderBooking(b.id)})
        : Chip({label:b.status, kind:b.status==="CANCELLED" ? "danger" : "ok"})),
    bordered:true })));
}

async function loadRiderTripsInto(el) {

async function cancelRiderBooking(id) {

}

/* Email verification — real API flow: add email → code → verified. Shared by
   rider and driver profiles. Honest states, no fake success. */
function emailSection() {
  const u = S.user || {};
  const card = Card("card--tight", $("div",{class:"t-micro",text:t("verifyEmailTitle")}));
  if (u.email && u.emailVerified) {
    card.append(Row({ icon:"check", title:$("span",{class:"ltr",text:u.email}),
      right:Chip({label:t("emailVerified"), kind:"ok"}), bordered:true }));
  } else {
    if (!u.email) {
      card.append(
        $("div",{class:"field"},
          $("label",{attrs:{for:"em-addr"}, text:t("emailLabel")}),
          $("input",{class:"input ltr", attrs:{id:"em-addr", type:"email", "aria-label":t("emailLabel")}})),
        Btn({label:t("sendVerify"), block:true, on:()=>emailSend()}));
    } else {
      card.append(Row({ icon:"mail", title:$("span",{class:"ltr",text:u.email}),
        right:Chip({label:t("emailNotVerified"), kind:"warn"}), bordered:true }));
      card.append(
        $("div",{class:"field"},
          $("label",{attrs:{for:"em-code"}, text:t("codeLabel")}),
          $("input",{class:"input ltr", attrs:{id:"em-code", type:"text", "aria-label":t("codeLabel")}})),
        $("div",{class:"row gap2"},
          Btn({label:t("verifyEmailAction"), block:true, on:()=>emailVerify()}),
          Btn({label:t("emailResend"), kind:"ghost", on:()=>emailSend()})));
    }
  }
  if (S.emailToast) card.append(Banner(S.emailToastKind || "info", S.emailToast));
  return card;
}

async function emailSend() {
  const email = val("em-addr") || (S.user && S.user.email);
  if (!email) { S.emailToast = "validation.email"; S.emailToastKind = "danger"; render(); return; }
  try {
    await API.requestEmailVerification(email);
    S.emailToast = t("emailSaved"); S.emailToastKind = "ok";
    // refresh the session user so the email shows immediately
    const me = await API.me();
    if (me && me.actor && API.user()) {
      API.saveSession({ ...API.user(), email, emailVerified:false });
      S.user = API.user();
    }
    render();
  } catch(e) { S.emailToast = e.messageKey || "error.internal"; S.emailToastKind = "danger"; render(); }
}

async function emailVerify() {
  try {
    await API.verifyEmail(val("em-code"));
    S.emailToast = t("emailDone"); S.emailToastKind = "ok";
    API.saveSession({ ...API.user(), emailVerified:true });
    S.user = API.user();
    render();
  } catch(e) { S.emailToast = e.messageKey || "error.internal"; S.emailToastKind = "danger"; render(); }
}

/* ══════════════════════════════════════════════════════════════════════
   WALLET & PAYMENTS screens (Path A — money). Owned exclusively by the
   money path (docs/planning/PATH_A_MONEY.md). Everything renders from the
   REAL API: the balance is DERIVED by the backend from the ledger (never
   invented client-side), and every state is honest — loading, empty, error,
   and Paymob-off (§8.1: hidden option + one plain sentence, no dead
   buttons). paymentChoice() is the embeddable payment-method component
   Path B drops into the booking review screen.                     */
function riderWallet(){                                       // R-40
  const w=$("div",{class:"main"});
  const cfg = S.payConfig;

  // fetch the session-scoped config + wallet on first paint. The loaders set
  // their flags SYNCHRONOUSLY (so this paint already shows the honest loading
  // state) but never render() until after their await — a render inside the
  // running render duplicates the shell (the exact bug the trips loader
  // documents; caught by the CI layout suite as a half-width bar).
  if(S.payConfig===undefined && !S.payConfigError && !S.payConfigLoading){ payConfigLoad(); }
  if(S.walletLoading === undefined && !S.walletError){ walletLoad(); }

  if(S.walletError){
    w.append(Banner("danger", S.walletError));
  }
  if(S.walletLoading && !S.wallet){
    w.append(Banner("info", t("loading")));
  }

  if(S.wallet){
    w.append(Card("",
      $("div",{class:"t-micro",text:t("w_balance")}),
      $("div",{class:"pricetag ltr",text:money(S.wallet.balanceMinor/100)}),
      Divider()
    ));
    // Top-up: only when the backend says Paymob is live (§8.1 hide, don't
    // disable). When off, one honest sentence explains the state.
    if(cfg && cfg.paymobEnabled){
      w.append($("div",{class:"pad"},
        Btn({label:t("w_topup"), block:true, icon:"card", on:()=>openSheet("topup")})));
    } else {
      w.append($("div",{class:"pad"},
        Banner("info", t("w_paymobOff")),
        $("div",{class:"t-cap",text:t("w_payCash")})));
    }
    w.append($("div",{class:"t-cap",text:t("w_history")}));
    const entries = S.wallet.entries || [];
    if(entries.length === 0){
      w.append(Empty("card", t("w_entriesEmpty"), ""));
    } else {
      const list=Card("");
      entries.forEach((e)=>{
        const inbound = e.side === "credit";
        list.append(Row({
          icon: inbound ? "card" : "trips",
          title: t("w_reason_"+e.reason) !== ("w_reason_"+e.reason) ? t("w_reason_"+e.reason) : e.reason,
          sub: new Date(e.createdAt).toLocaleString(S.lang === "ar" ? "ar-EG" : "en-EG"),
          right: $("div",{class:"fare ltr",text:(inbound?"+ ":"− ")+money(e.amountMinor/100)}),
        }));
      });
      w.append(list);
    }
  } else if(!S.walletError && !S.walletLoading){
    w.append(Banner("info", t("loading")));
  }
  return w;
}

/* Loads the payment config once per session (drives ALL paymob visibility).

/* ── Top-up sheet ───────────────────────────────────────────────────────
   Presets + custom amount in whole EGP; bounds come from the SERVER config
   (never a second copy §0.3). Paymob first (DEC-204). On success the
   provider's secure iframe opens in a new tab.                             */
const W_TOPUP_PRESETS = [50, 100, 200, 500];   // display EGP; suggestion only

function topupSheet(){
  const cfg = S.payConfig || {};
  const min = Math.ceil((cfg.topupMinMinor || 500)/100);
  const max = Math.floor((cfg.topupMaxMinor || 1000000)/100);
  const body=$("div",{class:"col gap3"});

  if(!cfg.paymobEnabled){
    // Sheet opened with Paymob off (config refreshed meanwhile) — honest close.
    return Sheet(t("w_topup"),
      Banner("info", t("w_paymobOff")),
      $("div",{class:"t-cap",text:t("w_payCash")}),
      Btn({label:t("close"), block:true, on:closeSheet}));
  }

  const chips=$("div",{class:"row gap3 wrap"});
  W_TOPUP_PRESETS.forEach((v)=>{
    chips.append(Chip({label:String(v), pressed:S.topupAmount===v,
      on:()=>{ S.topupAmount=v; S.topupCustom=""; openSheet("topup"); }}));
  });
  const custom=$("input",{id:"topup-custom", attrs:{type:"number", inputmode:"numeric",
    min:String(min), max:String(max), "aria-label":t("w_custom"), placeholder:t("w_custom")},
    on:{input:(e)=>{ S.topupCustom=e.target.value; S.topupAmount=null; }}});
  if(S.topupCustom) custom.value = S.topupCustom;

  body.append(
    $("div",{class:"t-cap",text:t("w_topupBody")}),
    chips,
    $("label",{class:"t-micro",attrs:{for:"topup-custom"},text:t("w_custom")}),
    custom,
    $("div",{class:"t-micro",text:`${min} – ${max} EGP · `+t("w_amount")})
  );
  if(S.topupError) body.append(Banner("danger", S.topupError));

  const amountEgp = S.topupCustom ? Number(S.topupCustom) : S.topupAmount;
  const valid = Number.isInteger(amountEgp) && amountEgp>=min && amountEgp<=max;
  body.append(Btn({label:t("w_openPay"), block:true, dis:S.topupBusy||!valid,
    on:()=>topupSubmit(amountEgp)}));
  return Sheet(t("w_topup"), body);
}

async function topupSubmit(amountEgp){
  S.topupBusy=true; S.topupError=null; S.topupOk=false; render();
  try{
    const res = await API.topup(Math.round(amountEgp*100));
    S.topupOk=true; closeSheet();
    if(typeof window!=="undefined" && res && res.iframeUrl){
      window.open(res.iframeUrl, "_blank", "noopener");
    }
    toast(t("w_topupOk"));
    walletLoad();                      // order is pending; balance updates on webhook
  }catch(e){
    S.topupError = errText(e.messageKey);
  }
  S.topupBusy=false; render();
}

/* ── Payment-choice component (embedded by Path B's review screen) ────────
   Renders the DEC-204 order: Wallet (when it can cover the fare) → card
   (Paymob, when enabled) → Cash. Selection is S.payMethod; nothing dead is
   shown — methods that cannot be used are absent, not disabled.          */
function paymentChoice(fareMinor){
  const cfg = S.payConfig || {};
  const bal = S.wallet ? S.wallet.balanceMinor : 0;
  const sufficient = bal >= fareMinor;
  const methods=[];
  if(sufficient){
    methods.push({k:"wallet", icon:"card", title:t("w_useWallet"),
      sub:`${t("w_walletHas")}: ${money(bal/100)}`});
  }
  if(cfg.paymobEnabled){
    methods.push({k:"card", icon:"card", title:t("w_topupShort"),
      sub:cfg.topupMinMinor?`${Math.ceil(cfg.topupMinMinor/100)}+ EGP`:""});
  }
  methods.push({k:"cash", icon:"trips", title:t("w_payCash")});
  if(!S.payMethod || !methods.some(m=>m.k===S.payMethod)) S.payMethod = methods[0].k;

  const el=$("div",{class:"col gap3"});
  el.append($("div",{class:"t-cap",text:t("w_choice")}));
  const list=Card("");
  methods.forEach((m)=>{
    list.append(Row({icon:m.icon, title:m.title, sub:m.sub,
      selected:S.payMethod===m.k, chev:false,
      on:()=>{ S.payMethod=m.k; render(); }}));
  });
  el.append(list);
  if(!sufficient && cfg.paymobEnabled){
    el.append($("button",{class:"link", attrs:{type:"button"}, text:t("w_topupShort")+" →",
      on:()=>openSheet("topup")}));
  }
  return el;
}


/* ══════════════════════════════════════════════════════════════════════
   8. DRIVER SCREENS — bigger targets, glanceable

function driverDuty(){                                        // D-10

function useMyLocation() {
  if (!navigator.geolocation) { toast(t("locationDenied")); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const la = document.getElementById("field-lat"), lo = document.getElementById("field-lng"), acc = document.getElementById("field-acc");
      if (la) la.value = pos.coords.latitude.toFixed(6);
      if (lo) lo.value = pos.coords.longitude.toFixed(6);
      if (acc) acc.textContent = `${t("accuracyLabel")}: ${Math.round(pos.coords.accuracy)} m`;
    },
    () => toast(t("locationDenied")),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function readPhotoFile(inputId, cb) {
  const input = document.getElementById(inputId);
  const file = input && input.files && input.files[0];
  if (!file) { cb(null); return; }
  const r = new FileReader();
  r.onload = () => cb(String(r.result));
  r.onerror = () => cb(null);
  r.readAsDataURL(file);
}

async function captureStopAction() {
  const lat = Number(val("field-lat")), lng = Number(val("field-lng"));
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) { toast(t("validation.failed")); return; }
  readPhotoFile("field-photo", async (photoDataUrl) => {
    const accEl = document.getElementById("field-acc");
    const accText = (accEl && accEl.textContent) || "";
    const accMatch = /(\d+(?:\.\d+)?)/.exec(accText);
    if (!accMatch) { S.stopBusy = false; toast(t("locationDenied")); render(); return; } // a field capture needs a real fix
    const payload = {
      captureId: "cap-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10),
      lat, lng,
      gpsAccuracyM: accMatch ? Number(accMatch[1]) : 0,
      checklist: {
        stand: document.getElementById("field-stand").checked,
        lit: document.getElementById("field-lit").checked,
        legal: document.getElementById("field-legal").checked,
        reachable: document.getElementById("field-reachable").checked,
      },
      photoDataUrl: photoDataUrl || undefined,
    };
    S.stopBusy = true; render();
    try {
      await API.captureStop(payload);
      S.stopBusy = false; closeSheet();
      toast(t("captureSaved"));
      render();
      loadPendingInto(document.getElementById("pending-list"));
    } catch(e) {
      S.stopBusy = false;
      if (e.code === "NETWORK") {
        // offline: queue locally, upload on reconnect (idempotent by captureId)
        queueFieldCapture(payload);
        closeSheet(); toast(t("queuedOffline")); render();
      } else {
        toast(errText(e.messageKey)); render();
      }
    }
  });
}

function queueFieldCapture(payload) {
  let q = [];
  try { q = JSON.parse(localStorage.getItem("rs.fieldQueue") || "[]"); } catch {}
  q.push(payload);
  try { localStorage.setItem("rs.fieldQueue", JSON.stringify(q)); } catch {}
}

async function flushFieldQueue() {
  if (typeof fetch !== "function" || !navigator.onLine) return;
  let q = [];
  try { q = JSON.parse(localStorage.getItem("rs.fieldQueue") || "[]"); } catch {}
  if (!q.length) return;
  for (const payload of q) {
    try { await API.captureStop(payload); } catch { /* stay queued */ continue; }
  }
  try { localStorage.removeItem("rs.fieldQueue"); } catch {}
}

async function createStopAction() {
  const lat = Number(val("stop-lat")), lng = Number(val("stop-lng"));
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) { toast(t("validation.failed")); return; }
  const payload = {
    lat, lng, source: "desk",
    nameEn: val("stop-name-en") || undefined,
    nameAr: val("stop-name-ar") || undefined,
  };
  if (S.stopTooClose) payload.overrideReason = val("stop-override") || undefined;
  S.stopBusy = true; render();
  try {
    await API.createStop(payload);
    S.stopTooClose = null; S.stopBusy = false;
    toast(t("placedStop"));
    render();
    loadStopsInto(document.getElementById("stops-list"));
  } catch(e) {
    S.stopBusy = false;
    if (e.messageKey === "geo.stop_too_close") {

async function loadRouteSlotsInto(el, routeId) {
  if (!el) return;
  el.innerHTML = "";
  const today = new Date().toISOString().slice(0, 10);
  const week = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  try {
    const slots = await API.listRouteSlots(routeId, today, week);
    if (!slots.length) { el.append(Empty("clock", t("generateSlots"), t("noSlotsPublished"))); return; }
    el.append($("h2",{class:"t-head",text:t("nav.work")}));
    const days = {};
    slots.forEach((s) => { (days[s.service_date] ||= []).push(s.departs_at); });
    Object.entries(days).forEach(([date, times]) => el.append(
      $("div",{class:"row wrap gap2"}, $("span",{class:"t-cap ltr",text:date}),
        ...times.map((tm) => Chip({label:String(tm), kind:"info"})))));
  } catch(e) { el.append(Banner("danger", errText(e.messageKey))); }
}

function topbar({title, back:onBack, right, plain}){

/* Search band — the first element of the page, inside the scroller, so it
   scrolls with the content. Present on the screens where finding a route or a
   record is the primary job. */
const SEARCHABLE = {
  rider:  {home:"searchHint", routes:"searchRoute"},
  ops:    {stops:"searchRoute"},
};
function searchBand(){
  const key = (SEARCHABLE[S.role]||{})[S.page];
  if(!key) return null;
  const label = t(key)===key ? key : t(key);
  // Every band is a REAL control (§8.1 — never a dead input). The rider home
  // band navigates to the results screen; the others are live fields wired to
  // their screen's filter. A screen with no wired filter gets NO band.
  let bar=null;
  if(S.role==="rider" && S.page==="home")
    bar=SearchBar({placeholder:label, on:()=>{ S.riderQuery=""; go("routes"); }});
  else if(S.role==="rider" && S.page==="routes")
    bar=SearchBar({placeholder:label, live:true, value:S.riderQuery, onInput:riderSearchChanged});
  else if(S.role==="ops" && S.page==="stops")
    bar=SearchBar({placeholder:label, live:true, value:S.stopsQuery, onInput:stopsSearchChanged});
  if(!bar) return null;
  const def=pageDef();
  const band=$("div",{class:"searchband"+(def.wide?" searchband--wide":"")});
  band.append($("div",{class:"searchband__inner"}, bar));
  return band;
}

/* Navigation. One definition, four presentations — the CSS decides which,
   so there is no JS branch per screen size and no resize listener. */
function nav(){
  const el=$("nav",{class:"nav",attrs:{"aria-label":"Primary"}});
  el.append($("div",{class:"nav__brand"}, logoSVG(), $("span",{text:t("brand")})));

  const items=$("div",{class:"nav__items"});
  PAGES[S.role].filter(p=>p.dock && !p.foot).forEach(p=> items.append(navItem(p)));
  el.append(items);

  // Rail footer: profile pinned to the bottom on medium and up. On compact
  // the same item sits inline in the bottom bar — one component either way.
  // The collapse control sits above the footer so the footer stays last.
  el.append(railToggle());
  const foot=PAGES[S.role].filter(p=>p.foot);
  if(foot.length){
    const f=$("div",{class:"nav__foot"});
    foot.forEach(p=> f.append(navItem(p)));
    el.append(f);
    // compact: the footer is hidden by CSS, so the item must also be in the bar
    foot.forEach(p=> items.append(navItem(p, "compact-only")));
  }
  return el;
}
function railToggle(){
  const collapsed = S.rail==="collapsed";
  return $("button",{class:"rail-toggle",
    attrs:{type:"button", "aria-pressed":String(collapsed),
      "aria-label": collapsed ? t("expandMenu") : t("collapseMenu")},
    on:{click:()=>{ S.rail = collapsed ? "open" : "collapsed";
                    storeSet("rs.rail", S.rail); render(); }}},
    icon(collapsed ? "fwd" : "back"));
}
function navItem(p, extra){
  const label=t("nav."+p.k);
  return $("button",{class:"navitem"+(extra?" "+extra:""),
    attrs:{type:"button","aria-label":label,
      "aria-current":S.page===p.k?"page":null,
      title: S.rail==="collapsed" && extra!=="compact-only" ? label : null},
    on:{click:()=>{ S.stack=[]; S.page=p.k; S.sheet=null; S.opsView=null; render(); }}},
    $("span",{class:"navitem__ico"}, icon(p.ic)),
    $("span",{class:"navitem__label",text:label}));
}

/* ══════════════════════════════════════════════════════════════════════
   15. RENDER
   ══════════════════════════════════════════════════════════════════════ */
function render(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir  = S.lang==="ar" ? "rtl" : "ltr";
  // One source of truth: the pre-paint script sets <html data-theme>, so
  // render() must update <html> too — if only <body> is set, the stale <html>
  // attribute wins and the theme toggle "does nothing" (reported bug).
  const theme = resolvedTheme();
  document.documentElement.dataset.theme = theme;
  document.body.dataset.theme = theme;

  const root=document.getElementById("root");
  root.innerHTML="";

  /* view machine: boot splash → landing → auth → the signed-in app */
  if(S.view==="boot"){ root.append(bootSplash()); return; }
  if(S.view==="landing"){ root.append(landing()); return; }
  if(S.view==="auth"){ root.append(auth()); return; }
  if(!S.authed){ S.view="landing"; root.append(landing()); return; }

  const app=$("div",{class:"app"+(S.rail==="collapsed" ? " rail-collapsed" : "")});

  const def=pageDef();
  const col=$("div",{class:"appcol"});
  const isRoot = def.dock === true;

  col.append(topbar({
    title: def.title ? t(def.title) : t("nav."+def.k),
    back: isRoot ? null : back,
    right: isRoot ? headerActions() : null
  }));
  /* Every screen returns a .main. The reading-width wrapper is applied here,
     once, rather than in each of the thirty screen functions. Staff tables
     opt out of the cap because wide data needs the room. The search band is
     the first element inside the scroller, so it scrolls with the page. */
  const body=def.fn();
  if(body.classList.contains("main")){
    const inner=$("div",{class:"main__inner"});
    while(body.firstChild) inner.append(body.firstChild);
    body.append(inner);
    if(def.wide) body.classList.add("main--wide");
    const band=searchBand();
    if(band) body.prepend(band);
  }
  col.append(body);

  app.append(nav());
  app.append(col);

  if(S.sheet && SHEETS[S.sheet]){
    app.append($("div",{class:"scrim",on:{click:closeSheet}}));
    app.append(SHEETS[S.sheet]());
  }
  if(S.toast) app.append($("div",{class:"toast",attrs:{role:"status"}},
    icon("check"), $("span",{text:S.toast})));

  root.append(app);
}

/* Boot splash — the bouncy logo shown while the session resolves. The bounce
   is decorative and collapses under prefers-reduced-motion. */

/* Boot: show the splash, resolve any stored session, then land. The minimum
   splash time is long enough to feel intentional, not long enough to fake. */
function boot(){
  S.view="boot"; render();
  loadMapsConfig();                             // fire-and-forget, never blocks boot
  flushFieldQueue();                            // field captures saved offline upload now
  const minDelay = new Promise(r=>setTimeout(r, 1500));
