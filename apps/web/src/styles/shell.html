<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="__BRAND_THEME_COLOR__">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="__BRAND_THEME_DARK__">
<meta name="description" content="__BRAND_DESCRIPTION__">
<title>__BRAND_TITLE__</title>
<link rel="icon" type="image/svg+xml" href="__BRAND_FAVICON__">
<style>
/* The self-hosted Arabic faces, inlined by build.js from assets/fonts/ (a single
   file cannot fetch a font). Every one of them is restricted to Arabic ranges, so
   the Latin chain below is untouched — that is what lets the whole GUI be re-typed
   for one script without a component knowing. */
__FONT_FACES__
/* ══════════════════════════════════════════════════════════════════════════
   RIDE SHARE — DESIGN SYSTEM
   Every visual decision is defined exactly once, here. To change a value
   everywhere in the product, edit one line in this block. (GUI rules §3)

   BREAKPOINTS — Material 3 window size classes (m3.material.io/foundations/
   layout/breakpoints). Chosen because they are the researched industry
   standard, not invented for this project:
     compact    <  600px   phone portrait          nav = bottom bar
     medium     >= 600px   phone landscape/tablet  nav = collapsed rail
     expanded   >= 840px   tablet landscape        nav = expanded rail
     large      >= 1200px  desktop                 nav = expanded rail + panes
     x-large    >= 1600px  ultrawide               content capped, centred
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* How far the fixed bar reaches into the page. One number, asked by the masthead's
     top padding and by the sticky contents rail of a document, so the two can never
     disagree about where the page begins under the glass. */
  --bar-clearance:clamp(4.5rem,9vh,7.5rem);
  /* ── PRIMITIVES ─────────────────────────────────────────────────────────
     Raw values. Never referenced by a component; only by semantic tokens.
     Two-layer model per WCAG 2.2 palette guidance, and deliberately narrow:
     the product prints in INK on PAPER, so the palette is one neutral ramp plus
     the four hues that CARRY MEANING (ok / warn / danger / info). Decorative
     colour is gone by decision — where a chip once shouted in coral it now
     differs by ink weight and hairline, so colour is never the only channel
     (§10.4) and every screenshot survives being printed in black and white.
     The ramp is chosen by measurement, not by eye: ink-900 on paper is 19.8:1,
     ink-600 (secondary text) 6.69:1, ink-500 (muted text) 4.54:1 — the AA floor
     for body copy — and the pairs are re-measured in tests/unit.test.js, so the
     day someone edits a step and breaks one, the build says which pair.      */
  --ink-0:#FFFFFF;   --ink-25:#FAFAFA;  --ink-50:#F5F5F5;  --ink-100:#EFEFEF;
  --ink-150:#E6E6E6; --ink-200:#DEDEDE; --ink-300:#CFCFCF; --ink-400:#A8A8A8;
  --ink-500:#767676; --ink-600:#5C5C5C; --ink-700:#454545; --ink-800:#2E2E2E;
  --ink-850:#1F1F1F; --ink-900:#0A0A0A; --ink-950:#050505; --ink-1000:#000000;
  --green-500:#1E8E3E; --green-400:#3ECF6B; --green-50:#E8F5EC; --green-950:#12291B;
  --amber-500:#B26A00; --amber-400:#FFB020; --amber-50:#FDF3E2; --amber-950:#2E2410;
  --red-500:#C62828;   --red-400:#FF6B6B;   --red-50:#FCEBEA;   --red-950:#2E1717;
  --blue-500:#1B62D6;  --blue-400:#5D95F5;  --blue-50:#E9F0FC;  --blue-950:#141F33;

  /* ── SEMANTIC: SURFACES ─────────────────────────────────────────────── */
  --bg-base:var(--ink-0); --bg-raised:var(--ink-50); --bg-sunken:var(--ink-100);
  --bg-inset:var(--ink-150); --bg-page:var(--ink-100);

  /* ── SEMANTIC: TEXT ─────────────────────────────────────────────────── */
  --text-primary:var(--ink-900); --text-secondary:var(--ink-600);
  --text-muted:var(--ink-500); --text-inverse:var(--ink-0);

  /* ── SEMANTIC: BRAND + ACCENT ───────────────────────────────────────────
     PRIMARY  the ink the product prints with — the act of travelling: book,
              claim, confirm, go.
     ACCENT   the same ink one step lighter. The two roles still exist and
              still never interchange (an accent button never means "go"), but
              in a monochrome system the difference is weight and edge, not hue.
     No gradient, no second stop: one flat fill everywhere means a button is
     one declaration and it prints identically on paper.                     */
  --brand:var(--ink-900); --brand-hover:var(--ink-800);
  --brand-soft:var(--ink-50); --brand-border:var(--ink-200);
  --on-brand:var(--ink-0);
  --accent:var(--ink-700); --accent-hover:var(--ink-600);
  --accent-soft:var(--ink-100); --accent-border:var(--ink-300);
  --on-accent:var(--ink-0); --accent-text:var(--ink-900);

  /* Route and walking legs of a journey: a map convention, not brand
     expression. They stay distinguishable without colour because the walk leg
     is dashed (see RouteMap) — colour would have been the second channel. */
  --route:var(--ink-900); --walk:var(--ink-400);
  --accent-route:var(--route); --accent-walk:var(--walk);

  /* ── SEMANTIC: STATUS ───────────────────────────────────────────────── */
  --ok:var(--green-500); --ok-bg:var(--green-50);
  --warn:var(--amber-500); --warn-bg:var(--amber-50);
  --danger:var(--red-500); --danger-bg:var(--red-50);
  --info:var(--blue-500); --info-bg:var(--blue-50);
  --offline:var(--ink-600);

  /* ── SEMANTIC: LINES + FOCUS ────────────────────────────────────────── */
  --line:var(--ink-200); --line-strong:var(--ink-400);
  --focus:var(--brand); --focus-width:2px; --focus-offset:2px;
  --scrim:rgba(10,10,10,.55);

  /* ── MAP ────────────────────────────────────────────────────────────── */
  --map-land:var(--ink-100); --map-water:var(--ink-200); --map-park:var(--ink-50);
  --map-road:var(--ink-0); --map-road-minor:var(--ink-50); --map-building:var(--ink-150);
  /* Real tiles are not ours to repaint, so they are pulled into the same
     monochrome register here — one token, both map engines, and the vector
     overlay above (route, stops, vehicle) keeps full contrast on top of it. */
  --map-tile-filter:grayscale(1) contrast(1.02) brightness(1.02);

  /* ── FIXED (never themed — reason recorded) ─────────────────────────────
     A boarding code must scan in dark mode; a knob needs contrast on both
     track colours; white on a saturated fill is white in both themes.    */
  --qr-paper:#FFFFFF; --qr-ink:#0A0A0A; --knob:#FFFFFF; --on-solid:#FFFFFF;

  /* ── RADII ──────────────────────────────────────────────────────────── */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* ── SPACING (4px base) ─────────────────────────────────────────────── */
  /* the wordmark font comes from the single brand source (packages/brand) */
  --brand-font:__BRAND_FONT__; --brand-font-weight:__BRAND_FONT_WEIGHT__;
  /* The poster's display roles in Arabic; the stack is composed by build.js from
     the faces fonts.json marks `display`, so adding a masthead is a manifest edit. */
  --brand-font-display:__FONT_DISPLAY_STACK__;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px; --s9:48px; --s10:64px;

  /* ── TYPE SCALE ─────────────────────────────────────────────────────────
     --f-input is 16px and must never go below it: iOS Safari force-zooms
     the viewport on focus of any field under 16px. That zoom cannot be
     undone by the user and breaks the layout.                            */
  --f-display:32px; --f-title:22px; --f-head:18px; --f-lg:16px;
  --f-body:15px; --f-cap:13px; --f-micro:11px; --f-input:16px;
  --lh-tight:1.2; --lh-snug:1.35; --lh-body:1.5;
  --fw-normal:400; --fw-med:550; --fw-semi:650; --fw-bold:750;
  /* The poster prints heavier than the app's boldest step. The brand face is a
     variable font, so 850/900 are real instances of it — nothing here invites a
     synthetic bold. --fw-black is the masthead's weight; --fw-heavy is for a
     large run of copy that must still read as ink at size. */
  --fw-heavy:850; --fw-black:900;

  /* ── CONTROL SIZES ──────────────────────────────────────────────────────
     44px is the WCAG 2.2 / platform minimum touch target.
     56px is the driver minimum: gloved hands, moving vehicle, sunlight.   */
  --tap:44px; --tap-sm:36px; --tap-driver:56px;
  --icon-sm:16px; --icon-md:20px; --icon-lg:24px;

  /* ── LAYOUT ─────────────────────────────────────────────────────────── */
  --rail-collapsed:80px; --rail-expanded:248px;
  --content-max:840px;      /* reading measure for single-pane content */
  --landing-max:1360px;     /* marketing column — the demo's measure (1440) less its
                             inner padding, so the poster fills the page and still breathes */
  --shell-max:1600px;       /* beyond x-large the shell stops growing  */
  --topbar-h:60px; --dock-h:64px;
  --density:comfortable;    /* DEC-200: compact on desktop, see ≥840px */
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* ── ELEVATION ──────────────────────────────────────────────────────── */
  --sh-1:0 1px 2px rgba(10,10,10,.05);
  --sh-2:0 2px 4px rgba(10,10,10,.04),0 10px 20px -6px rgba(10,10,10,.09);
  --sh-3:0 4px 10px rgba(10,10,10,.06),0 24px 44px -14px rgba(10,10,10,.18);

  /* ── LAYERS (named, so no arbitrary z-index appears in a component) ─── */
  --z-base:0; --z-sticky:10; --z-nav:30; --z-scrim:55; --z-sheet:60; --z-toast:80;

  /* ── MOTION ─────────────────────────────────────────────────────────── */
  --ease:cubic-bezier(.2,.7,.3,1); --fast:140ms; --med:240ms;
  --slow:420ms; --bounce:cubic-bezier(.34,1.56,.64,1);
  /* The marketing surface needs longer, softer curves than an app control: a
     poster reveals, it does not snap. Durations live here for the same reason
     as everything else — the landing must not carry a literal. */
  --ease-glide:cubic-bezier(.16,1,.3,1);
  --ease-swing:cubic-bezier(.76,0,.24,1);
  --rev:640ms; --marquee:42s; --pulse:1.5s;
  /* Panel entrances are one motion, not one per panel: how long, and which
     curve. The reduced-motion gate at the top of this file already shortens
     every animation, so an entrance written with these tokens needs no gate. */
  --panel-in-dur:280ms; --panel-in-ease:cubic-bezier(.2,.8,.2,1);
  --panel-in-step:28ms;     /* how far behind the previous row the next one arrives */
}

/* ══════════════════════════════════════════════════════════════════════════
   MONOCHROME MARKETING LAYER — the printed-poster vocabulary.
   These exist because the marketing surface speaks words the app does not: a
   sheet of paper, a stage, a hairline grid, a frosted panel, a road map drawn
   in grey. Each one is an ALIAS of an app token where an app token already
   means the same thing (ink, paper, lines) so a theme change moves the app and
   the landing together, and a genuine new value where nothing did (grid line,
   glass, the map's sea/coast/road greys). The type steps below the app's scale
   are the poster's sizes: `--f-hero` is measured against BOTH viewport axes so
   three lines always fit exactly one screen and never crop.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:var(--text-primary); --paper:var(--bg-base);
  --ink-soft:var(--text-secondary); --ink-mute:var(--text-muted);
  --line-hair:var(--ink-200);
  --glass:rgba(255,255,255,.62); --glass-solid:rgba(255,255,255,.96);
  /* The frosted recipe, once: the bar and the menu that drops from it are the same
     material, so they share the token instead of restating a number. */
  --glass-blur:blur(20px) saturate(180%);
  --glass-line:rgba(10,10,10,.08);
  --stage:var(--ink-900); --stage-line:rgba(255,255,255,.16);
  --grid-line:rgba(10,10,10,.05);
  --sea:#e9eef3; --coast:#c2ced7; --canal:#d5e0e8;
  --rd-0:#262626; --rd-1:#4a4a4a; --rd-2:#929292; --rd-3:#c6c6c6;
  --f-hero:clamp(2.4rem,min(17vw,15.5vh),13rem);
  /* The intro promises exactly one screen, so its type is measured against both axes
     like the masthead's: a phone on its side gets a smaller poster, not a scroll. */
  --f-intro:clamp(1.45rem,min(7vw,6.2vh),2.6rem); --f-introgap:clamp(.75rem,2.2vh,1.75rem);
  --f-word:clamp(1.8rem,6.5vw,5rem);
  --f-poster:clamp(1.8rem,5.6vw,4.75rem);
  --f-end:clamp(1.6rem,4.6vw,4rem);
  --f-panel:clamp(1.2rem,2.3vw,1.75rem);
  --f-lede:clamp(1.05rem,2.1vw,1.5rem);
  --flow:var(--s6);           /* the space between two blocks of a section — one value, every section */
  --gutter:clamp(1.25rem,4vw,3.5rem);
  /* Above the sticky content of the page, below the app's own chrome, so a
     toast or a sheet is never trapped under the marketing header. */
  --z-landing-nav:20;
  --z-pagefx:95;                  /* the curtain covers the surface, then is gone */
  /* The page transition, in four beats: rise, fill, release, fall. The path itself is
     drawn by lib/pagefx.js from these numbers, so the sheet owns the pacing. */
  --fx-rise:220ms; --fx-fill:90ms; --fx-release:110ms; --fx-fall:520ms;
  --fx-ink:var(--ink-900);           /* the curtain must read against the sheet it covers,
                                       which in the dark theme means the other end of the ramp */
}
[data-theme="dark"]{
  --fx-ink:var(--ink-50);
  --glass:rgba(10,10,10,.62); --glass-solid:rgba(10,10,10,.96);
  --glass-line:rgba(242,242,242,.1);
  --stage:var(--ink-0); --stage-line:rgba(10,10,10,.16);
  --grid-line:rgba(242,242,242,.05);
  --sea:#16202a; --coast:#24323f; --canal:#1d2b36;
  --rd-0:#cfcfcf; --rd-1:#b0b0b0; --rd-2:#6a6a6a; --rd-3:#3a3a3a;
}

[data-theme="dark"]{
  --bg-base:var(--ink-900); --bg-raised:#141414; --bg-sunken:var(--ink-1000);
  --bg-inset:#1F1F1F; --bg-page:var(--ink-950);
  /* Dark is the same poster printed the other way round: paper becomes the
     deepest ink step, and the ink becomes near-white paper (17.7:1 on it;
     secondary 10.0:1, muted 6.1:1 — measured, see the primitives comment). */
  --text-primary:#F2F2F2; --text-secondary:#B8B8B8; --text-muted:#8F8F8F;
  --text-inverse:var(--ink-950);
  --brand:var(--ink-0); --brand-hover:#E6E6E6;
  --brand-soft:var(--ink-850); --brand-border:var(--ink-700); --on-brand:var(--ink-900);
  --accent:#CFCFCF; --accent-hover:var(--ink-0);
  --accent-soft:var(--ink-850); --accent-border:var(--ink-600);
  --on-accent:var(--ink-900); --accent-text:var(--ink-0);
  --route:var(--ink-0); --walk:#8F8F8F;
  --accent-route:var(--route); --accent-walk:var(--walk);
  --ok:var(--green-400); --ok-bg:var(--green-950);
  --warn:var(--amber-400); --warn-bg:var(--amber-950);
  --danger:var(--red-400); --danger-bg:var(--red-950);
  --info:var(--blue-400); --info-bg:var(--blue-950);
  --offline:#B8B8B8;
  --line:#262626; --line-strong:#454545;
  --focus:var(--brand); --scrim:rgba(0,0,0,.66);
  --map-land:#111111; --map-water:#1F1F1F; --map-park:#0D0D0D;
  --map-road:#2E2E2E; --map-road-minor:#1A1A1A; --map-building:#242424;
  --map-tile-filter:grayscale(1) invert(1) contrast(0.92) brightness(0.95);
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 20px -6px rgba(0,0,0,.45);
  --sh-3:0 4px 10px rgba(0,0,0,.35),0 24px 44px -14px rgba(0,0,0,.6);
}

/* ══════════════════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
html.native,html.native body{overscroll-behavior:none;touch-action:manipulation}
html.native .authwrap{padding-top:calc(var(--s6) + var(--safe-t));padding-bottom:calc(var(--s6) + var(--safe-b))}
html.native .authwrap__card{width:min(440px,100%);box-shadow:none;border:0;background:transparent;padding:var(--s4) 0}
html.native .splash{padding-top:var(--safe-t)}
html.native .btn{min-height:var(--tap)}
html.native .sheet{padding-bottom:calc(var(--s5) + var(--safe-b))}
.dlqr{width:220px;height:220px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg-base);image-rendering:pixelated}
body{background:var(--bg-page);color:var(--text-primary);
  /* The family list is brand.json's, not a copy of it. This rule used to hold the same
     eight names a second time, so a font change could only ever be half-applied: the
     poster and the brand mark read the chain, the app read the copy. */
  font:var(--fw-normal) var(--f-body)/var(--lh-body) var(--brand-font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;text-size-adjust:100%;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-width) solid var(--focus);
  outline-offset:var(--focus-offset);border-radius:var(--r-xs)}
:focus:not(:focus-visible){outline:none}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ══════════════════════════════════════════════════════════════════════════
   APP SHELL — always exactly one viewport tall, never more, never less.
   The shell is a flex row (rail | column). The column is topbar / search /
   scroller / dock. Only .main scrolls; everything else is flex:none and so
   is structurally incapable of scrolling away.
   ══════════════════════════════════════════════════════════════════════════ */
#root{height:100vh;height:100dvh;width:100%;display:flex}
.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:row;
  background:var(--bg-base);position:relative;overflow:hidden;
  max-width:var(--shell-max);margin-inline:auto;width:100%}
.appcol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;height:100%}

/* ── top bar ──────────────────────────────────────────────────────────── */
.topbar{flex:none;display:flex;align-items:center;gap:var(--s3);
  min-height:var(--topbar-h);
  padding-block:var(--s2);padding-block-start:calc(var(--s2) + var(--safe-t));
  padding-inline:var(--s4);
  border-bottom:1px solid var(--line);background:var(--bg-base);z-index:var(--z-sticky)}
.topbar--plain{border-bottom:0}
.topbar__title{font-size:var(--f-head);font-weight:var(--fw-bold);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:var(--lh-snug)}

/* ── search band: the first element of the page, scrolls with content ── */
.searchband{width:100%}
.searchband__inner{width:100%;max-width:var(--content-max);margin-inline:auto}
.searchband--wide .searchband__inner{max-width:none}

/* ── the one scrolling region ─────────────────────────────────────────── */
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:var(--s4);padding-inline-start:calc(var(--s4) + var(--safe-l));
  padding-inline-end:calc(var(--s4) + var(--safe-r));
  display:flex;flex-direction:column;gap:var(--s4);
  scrollbar-gutter:stable}
.main__inner{width:100%;max-width:var(--content-max);margin-inline:auto;
  display:flex;flex-direction:column;gap:var(--s4)}
.main--wide .main__inner{max-width:none}

/* ══════════════════════════════════════════════════════════════════════════
   NAVIGATION — one component, four presentations.
   compact  : bottom bar        (thumb reach)
   medium   : collapsed rail    (icon + tiny label)
   expanded+: expanded rail     (icon + label, profile pinned to the bottom)
   ══════════════════════════════════════════════════════════════════════════ */
.nav{flex:none;display:flex;background:var(--bg-base);z-index:var(--z-nav)}
.nav__brand{display:none}
.nav__items{display:flex;flex:1;min-width:0}
.nav__foot{display:none}
.navitem{flex:1;min-width:0;min-height:var(--tap);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:var(--r-md);color:var(--text-secondary);padding:var(--s1);
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.navitem:hover{color:var(--text-primary)}
.navitem[aria-current="page"]{color:var(--brand)}
.navitem__ico{display:grid;place-items:center;flex:none}
.navitem svg{width:var(--icon-lg);height:var(--icon-lg);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navitem[aria-current="page"] svg{stroke-width:2.4}
.navitem__label{font-size:var(--f-micro);font-weight:var(--fw-semi);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* rail collapse control — folds the desktop rail to icons and back */
.rail-toggle{display:none}

/* compact: bottom bar */
@media (max-width:599.98px){
  .app{flex-direction:column}
  .nav{order:2;border-top:1px solid var(--line);
    padding:var(--s2) var(--s2) calc(var(--s2) + var(--safe-b))}
  .appcol{order:1}
}

/* the footer copy of an item is hidden in the bar, and vice versa */
@media (min-width:600px){ .navitem.compact-only{display:none} }
@media (max-width:599.98px){ .nav__foot{display:none} }

/* medium and up: side rail */
@media (min-width:600px){
  .nav{flex-direction:column;border-inline-end:1px solid var(--line);
    background:var(--bg-raised);
    padding:var(--s4) var(--s3) calc(var(--s4) + var(--safe-b));
    padding-inline-start:calc(var(--s3) + var(--safe-l));
    width:var(--rail-collapsed);overflow-y:auto;overflow-x:hidden}
  .nav__items{flex-direction:column;flex:1;gap:var(--s1)}
  .navitem{flex:none;min-height:var(--tap-driver)}
  .nav__foot{display:flex;flex-direction:column;flex:none;gap:var(--s1);
    padding-top:var(--s3);border-top:1px solid var(--line);margin-top:var(--s3)}
  .rail-toggle{display:flex;align-items:center;justify-content:center;
    width:100%;min-height:var(--tap-driver);margin-top:var(--s3);
    border-radius:var(--r-md);color:var(--text-secondary);flex:none;
    transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
  .rail-toggle:hover{background:var(--bg-sunken);color:var(--text-primary)}
  .rail-toggle svg{width:var(--icon-md);height:var(--icon-md);fill:none;
    stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
}

/* expanded and up: rail shows labels beside icons */
@media (min-width:840px){
  .nav{width:var(--rail-expanded);padding-inline:var(--s3)}
  .nav__brand{display:flex;align-items:center;gap:var(--s2);flex:none;
    padding:var(--s2) var(--s3) var(--s5);font-size:var(--f-head);
    font-weight:var(--brand-font-weight);font-family:var(--brand-font);
    color:var(--brand);min-width:0}
  .nav__brand svg{width:var(--icon-lg);height:var(--icon-lg);flex:none;
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .nav__brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navitem{flex-direction:row;justify-content:flex-start;gap:var(--s3);
    padding-inline:var(--s3);min-height:var(--tap)}
  .navitem[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
  .navitem__label{font-size:var(--f-body);font-weight:var(--fw-semi)}
  /* user-collapsed rail: icons only, labels and brand name fold away */
  .app.rail-collapsed .nav{width:var(--rail-collapsed)}
  .app.rail-collapsed .nav__brand{justify-content:center;padding-inline:0}
  .app.rail-collapsed .nav__brand span{display:none}
  .app.rail-collapsed .navitem{flex-direction:column;justify-content:center;
    gap:2px;padding-inline:var(--s2)}
  .app.rail-collapsed .navitem__label{display:none}
}

/* DEC-200 desktop density — ~90% of the touch scale (owner's 90% Chrome
   zoom look). Do not use CSS zoom. Compact phones keep 44/56. */
@media (min-width:840px){
  :root{
    --density:compact;
    --f-display:29px; --f-title:20px; --f-head:16px; --f-lg:14px;
    --f-body:13px; --f-cap:12px; --f-micro:10px;
    --tap:40px; --tap-sm:32px;
    --icon-sm:14px; --icon-md:18px; --icon-lg:20px;
    --topbar-h:52px;
    --rail-collapsed:72px; --rail-expanded:216px;
    --content-max:756px;
    --s3:10px; --s4:14px; --s5:18px; --s6:22px; --s7:28px; --s8:36px;
    --r-md:12px; --r-lg:16px;
  }
  .rowitem{min-height:var(--tap);padding:var(--s2) var(--s3)}
  .table th,.table td{padding:var(--s2) var(--s3)}
  .routecard,.routecard__head{min-height:64px;padding:var(--s3)}
  .card,.panel{padding:var(--s3)}
}
@media (min-width:1200px){
  :root{ --content-max:756px; }
  .main{padding:var(--s4)}
  .topbar{padding-inline:var(--s4)}
}

/* short viewports (landscape phone): reclaim vertical space */
@media (max-height:520px){
  :root{--topbar-h:48px}
  .navitem__label{display:none}
  .nav{padding-block:var(--s1)}
}

/* ══════════════════════════════════════════════════════════════════════════
   LAYOUT UTILITIES
   ══════════════════════════════════════════════════════════════════════════ */
.stack{display:flex;flex-direction:column;min-width:0}
.row{display:flex;align-items:center;min-width:0;flex-wrap:wrap}
.row--nowrap{flex-wrap:nowrap}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.gap1{gap:var(--s1)} .gap2{gap:var(--s2)} .gap3{gap:var(--s3)}
.gap4{gap:var(--s4)} .gap5{gap:var(--s5)} .gap6{gap:var(--s6)}
.mt2{margin-top:var(--s2)} .mt3{margin-top:var(--s3)} .mt4{margin-top:var(--s4)}
.center{align-items:center;text-align:center}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* responsive grid: columns follow available space, not a device list */
.grid{display:grid;gap:var(--s3);width:100%;min-width:0;
  grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.grid--tight{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}

/* ══════════════════════════════════════════════════════════════════════════
   TYPOGRAPHY
   ══════════════════════════════════════════════════════════════════════════ */
.t-display{font-size:var(--f-display);font-weight:var(--fw-bold);
  line-height:var(--lh-tight);letter-spacing:-.02em}
.t-title{font-size:var(--f-title);font-weight:var(--fw-bold);
  line-height:var(--lh-tight);letter-spacing:-.01em}
.t-head{font-size:var(--f-head);font-weight:var(--fw-bold);line-height:var(--lh-snug)}
.t-lg{font-size:var(--f-lg);font-weight:var(--fw-semi);line-height:var(--lh-snug)}
.t-cap{font-size:var(--f-cap);color:var(--text-secondary);line-height:var(--lh-snug)}
.t-micro{font-size:var(--f-micro);color:var(--text-secondary);font-weight:var(--fw-bold);
  letter-spacing:.07em;text-transform:uppercase;line-height:var(--lh-snug)}
.muted{color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}
.emoji{font-size:var(--f-lg);line-height:1}

/* ══════════════════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding-inline:var(--s5);border-radius:var(--r-md);
  font-size:var(--f-body);font-weight:var(--fw-semi);white-space:nowrap;flex:none;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             border-color var(--fast) var(--ease);border:1px solid transparent}
.btn svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn--primary{background:var(--brand);color:var(--on-brand)}
.btn--primary:hover:not([disabled]){background:var(--brand-hover);
  transform:translateY(-2px)}
.btn--accent{background:var(--accent);color:var(--on-accent)}
.btn--accent:hover:not([disabled]){background:var(--accent-hover)}
.btn--secondary{background:var(--bg-sunken);color:var(--text-primary)}
.btn--secondary:hover:not([disabled]){background:var(--bg-inset)}
.btn--outline{border-color:var(--line-strong);color:var(--text-primary)}
.btn--outline:hover:not([disabled]){background:var(--bg-raised);border-color:var(--brand)}
.btn--ghost{color:var(--brand);padding-inline:var(--s3)}
.btn--ghost:hover:not([disabled]){background:var(--brand-soft)}
.btn--danger{background:var(--danger);color:var(--on-solid)}
.btn--block{width:100%;flex:1 1 auto}
.btn--sm{min-height:var(--tap-sm);padding-inline:var(--s3);font-size:var(--f-cap);border-radius:var(--r-sm)}
.btn--driver{min-height:var(--tap-driver);font-size:var(--f-lg);border-radius:var(--r-lg)}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);min-width:0;margin-top:var(--s4)}
.setting{display:grid;gap:var(--s3);align-items:center;grid-template-columns:1fr;min-width:0}
.setting__copy{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.setting__edit{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.desk-split{display:grid;gap:var(--s4);grid-template-columns:1fr;min-width:0}
@media (min-width:840px){
  .setting{grid-template-columns:minmax(0,1.2fr) minmax(12rem,1fr)}
  .desk-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[aria-busy="true"]{pointer-events:none}

.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--text-primary);flex:none;
  transition:background var(--fast) var(--ease)}
.iconbtn:hover{background:var(--bg-sunken)}
.iconbtn svg{width:var(--icon-lg);height:var(--icon-lg);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .iconbtn--flip svg{transform:scaleX(-1)}

/* ══════════════════════════════════════════════════════════════════════════
   SURFACES
   ══════════════════════════════════════════════════════════════════════════ */
.card{background:var(--bg-base);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.card--raised{background:var(--bg-raised)}
.card--brand{background:var(--brand-soft);border-color:var(--brand-border)}
.card--accent{background:var(--accent-soft);border-color:var(--accent-border)}
.card--tight{gap:var(--s2)}
.panel{background:var(--bg-raised);border-radius:var(--r-md);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.divider{height:1px;background:var(--line);flex:none}
.section{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.section__head{display:flex;align-items:center;gap:var(--s3);min-width:0}

/* ══════════════════════════════════════════════════════════════════════════
   LIST ROWS — one owner of row padding. No class stacking on the box.
   ══════════════════════════════════════════════════════════════════════════ */
.rowitem{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  min-height:var(--tap-driver);padding:var(--s3) var(--s4);border-radius:var(--r-md);
  text-align:start;background:var(--bg-base);border:1px solid transparent;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.rowitem--bordered{border-color:var(--line)}
.rowitem:hover:not([disabled]){background:var(--bg-raised)}
.rowitem--selected{background:var(--accent-soft);border-color:var(--accent)}
.rowitem[disabled]{opacity:.5;cursor:not-allowed}
.rowitem>svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  color:var(--text-secondary)}
[dir="rtl"] .rowitem .chev{transform:scaleX(-1)}
.rowgroup{display:flex;flex-direction:column;background:var(--bg-base);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0}
.rowgroup .rowitem{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.rowgroup .rowitem:last-child{border-bottom:0}

/* ══════════════════════════════════════════════════════════════════════════
   SEARCH — one component owning its own box.
   Font size is --f-input (16px) so iOS never force-zooms on focus.
   ══════════════════════════════════════════════════════════════════════════ */
.searchbar{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  min-height:var(--tap);padding-inline:var(--s4);border-radius:var(--r-full);
  background:var(--bg-sunken);border:1px solid transparent;
  color:var(--text-secondary);font-size:var(--f-input);text-align:start;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.searchbar:hover{background:var(--bg-inset)}
.searchbar:focus-within{background:var(--bg-base);border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar>svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:0;
  height:var(--tap);color:var(--text-primary);font-size:var(--f-input)}
.searchbar input::placeholder{color:var(--text-secondary);opacity:1}
.searchbar__text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════════
   CHIPS · BANNERS
   ══════════════════════════════════════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  border-radius:var(--r-full);background:var(--bg-sunken);font-size:var(--f-cap);
  font-weight:var(--fw-semi);min-height:30px;white-space:nowrap;flex:none;
  border:1px solid transparent}
.chip--brand{background:var(--brand);color:var(--on-brand)}
.chip--accent{background:var(--accent-soft);color:var(--accent-text);
  border-color:var(--accent-border)}
.chip--ok{background:var(--ok-bg);color:var(--ok)}
.chip--warn{background:var(--warn-bg);color:var(--warn)}
.chip--danger{background:var(--danger-bg);color:var(--danger)}
.chip--info{background:var(--info-bg);color:var(--info)}
.chip--outline{background:none;border-color:var(--line-strong)}
button.chip{cursor:pointer;transition:background var(--fast) var(--ease),
  color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
button.chip:hover:not([disabled]){border-color:var(--accent)}
button.chip[disabled]{opacity:.4;cursor:not-allowed}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);
  border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:var(--r-full);flex:none;background:currentColor}

.banner{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3);
  border-radius:var(--r-sm);font-size:var(--f-cap);font-weight:var(--fw-med);
  line-height:var(--lh-snug)}
.banner .dot{margin-top:5px}
.banner--offline{background:var(--bg-inset);color:var(--text-secondary)}
.banner--warn{background:var(--warn-bg);color:var(--warn)}
.banner--info{background:var(--info-bg);color:var(--info)}
.banner--danger{background:var(--danger-bg);color:var(--danger)}
.banner--ok{background:var(--ok-bg);color:var(--ok)}
.banner--accent{background:var(--accent-soft);color:var(--accent-text)}

/* ══════════════════════════════════════════════════════════════════════════
   FORMS — all fields use --f-input
   ══════════════════════════════════════════════════════════════════════════ */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:var(--f-cap);font-weight:var(--fw-semi);color:var(--text-secondary)}
/* password fields: input + show/hide eye, one box */
.inputwrap{position:relative;min-width:0}
.inputwrap .input{padding-inline-end:var(--s8)}
.field__eye{position:absolute;inset-inline-end:var(--s1);top:50%;translate:0 -50%;
  width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--text-muted);flex:none}
.field__eye:hover{color:var(--text-primary);background:var(--bg-sunken)}
.field__eye svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input{min-height:var(--tap);width:100%;border:1px solid var(--line-strong);
  border-radius:var(--r-md);padding-inline:var(--s4);background:var(--bg-base);
  outline:0;font-size:var(--f-input);transition:border-color var(--fast) var(--ease),
  box-shadow var(--fast) var(--ease)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{padding-block:var(--s3);min-height:96px;resize:vertical;
  line-height:var(--lh-body)}
select.input{cursor:pointer}
.otp{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap}
.otp input{width:46px;height:56px;text-align:center;font-size:var(--f-title);
  font-weight:var(--fw-bold);border:1px solid var(--line-strong);
  border-radius:var(--r-md);background:var(--bg-base);outline:0}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stepper{display:inline-flex;align-items:center;gap:var(--s2);background:var(--bg-sunken);
  border-radius:var(--r-full);padding:4px;flex:none}
.stepper button{width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-full);
  background:var(--bg-base);display:grid;place-items:center;
  font-weight:var(--fw-bold);box-shadow:var(--sh-1)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper span{min-width:24px;text-align:center;font-weight:var(--fw-bold)}
.switch{width:46px;height:28px;border-radius:var(--r-full);background:var(--line-strong);
  position:relative;flex:none;transition:background var(--fast) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;
  width:22px;height:22px;border-radius:var(--r-full);background:var(--knob);
  box-shadow:var(--sh-1);transition:transform var(--fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-18px)}
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-full);
  padding:3px;gap:2px;flex:none;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:var(--r-full);font-size:var(--f-cap);
  font-weight:var(--fw-semi);color:var(--text-secondary);min-height:var(--tap-sm);
  white-space:nowrap;transition:background var(--fast) var(--ease),
  color var(--fast) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--bg-base);color:var(--text-primary);
  box-shadow:var(--sh-1)}

/* ══════════════════════════════════════════════════════════════════════════
   STATES
   ══════════════════════════════════════════════════════════════════════════ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:var(--s3);padding:var(--s8) var(--s4);color:var(--text-secondary)}
.empty__ico{width:72px;height:72px;border-radius:var(--r-full);flex:none;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.empty__ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.empty>svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.5;
  opacity:.5;stroke-linecap:round;stroke-linejoin:round}
.skeleton{background:linear-gradient(90deg,var(--bg-sunken),var(--bg-inset),var(--bg-sunken));
  background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════════════════════════════════
   DOMAIN COMPONENTS
   ══════════════════════════════════════════════════════════════════════════ */
.routecard{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;
  padding:var(--s4);min-height:76px;border:1px solid var(--line);
  border-radius:var(--r-md);text-align:start;background:var(--bg-base);
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.routecard:hover{border-color:var(--brand);box-shadow:var(--sh-2);transform:translateY(-1px)}
.routecard:active{transform:translateY(0) scale(.99)}
.routeline{font-weight:var(--fw-semi);font-size:var(--f-lg);line-height:var(--lh-snug)}
.fare{font-weight:var(--fw-bold);font-size:var(--f-lg);white-space:nowrap;
  font-variant-numeric:tabular-nums}

/* search result card — the container is a DIV (a button cannot nest buttons),
   the head is the tappable row, the deps are the nested bookable journeys. */
.routecard--results{display:flex;flex-direction:column;align-items:stretch;
  gap:0;padding:0;overflow:hidden;cursor:default}
.routecard--results:hover{transform:none}
.routecard__head{display:flex;align-items:center;gap:var(--s3);width:100%;
  min-width:0;padding:var(--s4);min-height:76px;border:0;background:none;
  text-align:start;cursor:pointer;color:inherit}
.routecard__head:hover{background:var(--bg-sunken)}
.routecard__stop{display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s4);background:var(--accent-soft);color:var(--accent-text);
  border-top:1px solid var(--accent-border)}
.routecard__stop svg{width:var(--icon-md);height:var(--icon-md);flex:none;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.routecard__deps{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-top:1px solid var(--line);
  background:var(--bg-sunken)}
.routecard__nodeps{color:var(--text-muted)}
.depchip{min-height:32px;padding:4px 12px;border-radius:var(--r-full);
  background:var(--bg-base);border:1px solid var(--line);color:var(--text-primary);
  font-size:var(--f-cap);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;
  cursor:pointer;transition:border-color var(--fast) var(--ease),
  background var(--fast) var(--ease)}
.depchip:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* the clear (×) button inside the live search field — hidden until there
   is a value */
.searchbar__clear{display:none;width:var(--tap-sm);height:var(--tap-sm);
  border-radius:var(--r-full);place-items:center;flex:none;color:var(--text-muted)}
.searchbar__clear--on{display:grid}
.searchbar__clear:hover{color:var(--text-primary);background:var(--bg-sunken)}
.searchbar__clear svg{width:var(--icon-md);height:var(--icon-md);fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pricetag{font-size:var(--f-display);font-weight:var(--fw-bold);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:var(--lh-tight)}
.avatar{width:38px;height:38px;border-radius:var(--r-full);background:var(--bg-inset);
  display:grid;place-items:center;font-weight:var(--fw-bold);font-size:var(--f-cap);
  flex:none;overflow:hidden}
.avatar svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar--sm{width:32px;height:32px;font-size:var(--f-micro)}
.avatar--lg{width:64px;height:64px;font-size:var(--f-head)}
.avatar--lg svg{width:30px;height:30px}
.manifest{display:flex;align-items:center;gap:var(--s3);min-width:0;
  padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--bg-raised);
  min-height:var(--tap-driver)}
.metric{background:var(--bg-raised);border-radius:var(--r-md);padding:var(--s4);min-width:0}
.metric__v{font-size:var(--f-title);font-weight:var(--fw-bold);line-height:var(--lh-tight);
  font-variant-numeric:tabular-nums}
.metric__l{font-size:var(--f-cap);color:var(--text-secondary);margin-top:2px}
.alert{border:1px solid var(--line);border-inline-start:3px solid var(--warn);
  border-radius:var(--r-md);padding:var(--s4);background:var(--bg-base);
  display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.alert--info{border-inline-start-color:var(--info)}
.alert--ok{border-inline-start-color:var(--ok)}
.alert--accent{border-inline-start-color:var(--accent)}
.alert--danger{border-inline-start-color:var(--danger)}

/* stop timeline */
.stops{position:relative;padding-inline-start:var(--s6)}
.stops::before{content:"";position:absolute;inset-inline-start:8px;top:14px;bottom:14px;
  width:2px;background:var(--line-strong)}
.stop{position:relative;display:flex;align-items:center;gap:var(--s3);
  padding-block:var(--s2);min-height:40px;min-width:0}
.stop::before{content:"";position:absolute;inset-inline-start:-21px;width:10px;height:10px;
  border-radius:var(--r-full);background:var(--bg-base);border:2px solid var(--line-strong)}
.stop--now::before{background:var(--brand);border-color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.stop--done::before{background:var(--line-strong)}
.stop--done{opacity:.5}

/* map */
.mapbox{position:relative;border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--line);background:var(--map-land);flex:none}
/* RouteMap/SearchMap fallback discipline (R21/DEC-206): inside the map
   primitives the illustration is strictly 100%×100% of its box and the
   decorative zoom transform is off — the svg element must never escape
   its clipping box (layout suite: "nothing escapes the window"). */
.mapbox--route .mapbox .mapsvg{width:100%;height:100%;transform:none}
.mapbox--route > .mapsvg{width:100%;height:100%;transform:none}
.mapbox--route .mapbox{border:0;border-radius:0}

/* RouteMap accessible stop list (R21) — the non-map alternative */
.mapstops{margin:0;padding:0;list-style:none}
.mapstops__item{align-items:center;padding:var(--s2) var(--s3);border-radius:var(--r-md);
  background:var(--bg-raised);border:1px solid var(--line)}
.mapstops__item--hi{border-color:var(--brand);background:var(--bg-inset)}
.mapstops__n{flex:none;width:26px;height:26px;border-radius:var(--r-full);
  display:grid;place-items:center;font-size:12px;font-weight:600;
  background:var(--brand);color:var(--on-brand)}
.mapbox .mapsvg{display:block;width:100%;height:100%;overflow:hidden}
.mapctl{position:absolute;top:var(--s3);inset-inline-end:var(--s3);
  display:flex;flex-direction:column;gap:var(--s1)}
.mapctl button{width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-sm);
  background:var(--bg-base);box-shadow:var(--sh-2);display:grid;place-items:center;
  font-weight:var(--fw-bold)}
.attribution{position:absolute;bottom:0;inset-inline-end:0;background:var(--scrim);
  color:var(--on-solid);font-size:10px;padding:2px 6px;
  border-start-start-radius:var(--r-xs)}

/* QR */
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:var(--s3);
  padding:var(--s5);background:var(--qr-paper);border-radius:var(--r-lg);
  border:1px solid var(--line)}
.qr{width:min(176px,60vw);height:min(176px,60vw);image-rendering:pixelated}
.qrcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;
  font-weight:var(--fw-bold);letter-spacing:.16em;color:var(--qr-ink)}

/* tables — horizontal scroll is the deliberate small-space strategy */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--bg-base);-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;font-size:var(--f-body);min-width:560px}
.table th{text-align:start;font-size:var(--f-micro);color:var(--text-secondary);
  letter-spacing:.05em;text-transform:uppercase;font-weight:var(--fw-bold);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);
  vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--bg-raised)}

/* sheet + scrim */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:var(--z-scrim);
  animation:fade var(--med) var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:var(--z-sheet);
  background:var(--bg-base);border-top:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);
  padding:var(--s5);padding-bottom:calc(var(--s5) + var(--safe-b));
  max-height:min(86%,720px);overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:var(--s3);
  animation:up var(--med) var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet__grip{width:38px;height:4px;border-radius:var(--r-full);
  background:var(--line-strong);margin:0 auto var(--s3);flex:none}
@media (min-width:600px){
  /* Centred by the inline box, not by an anchor and a transform: measured in Chrome,
     `inset-inline-start:50%` with `translateX(-50%)` lands a full element-width off to the
     left in RTL (−200px of a 200px box), because the anchor is logical and the transform is
     physical. `inset-inline:0` + `margin-inline:auto` is 0px in both directions. */
  .sheet{inset-inline:0;margin-inline:auto;bottom:auto;top:50%;translate:0 -50%;
    width:min(480px,92%);
    border-radius:var(--r-lg);border:1px solid var(--line);
    max-height:min(82%,720px);animation:pop var(--med) var(--ease)}
  .sheet__grip{display:none}
  @keyframes pop{from{opacity:0;transform:scale(.97)}}
}

/* toast */
.toast{position:absolute;z-index:var(--z-toast);
  bottom:calc(var(--s5) + var(--safe-b));inset-inline:var(--s4);
  background:var(--text-primary);color:var(--bg-base);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);box-shadow:var(--sh-3);
  font-size:var(--f-cap);font-weight:var(--fw-semi);
  display:flex;align-items:center;gap:var(--s2);animation:up var(--med) var(--ease)}
.toast svg{width:var(--icon-md);height:var(--icon-md);flex:none;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:600px){
  /* The same measured rule as the sheet above; `width:fit-content` is what lets the auto
     margins centre it, since an absolutely positioned box with both insets and auto width
     stretches instead of centring. */
  .toast{inset-inline:0;margin-inline:auto;width:fit-content;
    min-width:300px;max-width:420px;justify-content:center}
}

/* auth */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:var(--s5);padding:var(--s6);
  overflow-y:auto;min-height:0}
.logomark{width:72px;height:72px;border-radius:var(--r-lg);flex:none;
  display:grid;place-items:center;
  background:var(--brand);color:var(--on-brand)}
.logomark svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.authfoot{flex:none;display:flex;flex-direction:column;gap:var(--s3);
  padding:var(--s5) var(--s6);padding-bottom:calc(var(--s6) + var(--safe-b));
  width:100%;max-width:480px;margin-inline:auto}
.authmain{flex:1;min-height:0;overflow-y:auto;padding:var(--s5) var(--s6);
  display:flex;flex-direction:column;gap:var(--s4);
  width:100%;max-width:480px;margin-inline:auto}
/* ══════════════════════════════════════════════════════════════════════
   BOOT SPLASH · LANDING · AUTH · MOTION
   ══════════════════════════════════════════════════════════════════════ */

/* boot splash — bouncy logo; the bounce collapses under reduced motion */
/* The one thing the boot screen may do is move: it covers a blank document
   while the session resolves, so a logo that lifts is the difference between
   "loading" and "broken". On the poster's paper, in the poster's ink. */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s4);background:var(--paper);color:var(--ink);
  z-index:var(--z-toast)}
.splash__logo{width:92px;height:92px;color:var(--ink);animation:splashbounce 1.1s var(--ease) infinite}
.splash__logo svg{width:100%;height:100%}
.splash__name{font-size:var(--f-title);font-weight:var(--brand-font-weight);font-family:var(--brand-font);color:var(--text-primary)}
@keyframes splashbounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-14px) scale(1.05)}}

.intro{width:100%;min-width:0;height:100%;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink)}
.intro__stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:var(--f-introgap);padding:var(--f-introgap) var(--s6);
  max-width:480px;margin-inline:auto;width:100%}
.intro__foot{flex:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
  padding-bottom:calc(var(--s5) + var(--safe-b));border-top:1px solid var(--line);background:var(--paper)}
.intro__kick{font-size:var(--f-cap);font-weight:650;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-mute);margin:0}
.intro__t{font-size:var(--f-intro);line-height:1;letter-spacing:-.04em;font-weight:var(--fw-bold);
  margin:0;max-width:20ch;text-wrap:balance}
.intro__b{color:var(--ink-soft);font-size:var(--f-lg);line-height:1.6;margin:0;max-width:46ch}
.intro__c{font-size:var(--f-body);color:var(--ink-mute);margin:0;max-width:46ch}
.intro__foot .btn--primary{flex:1}
.intro__ic{width:56px;height:56px;display:grid;place-items:center;border-radius:var(--r-sm);
  background:var(--bg-inset);color:var(--ink)}
.intro__ic svg{width:26px;height:26px}
.intro__dots{display:flex;gap:var(--s2);justify-content:center}
.intro__dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--line-strong)}
.intro__dot--on{background:var(--brand);width:20px}
html.native .intro{padding-top:var(--safe-t)}

/* ══════════════════════════════════════════════════════════════════════
   THE LANDING — the poster. One scroller, one ink, one type family.

   The composition, in the order the reader meets it: a fixed frosted head; a
   masthead exactly one viewport tall, printed on paper over twelve hairline
   columns; a running band of glyphs; the journey — four value propositions
   that are stops on one road the bus rides as you scroll; the inverted slab
   with the three steps; the chapter list; the closer. Then the sub-pages
   (drive, about, help, download, policies) reuse the same scaffolding, so the
   whole site is one typeset document rather than a poster with appendices.

   Two rules hold it together. Every section is a child of the page grid, which
   is what gives the poster its edge-to-edge hairlines and its capped measure;
   and every size, colour and duration is a token, so dark mode, RTL and the
   compact breakpoint are free rather than re-derived. The scroll machinery —
   reveals, the weight scrub, the bus — lives in src/lib/motion.js and reads
   only the custom properties set here: CSS owns the look, JS owns the numbers
   that come from geometry.
   ══════════════════════════════════════════════════════════════════════ */
/* width:100% is load-bearing: #root is display:flex in a row, so a child with no
   width shrinks to its content instead of filling the viewport (the regression
   tests/landing.test.js measures at seven sizes). The landing scrolls, not the
   document — html/body stay overflow:hidden for the whole app. */
.landing{width:100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;
  background:var(--paper);color:var(--ink);scroll-behavior:smooth;
  /* The brand chain, asked by name: until now the poster rendered in whatever the
     user agent happened to call its default face, which meant a different metric on
     every device and no way to type Arabic at all. One chain for the page, and the
     faces inside it decide per script through their own ranges. */
  font-family:var(--brand-font);
  font-size:var(--f-lg);-webkit-font-smoothing:antialiased}
/* One grid for the whole page: gutter · measure · gutter. A section that must
   print to both edges takes the full span and reintroduces the gutter itself. */
/* The gutters are floors, not walls: minmax(--gutter,1fr) lets them take the surplus, so
   the column centres itself and a band that asks for 1/-1 reaches the viewport edge. A
   fixed gutter plus a capped middle track is what pinned the whole poster to the left with
   dead space on the right — at any width above --landing-max + 2*--gutter. */
.landing__body{display:grid;
  grid-template-columns:minmax(var(--gutter),1fr) minmax(0,var(--landing-max)) minmax(var(--gutter),1fr);
  align-content:start;position:relative}
.landing__body>*{grid-column:2;min-width:0}
/* No rule between sections: the section's own padding (12vh of it) was always the
   separator, and a hairline on top of that asks the eye to read a border as content. */
.landing__section{grid-column:2;min-width:0;padding-block:clamp(4.5rem,13vh,9.5rem)}
.landing__section--bleed{grid-column:1/-1;padding-inline:var(--gutter)}
.landing__section--first{border-top:0;padding-block-start:clamp(6rem,16vh,10rem)}
.landing__body--page>.landing__section{border-top:0}

/* ── voice: kick, title, lede, body copy ──────────────────────────────────
   The kick's tracking is the poster's bullet; the titles are tight because at
   these sizes loose tracking reads as a headline from a newspaper. */
.landing__kick{font-size:var(--f-cap);font-weight:650;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-mute);margin:0}
.landing__title{font-size:var(--f-poster);line-height:.98;
  letter-spacing:-.04em;font-weight:var(--fw-bold);max-width:20ch;margin:0;text-wrap:balance}
.landing__h3{font-size:var(--f-head);line-height:var(--lh-tight);font-weight:var(--fw-bold);
  letter-spacing:-.01em;margin:0}
.landing__lede{color:var(--ink-soft);max-width:56ch;font-size:var(--f-lg);margin:0;line-height:1.6}
.landing__p{color:var(--ink-soft);font-size:var(--f-body);line-height:1.6;margin:0;max-width:60ch}
.landing__hero-foot{margin-block-start:clamp(2rem,6vh,4rem)}
.landing__note{font-size:var(--f-cap);color:var(--ink-mute);margin:0}
.landing__hl{background-image:linear-gradient(var(--ink),var(--ink));background-repeat:no-repeat;
  background-position:0 92%;background-size:100% 2px;padding-bottom:.08em}
.landing__acts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
/* The demo's bare button: no fill, no border, underline on hover. It must
   restate the ink colour, because the shared .btn is an ink block with paper
   text and a transparent variant that inherits that would print white on white. */
.landing .btn--bare{background:transparent;border-color:transparent;color:var(--ink);
  padding-inline:.4rem}
.landing .btn--bare:hover:not([disabled]){text-decoration:underline;text-underline-offset:4px;
  transform:none}

/* ── the head: fixed, frosted, one hairline ─────────────────────────────
   Frosted glass deliberately replaces blend-mode tricks: a panel that inverts
   against what is behind it cannot also be a translucent panel. */
.landing__nav{position:fixed;inset:0 0 auto 0;z-index:var(--z-landing-nav);
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;
  column-gap:var(--s3);
  padding:var(--s2) var(--gutter);background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-line);color:var(--ink)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .landing__nav{background:var(--glass-solid)}
}
.landing__brand{display:inline-flex;align-items:center;min-block-size:var(--tap);gap:.6rem;border:0;background:none;
  padding:0;cursor:pointer;color:inherit;font:inherit;font-weight:var(--fw-semi);
  letter-spacing:-.02em;text-decoration:none;font-size:var(--f-lg)}
.landing__brand svg{width:19px;height:19px;flex:none}
/* The three regions are placed, not floated into each other. The outer tracks are
   `minmax(0,1fr)`: equal by definition in either direction, which is what puts the page
   names on the poster's own axis, and they can shrink to nothing instead of letting the
   centre lean on a neighbour. The earlier attempt here was `position:absolute;
   inset-inline-start:50%;transform:translateX(-50%)` — a logical anchor and a physical
   transform, which in RTL moved the block a full half-width to the left of where it was
   anchored and laid it on top of the auth group (measured: 115 px of overlap at 1280 px).
   A grid cannot overlap its own tracks, in either direction, at any label length. Chrome
   says the same of the pattern everywhere: that pairing is 0 px off in LTR and exactly one
   element width (−200 px of a 200 px box) off in RTL. `.sheet` and `.toast` were the same
   mistake and are fixed the same way in the same commit. */
.landing__brand{grid-column:1;justify-self:start;min-width:0}
.landing__actions{grid-column:3;justify-self:end}
.landing__links{display:flex;gap:clamp(1rem,2.4vw,2.2rem);font-size:var(--f-cap);
  letter-spacing:-.005em;min-width:0;justify-self:center}
.landing__link{display:inline-flex;align-items:center;min-block-size:var(--tap);
  /* The word in the bar is the target: Arabic's shortest label ("عنّا") is 14 px
     of glyph, which is a tap area a thumb misses. Padding on the link, not on the
     row, so the spacing between labels stays the bar's own and every name gets a
     hit box at least as wide as it is tall. */
  flex:none;padding-block:0;padding-inline:var(--s2);border:0;background:none;cursor:pointer;font:inherit;color:var(--ink);
  opacity:.72;transition:opacity var(--med) var(--ease)}
.landing__link:hover,.landing__link:focus-visible{opacity:1}
/* The one thing in the bar a reader should find without hunting for it: a solid dot and
   the weight, no box. The owner asked for the border to go and the dot to stay, and the
   result is the better of the two — a filled pill competes with the ink it sits on, while
   a dot is a mark the logo already uses. Full opacity and the semibold weight carry the rest;
   hover behaves exactly like every other name in the row, because emphasis that changes
   the rules on interaction is a different control, not a louder one. `[data-cta]` comes
   from the markup, so the panel's row for the same destination stays a plain row. */
.landing__links .landing__link[data-cta]{opacity:1;gap:.45rem;font-weight:var(--fw-semi)}
.landing__links .landing__link[data-cta]::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--ink);flex:none;align-self:center}
.landing__links .landing__link[data-cta]:hover::before{transform:scale(1.35)}
.landing__link--on{opacity:1;font-weight:var(--fw-semi);text-decoration:underline;
  text-underline-offset:6px;text-decoration-thickness:1.5px}
.landing__actions{display:flex;align-items:center;gap:var(--s2);min-width:0}
/* The switches on one side, the two ways in on the other: half a step apart they read
   as one crowd of small controls, and the bar is the place a reader decides. */
.landing__actions>.btn{margin-inline-start:var(--s3)}
.landing__tgl{display:inline-flex;align-items:center}
/* At 320 px the row is: the mark, the language, the theme, the button and the menu.
   A wordmark will not fit beside all of them, so the mark stands alone and keeps the
   link's accessible name; nothing a reader can act on is taken away. */
@media (max-width:379px){
  .landing__nav{gap:var(--s1)}
  .landing__brand>span{display:none}
  /* With the wordmark gone the mark alone is the home button: it gets a square tap
     area, not a 19 px sliver, so the tap floor the links obey holds here too. */
  .landing__brand{gap:0;min-inline-size:var(--tap);justify-content:center}
  .landing__actions{gap:var(--s1)}
  .landing__nav .btn{padding:.45rem .7rem}
  /* And the filled button leaves the row too. Measured at 320 px: the mark (44) + the two
     switches and Sign up (203) + the menu (44) + the gaps want 315 px of the 288 the
     padding leaves, so the bar painted its own ends over each other — 15 px in English,
     13 in Arabic. Below 700 the panel's first rows already ARE Log in and Sign up, so the
     control is not lost, only not duplicated in a row that cannot hold it. */
  .landing__actions .btn{display:none}
}
.landing__langbtn{border:0;background:none;cursor:pointer;font:inherit;color:var(--ink);
  font-size:var(--f-cap);font-weight:var(--fw-semi);letter-spacing:.01em;
  padding:.2rem .4rem;white-space:nowrap}
.landing__langbtn:hover{text-decoration:underline;text-underline-offset:4px}
/* Three dots and nothing else. The tap target stays --tap-sm even though the
   chrome is gone: an invisible 44px square is still a 44px square to a thumb. */
.landing__menu{display:none;grid-column:3;justify-self:end;border:0;background:transparent;color:var(--ink);
  width:var(--tap);height:var(--tap);align-items:center;justify-content:center;
  cursor:pointer;flex:none;opacity:.8;transition:opacity var(--med) var(--ease)}
.landing__menu svg{width:22px;height:22px;fill:currentColor;stroke:none}
.landing__menu:hover,.landing__menu:focus-visible{opacity:1;outline-offset:-2px}
/* The panel is the bar continued: the same frost, the same hairline, and an
   entrance rather than a pop. It animates on mount because a re-render replaces the
   node — a transition on a node that has never been painted would be skipped. */
.landing__menu-panel{position:absolute;inset-inline:0;inset-block-start:100%;display:grid;
  gap:1px;background:var(--glass);
  /* Exactly the bar's glass, on purpose: the panel IS the bar continued, and a sheet that
     is 96% opaque while its own header is 62% reads as two different materials. The blur
     alone was already there — invisible at that alpha, which is why it looked like the
     effect had been dropped. Where backdrop-filter is missing the fallback below still
     gives a solid surface, so the panel is never unreadable, only less frosted. */
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-line);box-shadow:var(--sh-3);
  padding:var(--s3) var(--gutter) var(--s4);transform-origin:top center;
  animation:landing-menu-in var(--panel-in-dur) var(--panel-in-ease) both}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .landing__menu-panel{background:var(--glass-solid)}
}
@keyframes landing-menu-in{
  from{opacity:0;transform:translateY(calc(-1 * var(--s2))) scale(.985)}
  to{opacity:1;transform:none}
}
/* The rows arrive on the same curve, one step behind the next: the panel reads as
   one object opening, not seven controls appearing. */
@keyframes landing-menu-row{
  from{opacity:0;transform:translateY(calc(-1 * var(--s2)))}
  to{opacity:1;transform:none}
}
.landing__menu-panel .landing__menulink{animation:landing-menu-row var(--panel-in-dur) var(--panel-in-ease) both}
.landing__menu-panel .landing__menulink:nth-child(2){animation-delay:calc(var(--panel-in-step) * 1)}
.landing__menu-panel .landing__menulink:nth-child(3){animation-delay:calc(var(--panel-in-step) * 2)}
.landing__menu-panel .landing__menulink:nth-child(4){animation-delay:calc(var(--panel-in-step) * 3)}
.landing__menu-panel .landing__menulink:nth-child(5){animation-delay:calc(var(--panel-in-step) * 4)}
.landing__menu-panel .landing__menulink:nth-child(6){animation-delay:calc(var(--panel-in-step) * 5)}
.landing__menu-panel .landing__menulink:nth-child(7){animation-delay:calc(var(--panel-in-step) * 6)}
.landing__menulink{display:block;text-align:start;border:0;background:none;cursor:pointer;
  font:inherit;font-size:var(--f-title);font-weight:var(--fw-bold);letter-spacing:-.02em;
  color:var(--ink);padding:.55rem 0}
.landing__menulink:hover{color:var(--ink-soft)}
/* The theme switch, not a mystery icon: a switch you can read is a control, an
   icon is a riddle. `role="switch"` + `aria-checked` carries the state to AT. */
.landingsw{position:relative;flex:none;width:46px;height:25px;padding:0;cursor:pointer;
  background:transparent;border:1px solid var(--ink);border-radius:var(--r-full);
  transition:background var(--med) var(--ease)}
.landingsw__track{position:absolute;inset:0}
.landingsw__ic{position:absolute;top:50%;width:12px;height:12px;transform:translateY(-50%);
  color:var(--ink)}
.landingsw__ic--sun{left:5px}
.landingsw__ic--moon{right:5px}
.landingsw__knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--ink);transition:transform var(--med) var(--ease)}
.landingsw[aria-checked="true"] .landingsw__knob{transform:translateX(21px)}
.landing__nav .btn{padding:.5rem .95rem}
/* 999, not 1000: the centring above turns on at `min-width:1000px`, and two ranges that
   both claim 1000 px is the boundary give a browser two answers at once. */
@media (max-width:999px){
  .landing__links{display:none}
  .landing__menu{display:inline-flex}
  /* One region per track: the menu button is the last thing in the bar, and the actions
     keep the track to its left rather than sharing a cell with it. */
  .landing__nav{grid-template-columns:minmax(0,1fr) auto auto}
  .landing__actions{grid-column:2}
}
@media (max-width:700px){
  /* The bar drops its own "Log in" here because the panel's first rows are Log in
     and Sign up. This rule used to name `.btn--ghost`, a class the markup stopped
     producing, so the control stayed in the row and at 320 px it pushed the menu —
     the phone's only way into the site — off the screen. */
  .landing__nav .btn--bare{display:none}
}

/* ── the masthead: exactly one viewport, three printed lines ───────────── */
.landing__hero{position:relative;grid-column:1/-1;width:100%;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;gap:var(--s3);
  padding:var(--bar-clearance) var(--gutter) var(--s5);
  /* One screen at least, and a screen exactly whenever the copy fits in it: the
     measured height is a floor, never a crop — `overflow:hidden` here holds the
     decorative grid, so a fixed height would cut the paragraph off instead. */
  min-height:var(--view-h,100dvh);
  max-width:none;isolation:isolate}
.landing__hero-inner{position:relative;z-index:1;display:contents}
/* The Swiss rule field: twelve hairlines, honest, visible. Drawn as cells so the
   columns are the grid, not a background image that would need its own gutters. */
.landing__hero-grid{position:absolute;inset:0;z-index:0;pointer-events:none;
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  max-width:var(--landing-max);margin-inline:auto;padding-inline:var(--gutter)}
.landing__hero-grid i{border-inline-start:1px solid var(--grid-line)}
.landing__hero-grid i:last-child{border-inline-end:1px solid var(--grid-line)}
.landing__head-top{position:relative;z-index:1;display:flex;justify-content:space-between;
  gap:var(--s2);font-size:var(--f-cap);text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-mute);font-variant-numeric:tabular-nums;
  padding-bottom:0}
/* The masthead's first cell: the bar's own top row, then the poster. The rows are
   declared once here and every landing surface inherits them through .landing__hero —
   that is the whole reason a page cannot opt out of the one-screen intro. */
.landing__introhead{position:relative;z-index:1;display:grid;gap:var(--s3);align-content:center}
.landing__display{position:relative;z-index:1;margin:0;display:grid;align-content:center;
  line-height:.82;letter-spacing:-.055em;text-transform:uppercase;
  font-weight:var(--fw-bold);color:var(--ink);
  font-size:var(--f-hero);margin-inline-start:-.055em}
.landing__displayline{display:block;overflow:hidden;min-width:0}
.landing__displayline>span{display:block;font-variation-settings:"wght" 420;
  will-change:font-variation-settings}
.landing__displayline--out>span{color:transparent;-webkit-text-stroke:2px var(--ink)}
.landing__hero-foot{position:relative;z-index:1;display:grid;gap:var(--s3);padding-top:0}
/* Two texts, one baseline: with the bar holding the calls to action, the foot's second
   column is the paragraph that explains the promise rather than a row of buttons, so the
   masthead reads as a title block instead of a form. Its own rule went with the buttons: a
   selector no markup produces is a selector the next reader will trust and edit. */
@media (min-width:900px){
  .landing__hero-foot{grid-template-columns:minmax(0,30rem) minmax(0,26rem);
    column-gap:var(--s7);align-items:end}
}
/* Short viewports: give the head height back so the three lines still fit one
   screen whole. The poster yields, it does not crop. */
@media (max-height:760px){
  .landing__hero{padding-block:5.5rem var(--s3);gap:var(--s2)}
  .landing__lede{font-size:var(--f-body)}
}
@media (max-width:700px){.landing__hero-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .landing__displayline--out>span{-webkit-text-stroke-width:1px}}

/* ── the running band ─────────────────────────────────────────────────── */
.landing__marquee{grid-column:1/-1;border-block:1px solid var(--line);overflow:hidden;
  padding-block:.7rem;background:var(--paper)}
.landing__marquee-in{display:flex;align-items:center;width:max-content}
.landing__marquee-ic{flex:none;width:var(--icon-md);height:var(--icon-md);
  margin-inline-end:1.75rem;color:var(--ink-mute)}
@media (prefers-reduced-motion:no-preference){
  /* One row rendered twice and shifted by exactly -50%: the loop is invisible
     because the second half is identical to the first. MARQUEE_REPEATS in
     data/journey.js keeps the count even for that reason. Hovering stops it —
     a band you cannot read is decoration, a band you can read is a claim. */
  .landing__marquee-in{animation:landingslide var(--marquee) linear infinite}
  .landing__marquee:hover .landing__marquee-in{animation-play-state:paused}
}
@keyframes landingslide{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

/* ── the journey: one route, ridden down the page ─────────────────────
   The map is absolutely positioned over the whole section and the copy flows
   above it: as the reader scrolls, the bus rides the real corridor and each cut
   becomes a stop it passes. The section is not sticky and does not scroll-jack:
   the road is long, the copy is normal document flow, and the bus is a mark of
   progress rather than an animation you have to wait for. */
.journey{position:relative;grid-column:1/-1}
/* The map covers the section it belongs to — `inset:0`, not a band of its own height.
   The projection in lib/motion.js is measured from the *section* box, so any other box
   here silently letterboxes the whole drawing: a viewBox of 1440×1031 painted into a
   1440×522 element halves the road and clips its lower half, which is how the corridor
   came to look empty. `lib/motion.js` and this rule are one mechanism and must be read
   together; `tests/landing.test.js` asserts the two boxes are equal at every viewport. */
.journey__svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;
  pointer-events:none;display:block;fill:none}
.journey__sea{fill:var(--sea)}
.journey__coast{fill:none;stroke:var(--coast);stroke-width:1.5}
.journey__canal{fill:none;stroke:var(--canal);stroke-width:3;stroke-linecap:round}
.journey__road-0{fill:none;stroke:var(--rd-0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.journey__road-1{fill:none;stroke:var(--rd-1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.journey__road-2{fill:none;stroke:var(--rd-2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.journey__road-3{fill:none;stroke:var(--rd-3);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.journey__mark{fill:var(--ink)}
.journey__mark-label{fill:var(--ink-soft);font-size:var(--f-micro);letter-spacing:.12em;
  text-transform:uppercase;font-weight:600}
.journey__shade{pointer-events:none}
.journey__casing{fill:none;stroke:var(--paper);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.journey__line{fill:none;stroke:var(--ink-mute);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.journey__done{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.journey__stops circle{transition:fill var(--slow) var(--ease),stroke var(--slow) var(--ease)}
.journey__stop-halo{fill:var(--paper);stroke:var(--line);stroke-width:1}
.journey__stop{fill:var(--paper);stroke:var(--ink-mute);stroke-width:1.5}
.journey__stop.is-passed{fill:var(--ink);stroke:var(--ink)}
.journey__bus{will-change:transform}
.journey__bus-body{fill:var(--ink)}
.journey__bus-glass{fill:var(--paper)}
.journey__dest-halo{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.journey__dest-ring{fill:none;stroke:var(--ink);stroke-width:2}
.journey__dest-dot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.journey__dest-pulse{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;
  transform-box:fill-box;transform-origin:center}
.journey__dest-flag path:first-child{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.journey__dest-flag path:last-child{fill:var(--ink)}
.journey__dest.is-arrived .journey__dest-dot{fill:var(--ink)}
.journey__dest.is-arrived .journey__dest-pulse{animation:journeyping var(--pulse) var(--ease-glide) infinite}
@keyframes journeyping{from{transform:scale(.55);opacity:.9}to{transform:scale(1.9);opacity:0}}
.journey__confetti-0{fill:var(--ink)}
.journey__confetti-1{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.journey__confetti-2{fill:var(--line-strong)}
.journey__confetti-3{fill:var(--ink-soft)}
.journey__confetti-4{fill:var(--bg-raised)}
.journey__cuts{position:relative;z-index:1;display:grid;
  max-width:var(--landing-max);margin-inline:auto;padding:var(--s3) var(--gutter) var(--s6)}
.journey__caption{grid-column:1/-1;margin:0;padding-block:var(--s4) var(--s1);font-size:var(--f-cap);
  text-transform:uppercase;letter-spacing:.18em;color:var(--ink-mute);
  font-variant-numeric:tabular-nums}
.journey__cut{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);
  padding-block:clamp(3.5rem,9vh,7rem);max-width:min(100%,34rem)}
/* Below 900 the copy is a single column and the road hugs the far edge behind it, so the
   last thing a line of type touches is the gutter, not the corridor. `data-side` is written
   by lib/landing-parts.js from the cut's index — the alternation is content, not a media query,
   so a reader on a phone still gets the same order as one on a 30-inch display. */
@media (max-width:899px){.journey__cut{padding-inline-end:3rem}}
@media (min-width:900px){
  .journey__cut{width:52%;max-width:none;padding-block:clamp(6rem,17vh,13rem)}
  .journey__cut[data-side="right"]{margin-inline-start:auto;align-items:flex-end;text-align:end}
  .journey__cut[data-side="right"] .journey__rule{justify-content:flex-end}
}
.journey__rule{display:flex;gap:var(--s2);font-size:var(--f-cap);text-transform:uppercase;
  letter-spacing:.16em;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.journey__rule span:first-child{font-weight:var(--fw-semi);color:var(--ink)}
.journey__word{margin:0;font-size:clamp(1.8rem,6.5vw,5rem);line-height:.85;letter-spacing:-.05em;
  margin-inline-start:-.05em;display:block;
  text-transform:uppercase;font-variation-settings:"wght" 430;
  /* --near (0…1) is written by the scrub as the word crosses the middle of the
     viewport; the opacity is the second half of the same gesture. */
  opacity:calc(.55 + var(--near,0) * .45);will-change:font-variation-settings,opacity}
/* One word per line, always: `display:block` on each line is written by the markup rather
   than left to `word-break`, because the phrase must stay one string for a screen reader and
   for search, and because a hyphenated "veri- fied" at 5rem is not a design decision. The
