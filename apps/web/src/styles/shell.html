   count of lines is the count of words — two for "Verified drivers", four for "Cash at the
   door" — and Arabic, where the same phrase is two words, stacks the same way. */
.journey__wordline{display:block;hyphens:none;text-wrap:nowrap}
.journey__body{font-size:var(--f-body);line-height:1.5;max-width:44ch;color:var(--ink-soft);margin:0}
/* One column, deliberately: the claims alternate down a single spine so each one can be
   lit by the spotlight as the bus reaches it. Two columns would put two words at the same
   height and the gesture would have no subject. */

/* ── the page transition ───────────────────────────────────────────────────────
   Drawn by lib/pagefx.js: a full-bleed path that rises over the page and falls away.
   It covers the surface and nothing else — no pointer reaches the page through it, and
   it is aria-hidden because it says nothing a reader needs to hear twice. */
.pagefx{position:fixed;inset:0;width:100%;height:100%;display:block;
  z-index:var(--z-pagefx);pointer-events:none}
.pagefx__path{fill:var(--fx-ink);stroke:none}

/* ── the inverted slab: the steps, printed the other way round ─────────── */
.landing__slab{grid-column:1/-1;background:var(--stage);color:var(--paper);
  padding:clamp(4rem,12vh,9rem) var(--gutter);margin-block-start:clamp(3rem,8vh,6rem)}
.landing__slab>*{max-width:var(--landing-max);margin-inline:auto}
.landing__slab-k{font-size:var(--f-cap);text-transform:uppercase;letter-spacing:.16em;
  opacity:.55;margin:0}   /* the space under it is the weld's, not its own */
.landing__slab-t{font-size:var(--f-poster);line-height:.98;letter-spacing:-.04em;
  font-weight:var(--fw-bold);max-width:18ch;margin:0}
/* The centred slab: what the page most wants acted on gets the axis, the poster title and
   the inverted surface — black on the light sheet, paper on the dark one, the same pair the
   steps use. A kick, a title, one lede, one button, and nothing else. */
.landing__slab--mid{text-align:center}
.landing__slab--mid .landing__slab-t,.landing__slab--mid .landing__slab-k{margin-inline:auto}
.landing__slab--mid .landing__lede{margin-inline:auto;max-width:56ch}
.landing__slab--mid .landing__acts{justify-content:center}
/* A primary button is ink on paper. Dropped on the slab it would be ink on ink: the pair
   turns over with the section, and the hover keeps the same relationship instead of
   inventing a third look for one button. */
.landing__slab .btn:not(.btn--bare){background:var(--paper);color:var(--ink);border-color:var(--paper)}
.landing__slab .btn:not(.btn--bare):hover{background:var(--paper);color:var(--ink);opacity:.9}
.landing__steps{list-style:none;display:grid;gap:var(--s3);margin:0;padding:0}
/* No rule above the steps, at either quoted heading. The slab's own colour change is the
   separator — a hairline on top of a background change says "edge" twice. */
.landing__step{position:relative;min-width:0}
.landing__stepnum{display:block;font-size:var(--f-cap);letter-spacing:.16em;opacity:.5;
  font-variant-numeric:tabular-nums;margin-bottom:var(--s1)}
.landing__stept{font-size:var(--f-title);font-weight:var(--fw-semi);letter-spacing:-.02em;
  margin:0 0 .4rem}
.landing__stepb{font-size:var(--f-body);line-height:1.6;opacity:.72;max-width:34ch;margin:0}
@media (min-width:800px){
  .landing__steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
  /* Four steps (the drive page) still read as one row, not a widow. */
  .landing__steps:has(.landing__step:nth-child(4)){grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ── the chapters: numbered rows, never a card checkerboard ─────────── */
.landing__feature{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2);min-width:0;
  padding-block:var(--s5);
  transition:transform var(--slow) var(--bounce),background var(--med) var(--ease)}
.landing__feature:hover{transform:translateY(-2px);background:var(--bg-raised)}
.landing__featuren{font-size:var(--f-cap);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-mute);font-weight:var(--fw-semi);font-variant-numeric:tabular-nums}
.landing__featuret{font-size:var(--f-panel);font-weight:750;letter-spacing:-.03em;line-height:1;
  text-transform:uppercase;max-width:14ch;margin:0;text-wrap:balance}
.landing__featured{color:var(--ink-soft);font-size:var(--f-lg);max-width:44ch;margin:0}
@media (min-width:900px){.landing__feature{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:baseline}}

/* ── the closer ─────────────────────────────────────────────────────── */
.landing__cta{grid-column:2;padding-block:clamp(4rem,12vh,9rem);border:0}
.landing__cta-t{font-size:var(--f-end);line-height:1.1;letter-spacing:-.035em;
  font-weight:var(--fw-semi);max-width:20ch;margin:0;text-wrap:balance}
.landing__cta-t span{color:var(--ink-mute);font-weight:var(--fw-normal)}
.landing__cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding-top:0}
.landing__cta-note{font-size:var(--f-cap);color:var(--ink-mute)}

/* ── the foot: padding-block only ─────────────────────────────────────
   The shorthand would reset the gutter the page grid relies on and push the
   links flush to the viewport edge — the demo shipped that bug; this does not. */
.landing__foot{grid-column:1/-1;
  padding:var(--s6) var(--gutter) var(--s4);display:grid;gap:var(--s3);font-size:var(--f-cap)}
.landing__footrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s2)}
.landing__footrow a,.landing__policylink{color:var(--ink-soft);text-decoration:none;
  background:none;border:0;padding:0;cursor:pointer;font:inherit}
.landing__footrow a:hover,.landing__policylink:hover{color:var(--ink)}
.landing__policies{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.landing__fine{color:var(--ink-mute);font-size:var(--f-micro)}

/* ── sub-pages: measure, FAQ, download cards, policy docs ────────────── */
.landing__pagetop{padding-block-start:clamp(6rem,16vh,10rem)}
.landing__prose{max-width:60ch;display:grid;gap:var(--s3)}
.landing__prose>.landing__p{margin:0}
.landing__faq{border-top:1px solid var(--line);display:grid}
.landing__faqitem{border-bottom:1px solid var(--line)}
.landing__faqitem summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;
  align-items:center;gap:1rem;padding:1.1rem 0;font-weight:var(--fw-semi);font-size:var(--f-head);
  letter-spacing:-.01em}
.landing__faqitem summary::-webkit-details-marker{display:none}
.landing__faqitem summary::after{content:"+";font-weight:var(--fw-bold);font-size:1.3rem;color:var(--ink-mute)}
.landing__faqitem[open] summary::after{content:"–"}
.landing__faqitem .landing__p{padding:0 0 1.2rem;max-width:60ch}
/* `1fr` is `minmax(auto,1fr)`: a track cannot be narrower than its content, so a
   wide child (the QR figure's caption sets the floor) burst the card instead of
   shrinking into it. minmax(0,…) is the difference between a fluid grid and one that
   overflows the moment the copy is longer than the space. */
.landing__dlcards{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--flow)}
/* Android and iPhone are one decision seen twice, so at any width with room they sit
   beside each other instead of making the reader scroll past the first to find the
   second. `minmax(0,1fr)`: a track that may shrink below its content. */
@media (min-width:700px){.landing__dlcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.landing__dlcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3);
  display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.landing__dlcard-t{font-weight:var(--fw-black);font-size:var(--f-head);text-transform:uppercase;
  letter-spacing:-.01em}
.landing__dlcard-s{color:var(--ink-mute);font-size:var(--f-body)}
.landing__dlmeta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);font-size:var(--f-micro);
  color:var(--ink-mute);font-variant-numeric:tabular-nums}
/* The user-agent sheet gives `figure` 40 px of inline margin. On a poster that is a
   80 px tax on every image, and at 320 px it pushed the install code out of the card
   and the scroller out of its own width — so figures on this surface own their space. */
.landing figure{margin:0}
.landing__qr{display:grid;gap:var(--s2);justify-items:center;width:100%;min-width:0}
.landing__qr svg{width:min(180px,52vw);height:auto;display:block}
.landing__qr figcaption{font-size:var(--f-micro);color:var(--ink-mute);text-align:center}
.landing__doc{max-width:60ch;display:grid;gap:var(--s2)}
/* A policy: the text in one readable measure, and the way through it beside it. Above
   the width where two columns are honest, the rail is sticky and holds its place under
   the bar; below it, the rail sits over the text as a list of ways in — never hidden,
   because a hidden control takes its function with it. */
.landing__doc2{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr);align-items:start}
.landing__docrail{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0;padding:0}
.landing__railink{appearance:none;background:none;border:0;padding:var(--s1) 0;margin:0;
  font:inherit;font-size:var(--f-small);line-height:var(--lh-tight);color:var(--ink-soft);
  text-align:start;cursor:pointer;border-bottom:1px solid transparent}
.landing__railink:hover{color:var(--ink);border-bottom-color:var(--ink)}
.landing__railink[aria-current="true"]{color:var(--ink);font-weight:var(--fw-semi);
  border-bottom-color:var(--ink)}
@media (min-width:900px){
  /* The measure the narrow column needs is not the measure a wide track needs: with a
     rail beside it, the text is already confined by the grid, and re-capping it at 60ch
     inside a 48rem track leaves a third of the page empty and the pair off-centre. */
  /* The poster grid justifies its items to their content, so a nested grid with an `fr`
     track would size that track from the text and collapse the pair to a narrow band.
     Both the block and its column have to claim the measure before `fr` means anything. */
  .landing__doc2{grid-template-columns:minmax(0,16rem) minmax(0,1fr);gap:var(--s7);justify-self:stretch;width:100%}
  /* The narrow measure belongs on the text column, not on the wrapper that holds the
     rail beside it: the outer .landing__doc caps at 60ch, and left to itself that cap
     clamps the pair — rail, gap and text — down to a band. */
  .landing__doc:has(.landing__doc2){max-width:none}
  .landing__doc2{max-width:min(100%,72rem);margin-inline:auto}
  .landing__doc2 .landing__doc{max-width:70ch;width:100%}
  .landing__docrail{position:sticky;top:calc(var(--bar-clearance) + var(--s3));
    display:grid;gap:var(--s2);flex-wrap:nowrap}
  /* The tap box keeps its height in the wide layout too: 24px is the floor the
     suite measures, and an underline is a decoration, not a hit area. */
  .landing__railink{font-size:var(--f-body);border-bottom:0;padding-block:var(--s1);min-height:24px}
  .landing__railink:hover,.landing__railink[aria-current="true"]{border-bottom:0;
    text-decoration:underline;text-underline-offset:.28em}
}
.landing__doc .landing__note{font-style:italic;margin-block:var(--s1) var(--s5)}
.landing__docsec h2{margin:var(--s5) 0 var(--s1);font-size:var(--f-head);font-weight:var(--fw-bold);
  text-transform:uppercase;letter-spacing:.02em}
.landing__docsec p{color:var(--ink-soft);margin:0}

/* ── reveal and the weight floor ──────────────────────────────────────
   The end state is also the no-JS state: an element that never gets
   [data-rv="in"] is still only *hidden by the observer's own rule*, so the page
   is readable if the script is blocked. `--d` staggers siblings from the markup. */
/* One rhythm for the whole marketing surface: blocks of a section are one --flow
   apart, a paragraph's next paragraph is one --s2, and a kick stays welded to the
   title it introduces. This sits at the END of the landing sheet on purpose — every
   component above keeps its own margin for the user-agent reset's sake, and the
   section rhythm overrules them from here, so no page can set a gap that disagrees
   with the poster. Two used to: the drive page's lede above its button, and About's
   last line above its own. */
.landing__section>*+*,.landing__cta>*+*,.landing__slab>*+*{margin-block-start:var(--flow)}
.landing__p+.landing__p{margin-block-start:var(--s2)}
.landing__kick+*,.landing__slab-k+*{margin-block-start:var(--s2)}
/* A slab's title is a poster line: it opens the space under itself wider than the
   flow, and that step is declared here, with the rest of the rhythm, not inside the
   component that draws the title. */
.landing__slab-t+*{margin-block-start:clamp(2.5rem,7vh,5rem)}

.landing [data-rv]{opacity:0;transform:translateY(14px);
  transition:opacity var(--rev) var(--ease-glide),transform var(--rev) var(--ease-glide);
  transition-delay:var(--d,0ms)}
.landing [data-rv="in"]{opacity:1;transform:none}
.landing [data-word]{opacity:calc(.55 + var(--near,0) * .45)}
@media (prefers-reduced-motion:reduce){
  .landing{scroll-behavior:auto}
  .landing [data-rv]{opacity:1;transform:none;transition:none}
  .landing__displayline>span{font-variation-settings:"wght" 900}
  .landing [data-word]{font-variation-settings:"wght" 900;opacity:1}
  .journey__stops circle{transition:none}
  .journey__dest.is-arrived .journey__dest-pulse{animation:none}
}

/* ── RTL: Arabic un-mirrors what must not mirror ──────────────────────
   No uppercase, no negative tracking, a thinner outline (a 2px box around
   joined Arabic reads as a smudge), and the journey's right-hand cut keeps its
   physical side — the road, not the reading order, decides where the copy sits. */
[dir="rtl"] .landing__display,[dir="rtl"] .landing__displayline>span,
[dir="rtl"] .journey__word,[dir="rtl"] .landing__slab-t,[dir="rtl"] .landing__title,
[dir="rtl"] .landing__featuret,[dir="rtl"] .landing__cta-t,
[dir="rtl"] .landing__kick,[dir="rtl"] .journey__caption,
[dir="rtl"] .journey__rule,[dir="rtl"] .landing__featuren,[dir="rtl"] .landing__stepnum{
  text-transform:none;letter-spacing:0}
/* Arabic has no uppercase and no light weight to lean on for poster impact, so the
   display roles get their own face here and nowhere else: Jomhuria (or whichever face
   fonts.json marks `display`) answers only inside the RTL tree, at the size the face
   needs to hold the same visual weight as the Latin beside it (size-adjust, in the
   @font-face — one number, measured, not a clamp per component). */
[dir="rtl"] .landing__display,[dir="rtl"] .landing__displayline>span,
[dir="rtl"] .journey__word,[dir="rtl"] .landing__slab-t,[dir="rtl"] .landing__title,
[dir="rtl"] .landing__featuret,[dir="rtl"] .landing__cta-t{font-family:var(--brand-font-display)}
[dir="rtl"] .landing__displayline--out>span{-webkit-text-stroke-width:1.2px}
/* auth — centered card over the page background. width:100% for the same
   #root-flex reason as .landing. */
.authwrap{width:100%;min-width:0;height:100%;overflow-y:auto;display:flex;
  align-items:center;justify-content:center;
  padding:var(--s6) var(--s4);background:var(--bg-page);
  -webkit-overflow-scrolling:touch}
.authwrap__card{position:relative;width:min(440px,100%);display:flex;flex-direction:column;
  gap:var(--s4);background:var(--bg-base);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s6);box-shadow:var(--sh-2);
  animation:pagein var(--med) var(--ease)}
.authwrap__back{position:absolute;top:var(--s3);inset-inline-start:var(--s3);
  width:var(--tap-sm);height:var(--tap-sm);border-radius:var(--r-full);
  display:grid;place-items:center;color:var(--text-secondary)}
.authwrap__back:hover{background:var(--bg-sunken);color:var(--text-primary)}
.authwrap__back svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.authwrap__card>.center>svg{width:56px;height:56px}

/* page-enter motion — every screen transitions in; killed by reduced-motion */
.main__inner{animation:pagein var(--med) var(--ease)}
.metric--link{cursor:pointer;transition:border-color var(--fast) var(--ease),
  transform var(--fast) var(--ease)}
.metric--link:hover{border-color:var(--accent);transform:translateY(-1px)}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* sign-up role choice cards (rider / driver) */
.rolechoice{display:flex;align-items:center;gap:var(--s4);width:100%;min-width:0;
  padding:var(--s4);border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--bg-raised);text-align:start;transition:border-color var(--fast) var(--ease),
  background var(--fast) var(--ease),transform var(--fast) var(--ease)}
.rolechoice:hover{border-color:var(--accent);transform:translateY(-1px)}
.rolechoice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.rolechoice__ico{width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;
  flex:none;background:var(--accent-soft);color:var(--accent-text)}
.rolechoice__ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.rolechoice__text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rolechoice__title{font-size:var(--f-lg);font-weight:var(--fw-bold);color:var(--text-primary);
  line-height:var(--lh-snug)}
.rolechoice__sub{font-size:var(--f-body);color:var(--text-secondary);line-height:var(--lh-snug)}
.rolechoice .chev{color:var(--text-muted);width:var(--icon-md);height:var(--icon-md);flex:none}
[dir="rtl"] .rolechoice .chev{transform:scaleX(-1)}

/* map: hero zoom crop + real-map + locate */
.mapbox--zoom .mapsvg{transform:scale(1.22);transform-origin:center}
.mapbox--real{background:var(--map-land)}
/* Third-party tiles are the one part of a map we do not draw, so they are
   filtered into the product's register instead of being restyled. The vector
   overlay is a sibling, not a child, so the route and the vehicle dot keep
   full ink contrast above it. */
.mapbox--real .leaflet-tile,
.mapbox--real .gm-style,
.mapbox__canvas .gm-style{filter:var(--map-tile-filter)}
.mapbox__canvas{position:absolute;inset:0}
.mapbox__locate{position:absolute;bottom:var(--s3);inset-inline-start:var(--s3);z-index:5;
  display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  border-radius:var(--r-full);background:var(--bg-base);color:var(--text-primary);
  box-shadow:var(--sh-2);font-size:var(--f-cap);font-weight:var(--fw-semi)}
.mapbox__locate svg{width:var(--icon-md);height:var(--icon-md);fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* accent-coloured text selection (owner request) */
::selection{background:var(--accent);color:var(--on-accent)}
::-moz-selection{background:var(--accent);color:var(--on-accent)}

/* scrollbars are present but invisible (owner request): every scroller stays
   scrollable, the visual bar is hidden. */
*{scrollbar-width:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

</style>
</head>
<body data-theme="light">
<script>
/* Apply the saved theme before first paint so dark users never see a
   light flash. Mirrors the resolution logic in render(). */
(function(){
  var t="light";
  try{ t=localStorage.getItem("rs.theme")||"auto"; }catch(e){}
  if(t==="auto"){
    try{ t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"; }
    catch(e){ t="light"; }
  }
  document.documentElement.setAttribute("data-theme",t);
})();
</script>
<div id="root"></div>
</body>
</html>
