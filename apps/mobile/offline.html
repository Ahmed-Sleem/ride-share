<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride Share</title>
/*__RS_FACES__*/
<style>
/* This page boots inside the APK, before any request is possible, so it cannot read the
   web bundle's stylesheet. Its palette therefore mirrors the app's ink values by hand —
   paper, ink, hairline grey — and the font stack is injected by scripts/build.js from
   packages/brand/brand.json, so the typeface is never a second source of truth. Keep the
   colours below in step with apps/web/src/styles/shell.html if either changes. */
/* Colours are deliberately NOT declared here. paper/ink/muted/hairline live in
   packages/brand/brand.json, and scripts/build.js injects them — in both themes — at the marker
   inside the :root below. Hand-mirroring them is what left this page a grey step out of step with
   the app it boots into, which is the reason the palette now has one source. */
:root{
  --s4:16px; --s5:20px; --s6:24px; --tap:44px; --r:14px;
  --ease:cubic-bezier(.2,.7,.3,1);
  /*__RS_BRAND__*/
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.5 var(--brand-font, ui-sans-serif, system-ui, sans-serif)}
.splash,.offline{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s4);padding:var(--s6);text-align:center;padding-top:env(safe-area-inset-top,0px)}
.offline{display:none}
.logo{width:92px;height:92px;animation:b 1.1s var(--ease) infinite}
.logo svg{width:100%;height:100%}
.name{font-size:22px;font-weight:750}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
/* The reason has to be where the user is looking. The status line inside the splash is hidden
   the moment the offline card appears, so a failure recorded only there was a failure nobody
   saw - which is how a mis-baked build came to look like a passenger with no data. */
.why{font-size:13px;color:var(--muted);min-height:1.4em;margin:0;overflow-wrap:anywhere}
h1{margin:0;font-size:18px;font-weight:750}
p{margin:0;max-width:28ch;color:var(--muted)}
.btn{min-height:var(--tap);padding:0 var(--s5);border:0;border-radius:var(--r);font:650 15px/1 inherit;
  background:var(--brand);color:var(--on);cursor:pointer}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="currentColor" fill-rule="evenodd" d="M10.6223 3.90741c-1.20712-1.20714-3.09489-1.23486-4.30929-.02046-.41495.41495-.71699.96417-.84122 1.55432-.59015.12423-1.13937.42627-1.55432.84122-1.2144 1.2144-1.18669 3.10218.02046 4.30931.96862.9686 2.37548 1.1779 3.52103.5953l1.47896 1.3553c-.05911.3509-.08406.7078-.07998 1.0623.01453 1.26.39197 2.5758 1.00914 3.7262.13522.252.37182.4341.65002.5002.2782.0661.5714.0099.8055-.1543.5376-.3772.9988-.4969 1.3707-.4979.3764-.0009.7303.1199 1.0473.3317.5919.3956.8671 1.1024.4524 2.0481-.1383.3154-.1045.6799.0894.9646.1939.2847.5207.4495.8649.4362 1.437-.0553 2.7584-.8034 3.8989-1.9439 1.1842-1.1842 1.7637-2.5978 1.6758-4.071-.0866-1.4527-.8131-2.8268-1.9736-3.9873-1.1796-1.17955-2.7171-1.95508-4.2554-2.16837-.5785-.08021-1.1679-.08125-1.7413.01127l-1.5065-1.42739c.548-1.13519.3301-2.5124-.6229-3.4654Zm.0919 5.71744L9.2479 8.23554c-.19592-.18563-.30849-.44256-.31213-.71243-.00363-.26987.10196-.52975.29281-.72059.41457-.41457.42454-1.03588-.02046-1.48089-.44501-.44501-1.06633-.43503-1.4809-.02046-.26525.26524-.35944.64193-.30022.89134.08017.33765-.02045.69273-.26584.93813-.2454.2454-.60048.34602-.93813.26584-.24941-.05922-.6261.03498-.89135.30022-.41457.41457-.42455 1.03589.02046 1.4809.44501.44501 1.06633.43503 1.4809.02046.37853-.37854.98803-.39183 1.38271-.03016l1.5307 1.4027c.11824-.1603.24972-.314.39525-.4595.1813-.1813.3728-.34306.5725-.48625Z"/>
    </svg>
  </div>
  <div class="name">Ride Share</div>
  <div class="status" id="status"></div>
</div>
<div class="offline" id="offline" role="alert">
  <h1>Check your internet connection</h1>
  <p class="why" id="why"></p>
  <p>We need a connection to load rides and tickets.</p>
  <button type="button" class="btn" id="retry">Retry</button>
</div>
<script>
(function(){
  var origin = (window.__RS_PUBLIC_ORIGIN || "").replace(/\/$/, "");
  var appId = window.__RS_APP_ID || "eg.rideshare.app";
  var splash = document.getElementById("splash");
  var off = document.getElementById("offline");
  var statusEl = document.getElementById("status");
  var KEY_BUNDLE = "rs.ota.bundle.v1";
  var KEY_SHA = "rs.ota.sha.v1";
  var KEY_VER = "rs.ota.ver.v1";

  var whyEl = document.getElementById("why");
  var retryEl = document.getElementById("retry");
  var trying = false;
  function setStatus(msg) {
    if (statusEl) statusEl.textContent = msg || "";
    if (whyEl) whyEl.textContent = msg || "";
  }
  function showOffline() { splash.style.display = "none"; off.style.display = "flex"; }
  function showSplash() { splash.style.display = "flex"; off.style.display = "none"; }
  /* Retry used to be a control that could not be told apart from a wall: it re-ran boot()
     with no state, so a second tap was swallowed and nothing visibly happened. It now says
     it is working, ignores taps while working, and puts the mark back up - an attempt
     should look like an attempt. */
  function setBusy(is) {
    trying = is;
    if (!retryEl) return;
    retryEl.disabled = is;
    retryEl.textContent = is ? "Retrying..." : "Retry";
  }

  function getCached() {
    try {
      var html = localStorage.getItem(KEY_BUNDLE);
      var sha = localStorage.getItem(KEY_SHA);
      var ver = Number(localStorage.getItem(KEY_VER)) || 0;
      if (html && html.length > 500 && sha) return { html: html, sha: sha, ver: ver };
    } catch (e) {}
    return null;
  }

  function saveBundle(html, sha, ver) {
    try {
      localStorage.setItem(KEY_BUNDLE, html);
      localStorage.setItem(KEY_SHA, sha);
      localStorage.setItem(KEY_VER, String(ver || 0));
    } catch (e) {
      console.warn("[ota] failed to save bundle to localStorage", e);
    }
  }

  function mountBundle(html) {
    try {
      document.open("text/html", "replace");
      document.write(html);
      document.close();
    } catch (e) {
      console.error("[ota] mount failed", e);
      document.documentElement.innerHTML = html;
    }
  }

  async function computeSha256(str) {
    if (typeof crypto !== "undefined" && crypto.subtle) {
      var enc = new TextEncoder();
      var buf = await crypto.subtle.digest("SHA-256", enc.encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
    }
    return null;
  }

  /* The boot page reads its interface from a public route, so it sends nothing that a browser
     would have to preflight for. The old three proof headers were always attached and always
     useless - the key they were computed from was empty in the shipped build - and they cost
     every launch an OPTIONS round trip. Device enrolment belongs to the app itself, after the
     bundle is mounted (see lib/api.js); the splash's job is only to fetch and verify. */
  function bootHeaders() {
    return { "x-rs-app-id": appId };
  }

  async function fetchWithTimeout(url, opts, ms) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = null;
    var signal = controller ? controller.signal : undefined;
    var p = fetch(url, Object.assign({}, opts, { signal: signal }));
    var timeoutPromise = new Promise(function(_, reject) {
      timer = setTimeout(function() {
        if (controller) controller.abort();
        reject(new Error("TIMEOUT"));
      }, ms);
    });
    return Promise.race([p, timeoutPromise]).finally(function() { clearTimeout(timer); });
  }

  async function probeHealth() {
    try {
      var r = await fetch(origin + "/healthz", { cache: "no-store" });
      return !!r.ok;
    } catch(e) { return false; }
  }

  async function boot() {
    showSplash();
    var cached = getCached();
    if (!origin) {
      if (cached) return mountBundle(cached.html);
      setStatus("This build was not given a server address. Reinstall the current installer.");
      return showOffline();
    }
    setStatus("Connecting to " + origin.replace(/^https?:\/\//, "") + "...");

    try {
      // Step 1: ask the service what the current interface is (2.5s timeout)
      var updateHeaders = bootHeaders();
      var res = await fetchWithTimeout(origin + "/v1/mobile/update", {
        headers: updateHeaders,
        cache: "no-store"
      }, 2500);

      if (!res.ok) {
        if (cached) return mountBundle(cached.html);
        return showOffline();
      }

      var meta = await res.json();
      if (!meta || !meta.ok || !meta.sha256) {
        if (cached) return mountBundle(cached.html);
        return showOffline();
      }

      // Step 2: Check if cached bundle is identical
      if (cached && cached.sha === meta.sha256) {
        return mountBundle(cached.html);
      }

      // Step 3: Fetch fresh bundle
      setStatus("Updating...");
      var bundleHeaders = bootHeaders();
      var bRes = await fetchWithTimeout(origin + "/v1/mobile/bundle", {
        headers: bundleHeaders,
        cache: "no-store"
      }, 8000);

      if (!bRes.ok) {
        if (cached) return mountBundle(cached.html);
        return showOffline();
      }

      var html = await bRes.text();
      // Step 4: Verify SHA-256 integrity
      var computedSha = await computeSha256(html);
      if (computedSha && computedSha.toLowerCase() !== meta.sha256.toLowerCase()) {
        console.warn("[ota] sha256 mismatch: expected " + meta.sha256 + ", got " + computedSha);
        if (cached) return mountBundle(cached.html);
        return showOffline();
      }

      // Step 5: Save verified bundle and mount
      saveBundle(html, meta.sha256, meta.versionCode);
      return mountBundle(html);

    } catch (err) {
      console.warn("[ota] boot error:", err);
      if (cached) return mountBundle(cached.html);
      var host = origin.replace(/^https?:\/\//, "");
      setStatus(err && err.message === "TIMEOUT"
        ? host + " did not answer in time. Check the connection and try again."
        : host + " could not be reached from this device.");
      showOffline();
    } finally {
      setBusy(false);
    }
  }

  retryEl.addEventListener("click", function () {
    if (trying) return;
    setBusy(true);
    showSplash();
    boot();
  });
  boot();
})();
</script>
</body>
</html>
