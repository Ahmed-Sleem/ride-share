# Continuous integration (BUILD_PLAN P0.11). Runs the SAME commands a
# developer runs locally — there is no parallel list of steps that can drift
# (§0.3). Merges are blocked on green (branch protection set in repo settings).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref, newest wins. Four pushes in this session started four full
# browser-suite runs against the same main, each queued behind the one ahead of
# it, and only the newest commit's verdict can be acted on. A cancelled run
# therefore carries no verdict for its own commit: that is the trade, and it is
# the right one here, because Railway deploys from the push itself (live matched
# the committed artifact 45s after a push while CI was still running). No deploy
# waits on CI, and the head of main is always the state that gets checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (repo + api + web unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  verify-gui:
    name: Verify GUI (full browser suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pnpm store cache makes install skip dependency postinstalls
      # (packages are "reused" as already built), so puppeteer's Chrome
      # download never runs on cached runs — cache the browser itself and
      # install it explicitly (idempotent; downloads only on cache miss).
      - name: Cache puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - run: pnpm --filter @ride-share/web exec puppeteer browsers install chrome
      # The same command the app's own rules call "known-good", minus the mutation passes, which
      # run in verify-breaks so a pull request does not wait 45 minutes for the browser results.
      - name: Run the web verifier (break-detection runs in parallel, see verify-breaks)
        env:
          RS_SKIP_BREAKS: "1"
        run: pnpm --filter @ride-share/web verify

  # The same suites as verify-gui, minus the 45 minutes of mutation testing, so a pull request
  # learns in minutes whether the GUI holds; this job answers whether the guards still bite. Both
  # are required, neither waits for the other, and neither duplicates the command list — CI calls
  # verify.sh either way, with one flag deciding how far it goes.
  verify-breaks:
    name: Break-detection (guards must fail on purpose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, then break the app on purpose
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          pnpm --filter @ride-share/web build
          bash apps/web/tests/breaks.sh
          bash apps/web/tests/layout-breaks.sh

  verify-db:
    name: Verify database (migrations + schema drift + types)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride
          POSTGRES_DB: rideshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride -d rideshare"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify
        env:
          DATABASE_URL: postgres://ride:ride@localhost:5432/rideshare

  images:
    name: Build both container images (non-root)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f infra/docker/Dockerfile.node --build-arg PROJECT=api -t ride-share-api .
      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.node --build-arg PROJECT=web -t ride-share-web .
      - name: Build mobile image (Capacitor wrap / Railway health)
        run: docker build -f apps/mobile/Dockerfile -t ride-share-mobile .
      - name: Runner must not run as root (P0.4)
        run: |
          uid="$(docker run --rm --entrypoint sh ride-share-api -c 'id -u')"
          test "$uid" != "0" || { echo "api image runs as root"; exit 1; }
          uid="$(docker run --rm --entrypoint sh ride-share-web -c 'id -u')"
          test "$uid" != "0" || { echo "web image runs as root"; exit 1; }
          uid="$(docker run --rm --entrypoint sh ride-share-mobile -c 'id -u')"
          test "$uid" != "0" || { echo "mobile image runs as root"; exit 1; }

  apk:
    name: Android debug APK (Capacitor)
    needs: verify
    runs-on: ubuntu-latest
    # The publish step below writes a release, and the default token is read-only; this job says
    # what it needs instead of the whole workflow being widened.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: pnpm install --frozen-lockfile
      - name: Wrap web + generate Android project + assembleDebug
        env:
          MOBILE_PUBLIC_ORIGIN: ${{ vars.MOBILE_PUBLIC_ORIGIN }}
        run: bash apps/mobile/scripts/make-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ride-share-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An artifact needs a GitHub login to fetch, so a QR pointing at one is a control that
      # pretends to work. A release asset is the same bytes with a public, stable URL: the tag is
      # rolling (rebuilt from every main), the asset name comes from brand.json, and `--clobber`
      # means the link never changes when the build does.
      - name: Publish the installer where the landing page can point at it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls apps/mobile/android/app/build/outputs/apk/debug/*.apk | head -1)
          TAG=$(node -e 'process.stdout.write(require("./packages/brand/brand.json").download.release.tag)')
          NAME=$(node -e 'process.stdout.write(require("./packages/brand/brand.json").download.apk)')
          REPO=$(node -e 'process.stdout.write(require("./packages/brand/brand.json").download.release.repository)')
          [ "$REPO" = "${{ github.repository }}" ] || { echo "brand.json points at $REPO, this run is ${{ github.repository }}" >&2; exit 1; }
          cp "$APK" "$NAME"
          NOTES="Debug build of the app, rebuilt from every push to main (commit ${{ github.sha }}). Debug-signed, so Android asks to allow installs from unknown sources; the GUI itself updates over the air, so a newer interface does not need this file again."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Android debug build" --notes "$NOTES"
          else
            gh release create "$TAG" --target "${{ github.sha }}" --prerelease --latest --title "Android debug build" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$NAME" --clobber
          echo "https://github.com/$REPO/releases/download/$TAG/$NAME" 

      # The owner's rule for this project: the built installer is kept IN the repo, because the GUI
      # updates over the air and a new binary is a rare event — so the history pays for the file once
      # per release instead of per interface change. apps/web/server.js already serves
      # apps/web/downloads/android.apk, which is why this path and no other. Committed only when the
      # bytes differ, and refused above 60 MB so nothing can bury the clone by accident.
      - name: Save the installer in the repo, where apps/web serves it from
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC=$(ls apps/mobile/android/app/build/outputs/apk/debug/*.apk | head -1)
          DEST=apps/web/downloads/android.apk
          SIZE=$(stat -c%s "$SRC")
          if [ "$SIZE" -gt 62914560 ]; then echo "APK_TOO_BIG: ${SIZE} bytes will not be committed" >&2; exit 1; fi
          NEW=$(sha256sum "$SRC" | cut -d' ' -f1)
          OLD=""
          if git cat-file -e "HEAD:$DEST" 2>/dev/null; then
            OLD=$(git show "HEAD:$DEST" | sha256sum | cut -d' ' -f1)
          fi
          if [ -n "$OLD" ] && [ "$NEW" = "$OLD" ]; then
            echo "installer unchanged at $DEST ($NEW) — nothing to commit"; exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          VERSION=$(node -e 'const b=require("./packages/brand/brand.json");process.stdout.write(b.version.name+" ("+b.version.code+")")')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          BODY="Built by CI from commit ${GITHUB_SHA} via apps/mobile/scripts/make-apk.sh, so the landing page's button and QR have bytes behind them at every moment — including before a release is published. The GUI itself keeps arriving over the air, so this file changes only when the binary does."
          git commit -m "Installer v${VERSION}: sha256 ${NEW:0:12} [skip ci]" -m "$BODY"
          git push origin "HEAD:main"

  apk-release:
    name: Android Play AAB (signed when secrets exist)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: pnpm install --frozen-lockfile
      - name: Release bundle (unsigned unless ANDROID_KEYSTORE_* secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_PUBLIC_ORIGIN: ${{ vars.MOBILE_PUBLIC_ORIGIN }}
        run: bash apps/mobile/scripts/make-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ride-share-release
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
