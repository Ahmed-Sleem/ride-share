# Production run on a plain Docker host (P0.13)

The identical images that run on Railway run here. Only the environment
variables differ — the platform receives a container, not a repository.

```yaml
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rideshare
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args: { PROJECT: api }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ride:${POSTGRES_PASSWORD}@db:5432/rideshare
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on: [db, redis]
    ports: ["3000:3000"]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.node
      args: { PROJECT: web }
    environment:
      PORT: 8080
    depends_on: [api]
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  dbdata:
